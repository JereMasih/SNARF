// Biblioteca de 24 plantillas (Decisión 1) — fuente única de verdad en el
// backend (snarf/telemetry/widget_templates.py), se pide una sola vez y se
// cachea acá; nunca se duplica a mano en JS.
async function ensureDashHudTemplates() {
  if (dashHudTemplates) return dashHudTemplates;
  const res = await apiFetch("/dashboard/widget_templates");
  const data = await res.json();
  dashHudTemplates = data.templates;
  return dashHudTemplates;
}
function dashHudTemplateFor(templateId) {
  return (dashHudTemplates && dashHudTemplates[templateId]) || { tier: "small", width: 220, height: 150, slots: ["body", "caption"] };
}

// Empaquetado radial CONSTRUCTIVO (Decisión 9) — bug real encontrado con
// Playwright, en dos formas distintas: (1) ningún cálculo puramente
// analítico de radios/ángulos garantizaba cero superposición para tamaños
// tan dispares (130-380px) en el espacio real disponible, y (2) un solver
// iterativo de "empujar pares que se superponen" (probado después) podía
// oscilar sin converger nunca en un grupo denso de varias cards, porque
// resolver un par podía reintroducir el choque con un tercero ya resuelto.
// Acá, en cambio, cada widget (ya en orden de score real descendente) se
// coloca UNA sola vez, en el primer lugar de una espiral creciente desde el
// centro que se verifica sin choque contra TODO lo ya colocado antes de
// aceptarlo — garantiza cero superposición por construcción, nunca depende
// de que un solver converja. "Más relevante = más cerca" sale solo de
// procesar en orden de score y probar radios chicos primero.
const HUD_COLLISION_PADDING = 16;
const HUD_GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5)); // filotaxis — evita alineación repetida entre anillos de la espiral
// Mitad del tamaño visual real del orbe dentro del stage — no solo la caja
// base (`.orb-wrap`, 180px, scale(0.74) → ~66px de mitad), sino incluyendo
// el halo de `.rays`/`.rays2` (`inset: -42px` sobre esa misma caja antes del
// scale) — un widget en reposo pegado al borde exacto de la caja base
// igual quedaba metido dentro del halo. Se usa para reservar el centro
// como obstáculo real en el empaquetado, nunca como una coordenada mágica;
// el z-index del orbe (ver CSS) es la garantía real de "nunca tapado" — esto
// solo evita que en reposo un widget quede pegoteado contra el halo.
const HUD_ORB_HALF_SIZE = 96;

// `cx`/`cy` SIEMPRE el centro real y completo del stage — tiene que
// coincidir exactamente con dónde el CSS posiciona al orbe
// (`.dash-hud-orb { left:50%; top:50% }`), nunca un centro corrido para
// otro fin. Bug real encontrado con Playwright: una versión anterior movía
// `cy` hacia arriba para "dejarle lugar" al chat-dock fijo de abajo —
// technically funcionaba para ESE propósito, pero descentraba el origen de
// la espiral respecto del orbe real (~130px de diferencia), así que el
// widget "central" (rank 0) terminaba pisando al orbe en vez de rodearlo.
// El margen para el chat-dock ahora se resuelve aparte, con `bottomReserve`
// — solo empuja el LÍMITE inferior de búsqueda, nunca el origen. Mismo
// criterio para `dockLeft`/`dockRight`/`dockTop` (Decisión: "todos los
// globos visibles, nunca tapados por el chat" — antes solo se reservaba una
// franja inferior, así que el chat, bastante más alto que esa franja,
// terminaba tapando cualquier globo que cayera detrás suyo): excluye la
// columna real del dock, pero SOLO desde `dockTop` hacia abajo (nunca toda
// la altura completa — bug real encontrado con Playwright: excluir de punta
// a punta dejaba tan poco lugar con varios widgets activos que la búsqueda
// se agotaba y cualquier widget sin lugar terminaba en el fallback de abajo,
// que ANTES caía exactamente sobre el orbe — lo opuesto de "nunca tapada").
function packHudWidgets(widgets, sizeById, stageWidth, stageHeight, bottomReserve, dockLeft, dockRight, dockTop) {
  const cx = stageWidth / 2, cy = stageHeight / 2;
  const placed = [{ x: cx, y: cy, halfW: HUD_ORB_HALF_SIZE, halfH: HUD_ORB_HALF_SIZE }];
  const positions = {};

  function withinStage(x, y, halfW, halfH) {
    if (x - halfW < 8 || x + halfW > stageWidth - 8) return false;
    if (y - halfH < 8 || y + halfH > stageHeight - bottomReserve) return false;
    if (dockLeft !== null && y + halfH > dockTop && x + halfW > dockLeft && x - halfW < dockRight) return false;
    return true;
  }
  function collidesWithPlaced(x, y, halfW, halfH) {
    for (const p of placed) {
      const minDx = halfW + p.halfW + HUD_COLLISION_PADDING;
      const minDy = halfH + p.halfH + HUD_COLLISION_PADDING;
      if (Math.abs(x - p.x) < minDx && Math.abs(y - p.y) < minDy) return true;
    }
    return false;
  }

  widgets.forEach((widget) => {
    const id = widget.node_id;
    const size = sizeById[id];
    if (!size) return;
    const halfW = size.width / 2, halfH = size.height / 2;
    const radiusStep = Math.max(halfW, halfH) * 0.55;
    let found = null;
    for (let ring = 0; ring < 80 && !found; ring++) {
      const radius = ring * radiusStep;
      const stepsInRing = ring === 0 ? 1 : Math.max(Math.round((2 * Math.PI * radius) / (radiusStep * 1.3)), 10);
      for (let s = 0; s < stepsInRing; s++) {
        const angle = (s / stepsInRing) * Math.PI * 2 - Math.PI / 2 + ring * HUD_GOLDEN_ANGLE;
        const x = cx + radius * Math.cos(angle);
        const y = cy + radius * Math.sin(angle);
        if (!withinStage(x, y, halfW, halfH)) continue;
        if (!collidesWithPlaced(x, y, halfW, halfH)) { found = { x, y, ring }; break; }
      }
    }
    // No debería pasar con un stage de tamaño razonable, pero nunca hay que
    // dejar un widget sin posición. Ya no cae en el centro exacto (eso
    // ERA el bug: encimaba al orbe, justo lo único que nunca puede pasar)
    // — se va justo arriba del halo del orbe, la única dirección que
    // `withinStage`/`collidesWithPlaced` no acaban de agotar salvo en un
    // stage angostísimo.
    if (!found) found = { x: cx, y: cy - HUD_ORB_HALF_SIZE - halfH - HUD_COLLISION_PADDING, ring: 0 };
    positions[id] = found;
    placed.push({ x: found.x, y: found.y, halfW, halfH });
  });

  return positions;
}

// Mismas tablas ya construidas para el dock de globos del panel Cerebro
// (ADR 0089) — label/ícono por nodo y familia visual, sin duplicar acá:
// HUD_MINI_NODE_META y HUD_BUBBLE_FAMILY ya cubren los 24 nodos reales +
// el pseudo-nodo "cost".
function dashHudMetaFor(nodeId) {
  return HUD_MINI_NODE_META[nodeId] || { label: nodeId, icon: "" };
}
function dashHudFamilyFor(nodeId) {
  return HUD_BUBBLE_FAMILY[nodeId] || "system";
}

// Mini-gráfico real (Decisión 3) — honesto: sin ninguna señal real, no
// dibuja nada en vez de simular una serie plana o inventada.
function renderActivitySparkline(series) {
  if (!series || !series.length || !series.some((v) => v > 0)) return "";
  const max = Math.max(...series, 0.0001);
  const bars = series.map((v) => `<span class="dash-hud-slot-chart-bar" style="height:${Math.max((v / max) * 100, 4)}%"></span>`).join("");
  return `<div class="dash-hud-slot-chart">${bars}</div>`;
}
function dashHudStatCellHTML(value, label) {
  return `<div class="dash-hud-slot-stat"><div class="dash-hud-slot-stat-value">${escapeHtml(String(value))}</div><div class="dash-hud-slot-stat-label">${escapeHtml(label)}</div></div>`;
}

// Vocabulario de slots compartido por las 24 plantillas (ver
// snarf/telemetry/widget_templates.py) — una plantilla nueva combina estos,
// nunca hace falta CSS/JS a medida por plantilla individual.
function dashHudBodySlotHTML(slot, widget, seen) {
  switch (slot) {
    case "icon":
      return `<div class="dash-hud-slot-icon-big">${escapeHtml(dashHudMetaFor(widget.node_id).icon)}</div>`;
    case "body":
      return `<div class="dash-hud-slot-body">${escapeHtml(widget.last_detalle || `${widget.count_recent} eventos recientes`)}</div>`;
    case "caption":
      return widget.curator_caption ? `<div class="dash-hud-slot-caption">${escapeHtml(widget.curator_caption)}</div>` : "";
    case "narrative":
      return `<div class="dash-hud-slot-narrative">${escapeHtml(widget.curator_caption || widget.last_detalle || "sin novedades reales todavía")}</div>`;
    case "chart":
      return renderActivitySparkline(widget.cost_series && widget.cost_series.length ? widget.cost_series : widget.activity_buckets);
    case "badge":
      return `<div class="dash-hud-slot-badge">${widget.count_recent}</div>`;
    case "list": {
      const items = widget.recent_items || [];
      return items.length ? `<ul class="dash-hud-slot-list">${items.map((it) => `<li>${escapeHtml(it.detalle)}</li>`).join("")}</ul>` : "";
    }
    case "timeline": {
      const items = widget.recent_items || [];
      return items.length
        ? `<ul class="dash-hud-slot-timeline">${items.map((it) => `<li><span class="dash-hud-slot-timeline-time">${relativeTime(it.timestamp)}</span>${escapeHtml(it.detalle)}</li>`).join("")}</ul>`
        : "";
    }
    case "wall": {
      const items = widget.recent_items || [];
      return items.length
        ? `<div class="dash-hud-slot-wall">${items.map((it) => `<div class="dash-hud-slot-wall-item">${escapeHtml(it.detalle)}</div>`).join("")}</div>`
        : "";
    }
    case "stat":
      if (seen.stat) return ""; // el par ya se renderizó (ver más abajo, evita duplicar duo/duo_mini/comparison)
      seen.stat = true;
      return `<div class="dash-hud-slot-stat-row">${dashHudStatCellHTML(widget.count_recent, "recientes")}${dashHudStatCellHTML(widget.count_total, "total")}</div>`;
    case "stat_grid":
      return `<div class="dash-hud-slot-stat-grid">${dashHudStatCellHTML(widget.count_recent, "recientes")}${dashHudStatCellHTML(widget.count_total, "total")}${dashHudStatCellHTML(widget.score, "score")}${dashHudStatCellHTML(widget.last_timestamp ? relativeTime(widget.last_timestamp) : "—", "última vez")}</div>`;
    case "gauge": {
      const pct = Math.min(Math.round((widget.count_recent / 8) * 100), 100);
      return `<div class="dash-hud-slot-gauge" style="--gauge-pct:${pct}" data-gauge-label="${widget.count_recent}"></div>`;
    }
    case "ticker":
      return `<div class="dash-hud-slot-ticker">${escapeHtml(widget.last_detalle || `${widget.count_recent} eventos`)}</div>`;
    default:
      return "";
  }
}

function dashHudNodeContentHTML(widget, template) {
  const meta = dashHudMetaFor(widget.node_id);
  const seen = {};
  const bodyHTML = (template.slots || [])
    .filter((s) => s !== "label") // ya está en el header de abajo, nunca se repite
    .map((s) => dashHudBodySlotHTML(s, widget, seen))
    .join("");
  return `
    <div class="dash-hud-node-head">
      <span class="dash-hud-node-icon">${escapeHtml(meta.icon)}</span>
      <span class="dash-hud-node-label">${escapeHtml(meta.label)}</span>
    </div>
    ${bodyHTML}
  `;
}

function dashHudOpacityForIndex(index) {
  return Math.max(1 - index * 0.07, 0.45);
}
function dashHudTransformFor(pos, opts) {
  const z = -((pos.ring || 0) * 70);
  if (opts && opts.exitToCenter) {
    return `translate3d(${opts.cx}px, ${opts.cy}px, -220px) translate(-50%, -50%) scale(0.55)`;
  }
  return `translate3d(${pos.x}px, ${pos.y}px, ${z}px) translate(-50%, -50%)`;
}

// Reposición real vía FLIP (First-Last-Invert-Play, sin librería nueva,
// mismo criterio "cero dependencias" del resto del frontend): un widget que
// sigue siendo relevante NUNCA se destruye y recrea entre polls — solo
// cambia su transform (posición + profundidad Z, ya anima solo por CSS
// transition) y su contenido si cambió. Solo entran/salen del DOM los que
// aparecen o dejan de ser relevantes. En el mismo paso se actualizan las
// líneas de conexión (Decisión 5) — mismo ciclo de vida, sin una función
// paralela separada.
function renderDashboardHudWidgets(widgets) {
  const stageRect = dashHudStage.getBoundingClientRect();
  const width = stageRect.width || 600, height = stageRect.height || 400;
  // Centro REAL y completo del stage — tiene que coincidir con dónde el CSS
  // posiciona al orbe (`left:50%; top:50%`), nunca un centro corrido.
  const cx = width / 2, cy = height / 2;
  // Bug real encontrado con Playwright: el dock de chat (fijo, siempre
  // activo mientras Vista HUD lo está) ocupa una franja real abajo del
  // stage — #appRoot (donde vive el stage) trae su propio z-index, así que
  // un widget colocado detrás del dock queda atrapado abajo suyo sin
  // importar el z-index local del widget: invisible/inclickeable aunque el
  // layout "creyera" que cabía ahí. Se reserva esa franja como un LÍMITE de
  // búsqueda (`bottomReserve`, pasado a packHudWidgets), nunca corriendo el
  // centro — correrlo desalineaba el origen de la espiral del orbe real
  // (otro bug real encontrado, ver comentario en packHudWidgets).
  const HUD_CHAT_DOCK_RESERVED_HEIGHT = 260;
  // El chat (Decisión: "todos los globos visibles, nunca tapados por el
  // chat") ocupa una columna real del lado izquierdo (o donde esté
  // configurado, ver hud_chat_position) — se mide en vivo con
  // getBoundingClientRect en vez de asumir un ancho fijo, para que la
  // reserva sea exacta sin importar la posición elegida ni el ancho real
  // de la ventana. Sin el toolbar viejo (ver reparentChatIntoDock, ya no
  // flota aparte) el rect del dock es de verdad todo lo que ocupa.
  // Solo se excluye DEBAJO de `dockTop` (nunca la columna completa de
  // arriba a abajo) — bug real encontrado con Playwright: excluir toda la
  // altura le dejaba tan poco lugar real a la espiral con varios widgets
  // activos que la búsqueda se agotaba, y el fallback de "nunca desaparece"
  // (ver más abajo en packHudWidgets) terminaba encimando el widget
  // encima del orbe — exactamente lo que se estaba tratando de evitar.
  let dockLeft = null, dockRight = null, dockTop = null;
  if (!chatDock.hidden) {
    const dockRect = chatDock.getBoundingClientRect();
    const pad = 28;
    dockLeft = dockRect.left - stageRect.left - pad;
    dockRight = dockRect.right - stageRect.left + pad;
    dockTop = dockRect.top - stageRect.top - pad;
  }

  const activeIds = widgets.map((w) => w.node_id);
  const hiddenIds = Object.keys(dashHudNodeEls).filter((id) => !activeIds.includes(id));
  hiddenIds.forEach((id) => {
    const el = dashHudNodeEls[id];
    delete dashHudNodeEls[id];
    delete dashHudLastData[id];
    el.dataset.anim = "leaving";
    el.style.transform = dashHudTransformFor(null, { exitToCenter: true, cx, cy });
    el.addEventListener("transitionend", () => el.remove(), { once: true });
    const line = dashHudLineEls[id];
    if (line) { line.remove(); delete dashHudLineEls[id]; }
  });

  const sizeById = {};
  activeIds.forEach((id) => {
    const widget = widgets.find((w) => w.node_id === id);
    const template = dashHudTemplateFor(widget.template || "standard");
    sizeById[id] = { width: template.width, height: template.height };
  });
  const positions = packHudWidgets(widgets, sizeById, width, height, HUD_CHAT_DOCK_RESERVED_HEIGHT, dockLeft, dockRight, dockTop);

  activeIds.forEach((id, index) => {
    const widget = widgets.find((w) => w.node_id === id);
    const templateId = widget.template || "standard";
    const template = dashHudTemplateFor(templateId);
    let el = dashHudNodeEls[id];
    let isNew = false;
    if (!el) {
      isNew = true;
      el = document.createElement("div");
      el.className = "dash-hud-node";
      el.dataset.nodeId = id;
      el.dataset.anim = "arriving";
      el.addEventListener("animationend", () => el.removeAttribute("data-anim"), { once: true });
      dashHudWidgets.appendChild(el);
      dashHudNodeEls[id] = el;
    }
    el.dataset.family = dashHudFamilyFor(id);
    el.dataset.tier = widget.size_tier;
    el.dataset.template = templateId;
    el.style.width = template.width + "px";
    el.style.height = template.height + "px";
    if (widget.has_error_recent) el.setAttribute("data-alert", "1");
    else el.removeAttribute("data-alert");
    const pos = positions[id];
    if (pos) {
      el.style.transform = dashHudTransformFor(pos);
      el.style.opacity = String(dashHudOpacityForIndex(index));
      el.dataset.x = pos.x;
      el.dataset.y = pos.y;

      let line = dashHudLineEls[id];
      if (!line) {
        line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("class", "dash-hud-connection-line");
        dashHudConnections.appendChild(line);
        dashHudLineEls[id] = line;
      }
      line.setAttribute("x1", String(cx));
      line.setAttribute("y1", String(cy));
      line.setAttribute("x2", String(pos.x));
      line.setAttribute("y2", String(pos.y));
      line.style.opacity = String(dashHudOpacityForIndex(index) * 0.5);
    }

    const prev = dashHudLastData[id];
    const changed = isNew || !prev || prev.last_timestamp !== widget.last_timestamp
      || prev.curator_caption !== widget.curator_caption || prev.template !== templateId;
    if (changed) {
      el.innerHTML = dashHudNodeContentHTML(widget, template);
      if (prev) {
        el.classList.remove("dash-hud-node-updating");
        void el.offsetWidth; // fuerza reflow para poder re-disparar la animación
        el.classList.add("dash-hud-node-updating");
      }
    }
    dashHudLastData[id] = widget;
  });
}
dashHudWidgets.addEventListener("click", (evt) => {
  const node = evt.target.closest(".dash-hud-node");
  if (node) openNodeDrillPanel(node.dataset.nodeId);
});

function renderDashHudBanner(curation) {
  if (curation.curating) {
    dashHudBanner.innerHTML = '<span class="dash-hud-banner-dot"></span>curando el dashboard...';
    dashHudBanner.classList.add("curating");
    return;
  }
  dashHudBanner.classList.remove("curating");
  dashHudBanner.textContent = curation.headline || "";
}

async function pollDashHud() {
  try {
    await ensureDashHudTemplates(); // se cachea sola — solo pega la red la primera vez
    const res = await apiFetch("/dashboard/widget_summaries");
    const data = await res.json();
    dashHudLastWidgets = data.widgets;
    renderDashboardHudWidgets(data.widgets);
  } catch (e) {
    // fallo silencioso: se reintenta en el próximo ciclo, mismo criterio que el resto del dashboard
  }
  try {
    const curRes = await apiFetch("/dashboard/curation");
    const curation = await curRes.json();
    renderDashHudBanner(curation);
    // Reacción real de la esfera central (pedido explícito: "se mueve
    // constantemente en función de la información presentada") — el pulso
    // de "curating" solo se activa cuando el backend está de verdad
    // llamando al LLM en ese momento, nunca decorativo.
    dashHudOrb.classList.toggle("curating", !!curation.curating);
  } catch (e) {}
}

function startDashHudPolling() {
  stopDashHudPolling();
  pollDashHud();
  dashHudPollTimer = setInterval(pollDashHud, BRAIN_POLL_MS);
}
function stopDashHudPolling() {
  if (dashHudPollTimer) {
    clearInterval(dashHudPollTimer);
    dashHudPollTimer = null;
  }
}
document.addEventListener("visibilitychange", () => {
  if (!dashHudActive) return;
  if (document.hidden) stopDashHudPolling();
  else startDashHudPolling();
});

// Drill-down genérico por nodo (Decisión 4): mismos datos reales que
// /dashboard/telemetry_feed, filtrados a un solo nodo — funciona
// automáticamente para cualquier nodo real, incluida cualquier capacidad
// futura que todavía no tenga una vista propia más rica.
async function openNodeDrillPanel(nodeId) {
  const meta = dashHudMetaFor(nodeId);
  nodeDrillTitle.textContent = meta.label || nodeId;
  nodeDrillBody.innerHTML = loadingBody();
  nodeDrillOverlay.classList.add("open");
  nodeDrillPanel.classList.add("open");
  try {
    const res = await apiFetch(`/dashboard/node_activity/${encodeURIComponent(nodeId)}`);
    const data = await res.json();
    renderNodeDrillBody(data.events);
  } catch (e) {
    nodeDrillBody.innerHTML = '<div class="dash-loading">error cargando el detalle</div>';
  }
}
function renderNodeDrillBody(events) {
  if (!events.length) {
    nodeDrillBody.innerHTML = '<div class="dash-loading">sin actividad registrada todavía</div>';
    return;
  }
  nodeDrillBody.innerHTML = events
    .slice()
    .reverse()
    .map(
      (ev) => `
    <div class="node-drill-row">
      <div class="node-drill-row-verb">${escapeHtml(ev.verbo)}</div>
      ${ev.detalle ? `<div class="node-drill-row-detalle">${escapeHtml(ev.detalle)}</div>` : ""}
      <div class="node-drill-row-meta">${relativeTime(ev.timestamp)}</div>
    </div>`
    )
    .join("");
}
function closeNodeDrillPanel() {
  nodeDrillOverlay.classList.remove("open");
  nodeDrillPanel.classList.remove("open");
}
nodeDrillOverlay.addEventListener("click", closeNodeDrillPanel);
nodeDrillCloseBtn.addEventListener("click", closeNodeDrillPanel);

/* ---------- panel de configuración ---------- */
function openSettings() {
  settingsOverlay.classList.add("open");
  settingsPanel.classList.add("open");
  renderSettingsList();
  renderPersonalitySection();
  renderProfileSection();
  renderLlmRoutingSection();
  renderHudChatPositionSection();
  renderTemplateProposalsSection();
}
function closeSettings() {
  settingsOverlay.classList.remove("open");
  settingsPanel.classList.remove("open");
}
async function renderSettingsList() {
  if (!dashboardPrefs) dashboardPrefs = await (await apiFetch("/dashboard/preferences")).json();
  settingsList.innerHTML = WIDGET_IDS.map((id) => `
    <div class="settings-row">
      <span>${WIDGET_LABELS[id]}</span>
      <button class="settings-toggle ${dashboardPrefs.visible_widgets[id] ? "on" : ""}" data-widget-id="${id}"></button>
    </div>
  `).join("");
  settingsList.querySelectorAll(".settings-toggle").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.widgetId;
      dashboardPrefs.visible_widgets[id] = !dashboardPrefs.visible_widgets[id];
      btn.classList.toggle("on", dashboardPrefs.visible_widgets[id]);
      persistPrefs();
      if (currentView === "dashboard") refreshDashboard();
    });
  });
}

// Posición del chat en Vista HUD (Decisión 7) — mismo patrón visual de fila
// + toggle que renderSettingsList, un valor a la vez (izquierda/centro/derecha).
const HUD_CHAT_POSITIONS = [
  { value: "left", label: "Izquierda (default)" },
  { value: "center", label: "Centro" },
  { value: "right", label: "Derecha" },
];
async function renderHudChatPositionSection() {
  if (!dashboardPrefs) dashboardPrefs = await (await apiFetch("/dashboard/preferences")).json();
  hudChatPositionList.innerHTML = HUD_CHAT_POSITIONS.map(({ value, label }) => `
    <div class="settings-row">
      <span>${escapeHtml(label)}</span>
      <button class="settings-toggle ${dashboardPrefs.hud_chat_position === value ? "on" : ""}" data-hud-chat-position="${value}"></button>
    </div>
  `).join("");
  hudChatPositionList.querySelectorAll("[data-hud-chat-position]").forEach((btn) => {
    btn.addEventListener("click", () => {
      dashboardPrefs.hud_chat_position = btn.dataset.hudChatPosition;

}

// El swipe lateral chat↔dashboard en mobile se retiró: el fundador señaló
// que molestaba el desplazamiento lateral real dentro de los globos de chat
// (bloques de código, tablas) — cualquier arrastre horizontal ahí quedaba

/* ---------- audio recording ---------- */
function pickMimeType() {
  const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  for (const type of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
  }
  return "";
}
function extFor(mime) {
  if (mime.includes("mp4")) return "mp4";
  if (mime.includes("ogg")) return "ogg";
  return "webm";
}
async function startRecording() {
  // Se pide un stream nuevo en cada grabación (en vez de cachear uno para
  // siempre): en iOS Safari, backgrounding o bloqueo de pantalla suele matar
  // los tracks de un stream viejo sin avisar, y reusarlo produce grabaciones
  // vacías indistinguibles de "no funciona". El navegador no vuelve a pedir
  // permiso si ya fue otorgado para este origen.
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  const mimeType = pickMimeType();
  mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  recordedMimeType = mediaRecorder.mimeType || mimeType || "audio/webm";
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.start();
  setState("listening", "escuchando...");
}
function stopRecording() {
  return new Promise((resolve) => {
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      resolve(new Blob(chunks, { type: recordedMimeType }));
    };
    mediaRecorder.stop();
  });
}
async function transcribeBlob(blob) {
  const form = new FormData();
  form.append("file", blob, "audio." + extFor(blob.type || recordedMimeType));
  const res = await apiFetch("/transcribe", { method: "POST", body: form });
  if (!res.ok) throw new Error("transcribe HTTP " + res.status);
  const data = await res.json();
  // data.error: el STT en sí falló (cuota, red) — distinto de una
  // transcripción vacía real (audio corto o silencio genuino), que no trae
  // este campo. Sin la distinción, un fallo de servicio se mostraba como
  // "no se escuchó nada" — engañoso, porque reintentar no soluciona nada.
  // data.audio_id: el backend ya guardó la nota de voz real (aunque falle
  // el STT o el audio no traiga voz) — permite mostrarla como nota de voz
  // reproducible, no solo como texto transcripto.
  return { transcript: data.transcript || "", error: data.error || null, audioId: data.audio_id || null };
}

// Intenta transcribir `blob` y llama a onSuccess(transcript, audioId) si
// sale bien. Si falla (error real de red — "Load failed" es el mensaje
// típico de Safari — o el STT en sí falla), ofrece reintentar con el MISMO
// audio ya grabado en vez de forzar a grabar todo de nuevo (bug real
// reportado: la nota de voz se perdía por completo ante cualquier falla).
async function attemptTranscribe(blob, onSuccess) {
  let result;
  try {
    result = await transcribeBlob(blob);
  } catch (err) {
    setState("error", "no se pudo transcribir: " + (err.message || err));
    setRetry(() => attemptTranscribe(blob, onSuccess));
    return;
  }
  if (result.error) {
    setState("error", result.error);
    setRetry(() => attemptTranscribe(blob, onSuccess));
    return;
  }
  if (!result.transcript.trim()) { setState("idle", "no se escuchó nada, probá de nuevo"); return; }
  await onSuccess(result.transcript, result.audioId);
}

// Solo el POST a /send y el manejo de la respuesta — separado de sendText()
// para poder reintentarlo (bug real reportado: "Load failed" de Safari en
// una nota de voz) sin volver a agregar la burbuja del usuario, que ya
// quedó en pantalla desde el primer intento.
async function postAndHandleSend(text, inputAudioId) {
  setState("thinking", "pensando...");
  showTyping();
  try {
    const res = await apiFetch("/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, conversation_id: conversationId, input_audio_id: inputAudioId || null }),
    });
    if (!res.ok) throw new Error("send HTTP " + res.status);
    const data = await res.json();
    hideTyping();
    addMessage(data.response, "snarf", ttsAvailable, null, data.speech, Boolean(inputAudioId), data.deliverable);
    setState("idle", idleLabel());
    // Sin esto, una conversación nueva se queda mostrando el placeholder
    // "(nueva conversación)" en las listas hasta que el usuario navega fuera
    // y vuelve — recién acá existe una entrada real de la que derivar el
    // título de verdad (primer mensaje).
    refreshConvLists();
    refreshProjectList();
    updateProjectHomeBtnVisibility();
  } catch (e) {
    hideTyping();
    setState("error", "no se pudo enviar: " + (e.message || e));
    setRetry(() => postAndHandleSend(text, inputAudioId));
  }
}

async function sendText(text, inputAudioId) {
  if (!text.trim()) { setState("idle", idleLabel()); return; }
  if (pendingProjectHomeId) {
    // Se tipeó directo sobre el "home" de un proyecto, sin usar el botón
    // dedicado — genera y asigna la conversación recién ahora, para no
    // crear una conversación fantasma solo por haber entrado a mirar.
    conversationId = crypto.randomUUID();
    await apiFetch(`/conversations/${conversationId}/project`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project_id: pendingProjectHomeId }),
    });
    pendingProjectHomeId = null;
    clearChat();
    refreshProjectList();
  }
  clearRetry();
  addMessage(text, "user", false, inputAudioId);
  await postAndHandleSend(text, inputAudioId);
}

function showTranscriptForReview(transcript) {
  reviewText.value = transcript;
  autoResizeTextarea(reviewText);
  review.classList.add("visible");
  setState("idle", "revisá y enviá");
}
async function handleClickMode() {
  unlockAudio();
  if (state === "error") { clearRetry(); setState("idle", idleLabel()); }
  if (state === "idle") {
    try { await startRecording(); } catch (e) { setState("error", "sin micrófono: " + (e.message || e)); }
  } else if (state === "listening") {
    setState("thinking", "transcribiendo...");
    try {
      const blob = await stopRecording();
      await attemptTranscribe(blob, (transcript) => showTranscriptForReview(transcript));
    } catch (e) { setState("error", "error: " + (e.message || e)); }
  }
}
orbWrap.addEventListener("click", () => { if (mode === "click") handleClickMode(); });

});

});

// Textarea que crece con el texto (tipeado o transcripto) hasta un máximo,
// después scrollea adentro — así se ve completo mientras se edita antes de
// enviar, en vez de cortarse en una sola línea.
function autoResizeTextarea(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
textInput.addEventListener("input", () => { autoResizeTextarea(textInput); updateSendMicToggle(); });
reviewText.addEventListener("input", () => autoResizeTextarea(reviewText));

// El mic queda siempre alcanzable (aunque ya haya texto escrito — grabar una
// nota de voz encima de un borrador es un caso real que hay que soportar, no
// un either/or estilo WhatsApp puro) EXCEPTO mientras se está grabando,
// donde le cede el lugar a tachito+flecha — manos libres desde el primer
// tap, ya no existe un estado intermedio de "sostener sin soltar".
function updateSendMicToggle() {
  const recording = state === "listening";
  const hasDraft = textInput.value.trim().length > 0;
  micBtn.hidden = recording;
  textSendBtn.hidden = !hasDraft && !recording;
}

function sendFromTextInput() {
  const text = textInput.value;
  textInput.value = "";
  autoResizeTextarea(textInput);
  unlockAudio();
  updateSendMicToggle();
  sendText(text).then(() => textInput.focus());
}
textSendBtn.addEventListener("click", () => {
  // Grabando (manos libres desde el primer tap): la flecha reusa este mismo
  // botón para terminar y enviar, en vez de sumar un botón nuevo al lado.
  if (state === "listening") { finishRecording(false); return; }
  sendFromTextInput();
});
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendFromTextInput(); }
});

/* ---------- grabación mic en modo texto: un tap simple entra directo a
   grabar, manos libres desde el primer instante — sin gesto de mantener
   presionado ni de deslizar para bloquear. Reemplaza el gesto anterior
   (mantener + swipe) que en iPhone disparaba la lupa de aumento nativa de
   iOS sobre el botón (pensada para cajas de texto), rompiendo la
   interacción por completo — bug real reportado. ---------- */
let recordTimerInterval = null;
const MIC_ICON_HTML = micBtn.innerHTML;
// Waveform en vivo sobre el stream real del mic (AnalyserNode) — mini
// barras que crecen con la amplitud de voz y vuelven a puntitos en
// silencio. audioCtx/analyser se abren en cada grabación y se cierran al
// terminar, mismo criterio que el stream de startRecording().
let waveAudioCtx = null;
let waveAnalyser = null;
let waveRAF = null;
const recordWaveBars = Array.from(recordWave.children);
function startWaveform(mediaStream) {
  try {
    waveAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = waveAudioCtx.createMediaStreamSource(mediaStream);
    waveAnalyser = waveAudioCtx.createAnalyser();
    waveAnalyser.fftSize = 32;
    source.connect(waveAnalyser);
    const data = new Uint8Array(waveAnalyser.frequencyBinCount);
    const tick = () => {
      waveAnalyser.getByteFrequencyData(data);
      recordWaveBars.forEach((bar, i) => {
        const level = data[i % data.length] / 255;
        bar.style.height = `${4 + Math.round(level * 14)}px`;
      });
      waveRAF = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) {
    // Sin AnalyserNode disponible (navegador viejo, etc.): la grabación
    // sigue andando igual, solo sin animación de waveform.
  }
}
function stopWaveform() {
  if (waveRAF) cancelAnimationFrame(waveRAF);
  waveRAF = null;
  if (waveAudioCtx) { try { waveAudioCtx.close(); } catch (e) {} }
  waveAudioCtx = null;
  waveAnalyser = null;
  recordWaveBars.forEach((bar) => { bar.style.height = "4px"; });
}
// Cuadrado rojo de "stop" — reemplaza el ícono de mic mientras se está
// grabando (bloqueado o no): más intuitivo que solo el tinte rojo de
// .recording para comunicar "soltar/tocar acá corta la grabación".
const STOP_ICON_HTML = '<svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor" stroke="none"><rect x="5.5" y="5.5" width="9" height="9" rx="1.5"/></svg>';

function formatRecordTimer(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}
function startRecordTimer() {
  const startedAt = Date.now();
  recordTimerEl.textContent = "0:00";
  clearInterval(recordTimerInterval);
  recordTimerInterval = setInterval(() => {
    recordTimerEl.textContent = formatRecordTimer(Date.now() - startedAt);
  }, 200);
}
function stopRecordTimer() { clearInterval(recordTimerInterval); recordTimerInterval = null; }

async function finishRecording(cancelled) {
  stopRecordTimer();
  stopWaveform();
  micBtn.classList.remove("recording");
  micBtn.innerHTML = MIC_ICON_HTML;
  textRow.classList.remove("recording");
  if (cancelled) {
    try { await stopRecording(); } catch (e) {}
    setState("idle", idleLabel());
    updateSendMicToggle();
    return;
  }
  clearRetry();
  setState("thinking", "transcribiendo...");
  try {
    const blob = await stopRecording();
    await attemptTranscribe(blob, async (transcript, audioId) => {
      // Si ya había un borrador escrito antes (o durante) de grabar, se manda
      // junto con la transcripción como un solo mensaje — no se pierde ni se
      // manda aparte.
      const draft = textInput.value.trim();
      textInput.value = "";
      autoResizeTextarea(textInput);
      await sendText(draft ? `${draft}\n${transcript}` : transcript, audioId);
    });
  } catch (err) {
    setState("error", "error: " + (err.message || err));
  } finally {
    updateSendMicToggle();
  }
}

async function beginActualRecording() {
  try {
    await startRecording();
  } catch (err) {
    setState("error", "sin micrófono: " + (err.message || err));
    return;
  }
  micBtn.classList.add("recording");
  micBtn.innerHTML = STOP_ICON_HTML;
  textRow.classList.add("recording");
  recordHint.textContent = "manos libres, tocá enviar";
  recordCancelBtn.hidden = false;
  startRecordTimer();
  startWaveform(stream);
  updateSendMicToggle();
}
micBtn.addEventListener("click", () => {
  unlockAudio();
  if (state === "error") { clearRetry(); setState("idle", idleLabel()); }
  if (state !== "idle") return; // ya grabando o procesando: ignorar un segundo tap
  beginActualRecording();
});
recordCancelBtn.addEventListener("click", () => finishRecording(true));

/* ---------- adjuntar archivo ---------- */
async function uploadAttachedFile(file) {
  addMessage("adjuntando " + file.name + "...", "user");
  showTyping();
  const form = new FormData();
  form.append("file", file);
  try {
    const res = await apiFetch("/files/upload", { method: "POST", body: form });
    hideTyping();
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMessage("no pude subir el archivo: " + (err.detail || res.status), "snarf");
      return;
    }
    const data = await res.json();
    const link = data.webViewLink ? `[${data.name}](${data.webViewLink})` : data.name;
    let text = `Subí y guardé **${link}** en tu Drive` + (data.indexed ? ", ya vectorizado y buscable." : " (todavía sin vectorizar).");
    if (data.analysis) text += `\n\n${data.analysis}`;
    addMessage(text, "snarf");
  } catch (e) {
    hideTyping();
    addMessage("no pude subir el archivo: " + (e.message || e), "snarf");
  }
}
attachBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (file) uploadAttachedFile(file);
});

}).catch(() => {});
