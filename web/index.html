<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snarf</title>
<style>
  :root {
    --glow: #4fd8e8;
    --glow-soft: #b6f5fb;
    --glow-dim: #1c5a63;
    --text-dim: #6f8891;
    --text: #d7eef2;
    --error: #e85a5a;

    /* Paleta real de la marca del fundador ("PALETA DE COLORES JERE MASIH
       TRADER", encontrada en su Drive indexado) — reusada tal cual, no
       inventada. Solo el cerebro de Snarf la usa; el resto de la interfaz
       se queda monocromática cian a propósito. */
    --brain-magenta: #ff00ee;
    --brain-aqua: #00ffde;
    --brain-violet: #a124ff;
    --brain-violet-dark: #16003e;
    --brain-green: #00ff0a;
    --brain-red: #ff2952;
    --brain-yellow: #ffe600;
    --brain-white: #ffffff;
    --brain-grey: #6b7684;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #000; height: 100%; overflow-x: hidden; overscroll-behavior: none; }
  body {
    margin: 0;
    height: 100dvh;
    background: #000;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* --- atmosphere layers --- */
  .bg-glow {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 65% 55% at 50% 40%, #0c1c22 0%, #050a0c 45%, #000000 82%);
    z-index: 0;
  }
  .nebula {
    position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.35; z-index: 0;
    animation: drift 26s ease-in-out infinite;
  }
  .nebula.a { width: 55vw; height: 55vw; background: #0d3a42; top: -10%; left: -15%; }
  .nebula.b { width: 45vw; height: 45vw; background: #072a33; bottom: -15%; right: -10%; animation-duration: 32s; animation-delay: -8s; }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(3%, -4%) scale(1.08); }
  }
  .grid {
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(79,216,232,0.035) 0px, rgba(79,216,232,0.035) 1px, transparent 1px, transparent 46px),
      repeating-linear-gradient(90deg, rgba(79,216,232,0.035) 0px, rgba(79,216,232,0.035) 1px, transparent 1px, transparent 46px);
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 40%, black 0%, transparent 75%);
    mask-image: radial-gradient(ellipse 60% 55% at 50% 40%, black 0%, transparent 75%);
    z-index: 0;
  }
  .particle {
    position: fixed; width: 3px; height: 3px; border-radius: 50%;
    background: var(--glow); box-shadow: 0 0 6px 2px rgba(79,216,232,0.7);
    opacity: 0; z-index: 0; animation: float-up linear infinite;
  }
  @keyframes float-up {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 0.8; } 90% { opacity: 0.4; }
    100% { transform: translateY(-40vh); opacity: 0; }
  }
  .scanline {
    position: fixed; left: 0; right: 0; top: -2px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(79,216,232,0.45), transparent);
    animation: scan 7s linear infinite; z-index: 1;
  }
  @keyframes scan { 0% { top: -2px; } 100% { top: 100%; } }

  .corner {
    position: fixed; width: 26px; height: 26px;
    border: 1px solid rgba(79,216,232,0.3); z-index: 1;
  }
  .corner.tl { top: env(safe-area-inset-top, 12px); left: 12px; border-right: none; border-bottom: none; }
  .corner.tr { top: env(safe-area-inset-top, 12px); right: 12px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: calc(env(safe-area-inset-bottom, 12px) + 12px); left: 12px; border-right: none; border-top: none; }
  .corner.br { bottom: calc(env(safe-area-inset-bottom, 12px) + 12px); right: 12px; border-left: none; border-top: none; }

  /* --- top bar: menu toggle --- */
  .menu-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: 16px;
    z-index: 6;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.3);
    background: rgba(5,10,12,0.6);
    color: var(--glow);
    font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* --- sidebar --- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: min(280px, 78vw);
    background: rgba(4,8,10,0.92);
    border-right: 1px solid rgba(79,216,232,0.2);
    backdrop-filter: blur(10px);
    z-index: 8;
    transform: translateX(-105%);
    transition: transform 0.28s ease;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 60px) 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .sidebar.open { transform: translateX(0); }
  /* Modo enfoque (desktop): la misma barra lateral del menú hamburguesa de
     mobile, reparentada adentro del panel de chat a pantalla completa —
     acá deja de ser un cajón fuera de pantalla y pasa a ocupar su lugar fijo
     al costado, siempre visible mientras el modo enfoque está abierto. */
  .chat-focus-panel .sidebar.docked {
    position: static; transform: none; transition: none;
    width: 260px; min-width: 260px; height: 100%;
    padding: 0.8rem 0;
  }
  .sidebar-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 7; opacity: 0; pointer-events: none; transition: opacity 0.28s ease;
  }
  .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
  .new-conv-btn {
    margin: 0 14px 14px;
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    border: 1px solid rgba(79,216,232,0.35);
    background: rgba(79,216,232,0.1);
    color: var(--text);
    font-family: inherit;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-align: left;
  }
  .conv-list { overflow-y: auto; flex: 1 1 auto; padding: 0 8px; }
  .conv-item {
    padding: 0.65rem 0.7rem;
    border-radius: 8px;
    font-size: 0.72rem;
    color: var(--text-dim);
    cursor: pointer;
    margin-bottom: 2px;
    line-height: 1.4;
  }
  .conv-item:hover, .conv-item.active { background: rgba(79,216,232,0.1); color: var(--text); }
  .conv-item .conv-date { display: block; font-size: 0.6rem; opacity: 0.7; margin-top: 2px; }
  .conv-empty { padding: 1rem 0.7rem; font-size: 0.7rem; color: var(--text-dim); opacity: 0.6; }
  /* --- user menu (sidebar) --- */
  .user-menu { margin: 10px 14px 0; position: relative; }
  .user-menu-btn {
    width: 100%; display: flex; align-items: center; gap: 0.55rem;
    padding: 0.55rem 0.7rem; border-radius: 10px;
    border: 1px solid rgba(79,216,232,0.25); background: rgba(79,216,232,0.06);
    color: var(--text); font-family: inherit; font-size: 0.72rem; cursor: pointer; text-align: left;
  }
  .user-avatar {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: rgba(79,216,232,0.2); border: 1px solid rgba(79,216,232,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: var(--glow-soft); text-transform: uppercase;
  }
  .user-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-caret { color: var(--text-dim); font-size: 0.6rem; transition: transform 0.2s ease; }
  .user-menu.open .user-caret { transform: rotate(180deg); }
  .user-menu-popover {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 6px);
    background: rgba(5,10,12,0.96); border: 1px solid rgba(79,216,232,0.3);
    border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
    opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .user-menu.open .user-menu-popover { opacity: 1; transform: none; pointer-events: auto; }
  .user-menu-item {
    display: flex; align-items: center; gap: 0.5rem; background: none; border: none;
    color: var(--text-dim); font-family: inherit; font-size: 0.72rem;
    padding: 0.5rem 0.6rem; border-radius: 8px; cursor: pointer; text-align: left;
  }
  .user-menu-item:hover:not(:disabled) { background: rgba(79,216,232,0.1); color: var(--text); }
  .user-menu-item:disabled { opacity: 0.45; cursor: default; }
  .user-menu-item.danger { color: #e88a8a; }
  .user-menu-item.danger:hover { background: rgba(232,90,90,0.12); color: #fff; }

  /* --- view switching (chat / dashboard) --- */
  #appRoot { position: relative; z-index: 2; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .view-chat, .view-dashboard {
    flex: 1 1 auto; min-height: 0; display: none; flex-direction: column;
  }
  .view-chat.active, .view-dashboard.active { display: flex; }

  /* --- modo Jarvis: grilla unificada y redimensionable (desktop ancho) ---
     Reemplaza las tres zonas fijas de antes (arriba/izquierda/derecha) por
     una sola grilla de 12 columnas donde todo bloque —incluidos el chat y
     el historial, antes fijos— es igual de movible y redimensionable. */
  @media (min-width: 900px) {
    /* rem es siempre relativo al <html> raíz, nunca al ancestro más cercano
       — por eso el aumento de legibilidad va acá (gatillado solo por ancho
       de pantalla, no por body.jarvis-mode, que no es seleccionable desde
       html) y no en cada clase suelta. Pensado para 1920×1080 real. */
    html { font-size: 18px; }
    /* El historial de conversaciones ya es un bloque siempre visible de la
       grilla en desktop, pero el botón hamburguesa (menuBtn) sigue siendo el
       único camino real al menú de usuario (configuración del dashboard,
       cerrar sesión) — ocultarlo del todo, como hacía antes, dejaba el modo
       desktop sin ningún acceso a esos dos. Se mantiene visible; abre el
       mismo cajón lateral de siempre, que funciona igual estando o no en
       modo Jarvis. */
    /* El toggle de modo (Toque/Teclado) sí se oculta: en desktop siempre se
       arranca en modo Teclado (ver "let mode" más abajo) y la caja de texto
       ya tiene su propio botón de micrófono al lado — el modo Toque (el
       orbe a pantalla completa) no aporta nada ahí y el toggle quedaba
       sobrando en la barra superior. */
    body.jarvis-mode .mode-fab { display: none; }
    /* Ya no hay una vista "solo chat" separada en desktop — el chat vive
       siempre dentro de la grilla (ver reparentChatIntoDashboard); el modo
       enfoque cubre la misma necesidad expandiendo ese mismo bloque. */
    body.jarvis-mode .dash-btn { display: none; }
    body.jarvis-mode #appRoot {
      display: block; height: 100%; overflow-y: auto;
      padding: calc(env(safe-area-inset-top, 0px) + 3.8rem) 1.2rem 1.5rem;
    }
    body.jarvis-mode .view-chat { display: none; }
    body.jarvis-mode .view-dashboard { display: contents; }
    body.jarvis-mode .dash-mobile-stack { display: none; }
    body.jarvis-mode .dash-grid-desktop {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 28px;
      grid-auto-flow: row;
      gap: 0.9rem;
    }
    /* Cada bloque necesita una altura real (no solo intrínseca) para que
       grid-row: span funcione — el contenido que no entra scrollea adentro
       en vez de desbordar la tarjeta. Solo en desktop: mobile conserva su
       .dash-widget de altura intrínseca de siempre, sin tocar. */
    body.jarvis-mode .dash-widget {
      display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden;
    }
    body.jarvis-mode .dash-widget-body {
      display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow-y: auto;
    }
  }
  .dash-grid-desktop { display: none; }

  /* --- panel drag handle / reordering --- */
  .dash-widget-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.15rem; flex-shrink: 0; }
  .dash-widget-head h3 { margin: 0; }
  .dash-widget-sub {
    font-size: 0.66rem; color: var(--text-dim); margin-bottom: 0.6rem; opacity: 0.85;
    flex-shrink: 0;
  }
  .dash-row a, .dash-row-title a {
    color: inherit; text-decoration: none; border-bottom: 1px dotted rgba(79,216,232,0.4);
  }
  .dash-row a:hover, .dash-row-title a:hover { color: var(--glow-soft); border-bottom-color: var(--glow-soft); }
  .dash-widget-config {
    display: flex; align-items: center; gap: 0.4rem; font-size: 0.66rem; color: var(--text-dim);
    margin-bottom: 0.5rem;
  }
  .dash-widget-config select {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(79,216,232,0.3); border-radius: 6px;
    color: var(--text); font-family: inherit; font-size: 0.68rem; padding: 0.15rem 0.4rem;
  }
  .dash-gmail-list { margin-top: 0.7rem; padding-top: 0.6rem; border-top: 1px solid rgba(255,255,255,0.06); }
  .dash-gmail-digest-refs { margin-top: 0.5rem; padding-top: 0.4rem; border-top: 1px dashed rgba(255,255,255,0.08); }
  .dash-mini-btn {
    background: rgba(79,216,232,0.12); border: 1px solid rgba(79,216,232,0.35); color: var(--glow-soft);
    font-family: inherit; font-size: 0.66rem; letter-spacing: 0.02em; padding: 0.3rem 0.6rem;
    border-radius: 999px; cursor: pointer;
  }
  .dash-mini-btn:disabled { opacity: 0.5; cursor: default; }
  #gmailDigestContent {
    font-size: 0.76rem; line-height: 1.5; margin-top: 0.5rem;
    max-height: 260px; overflow-y: auto;
  }
  #gmailDigestContent p { margin: 0 0 0.4rem; }
  #gmailDigestContent ul, #gmailDigestContent ol { margin: 0 0 0.4rem; padding-left: 1.1rem; }
  #gmailDigestContent strong { color: var(--glow-soft); }
  .dash-drag-handle {
    color: var(--text-dim); cursor: grab; touch-action: none; opacity: 0.55;
    display: flex; align-items: center; justify-content: center;
    min-width: 32px; min-height: 32px; margin: -8px -6px -8px 0;
    user-select: none; -webkit-user-select: none;
  }
  .dash-drag-handle:hover { opacity: 1; color: var(--glow); }
  .dash-widget.dragging, .dash-widget.dragging * { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  .dash-widget.dragging { opacity: 0.4; border-color: var(--glow); }
  .dash-resize-handle {
    position: absolute; right: 4px; bottom: 4px; width: 18px; height: 18px; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); opacity: 0.45; cursor: nwse-resize; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .dash-resize-handle:hover { opacity: 1; color: var(--glow); }
  .dash-widget.resizing { border-color: var(--glow); }
  .dash-widget-expand-handle {
    color: var(--text-dim); cursor: pointer; opacity: 0.55;
    display: flex; align-items: center; justify-content: center;
    min-width: 26px; min-height: 26px; margin: -6px -4px -6px 0.2rem;
  }
  .dash-widget-expand-handle:hover { opacity: 1; color: var(--glow); }

  /* --- panel de configuración --- */
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .settings-overlay.open { opacity: 1; pointer-events: auto; }
  .settings-panel {
    position: fixed; z-index: 11;
    left: 50%; top: 50%; transform: translate(-50%, -46%);
    width: min(360px, 88vw); max-height: 70vh; overflow-y: auto;
    background: rgba(5,10,12,0.97); border: 1px solid rgba(79,216,232,0.35);
    border-radius: 16px; padding: 1rem;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .settings-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.7rem; }
  .settings-head h3 { margin: 0; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--glow-soft); }
  .settings-close {
    background: none; border: 1px solid rgba(79,216,232,0.3); color: var(--text-dim);
    border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 0.75rem;
  }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.55rem 0.2rem; font-size: 0.78rem; color: var(--text);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-toggle {
    width: 34px; height: 19px; border-radius: 999px; border: 1px solid rgba(79,216,232,0.35);
    background: rgba(255,255,255,0.06); position: relative; cursor: pointer; flex-shrink: 0;
  }
  .settings-toggle::after {
    content: ""; position: absolute; top: 1px; left: 1px; width: 15px; height: 15px;
    border-radius: 50%; background: var(--text-dim); transition: transform 0.18s ease, background 0.18s ease;
  }
  .settings-toggle.on { background: rgba(79,216,232,0.25); border-color: var(--glow); }
  .settings-toggle.on::after { transform: translateX(15px); background: var(--glow); }

  /* --- cerebro de Snarf --- */
  .brain-mini { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .brain-mini svg { width: 100%; max-width: 160px; height: auto; }
  .brain-mini-stat { font-size: 0.78rem; color: var(--text); text-align: center; }
  .brain-mini-stat-sub { font-size: 0.68rem; color: var(--text-dim); text-align: center; }

  /* El color de cada nodo/edge viene de `color` (currentColor) — una clase
     por Capacidad/tier se lo asigna una sola vez al construir el grafo, acá
     abajo solo se define la paleta en sí. */
  .brain-color-aqua { color: var(--brain-aqua); }
  .brain-color-magenta { color: var(--brain-magenta); }
  .brain-color-violet { color: var(--brain-violet); }
  .brain-color-grey { color: var(--brain-grey); }
  .brain-color-white { color: var(--brain-white); }

  .brain-node {
    /* Sin color por defecto a propósito: cada nodo siempre lleva una clase
       brain-color-* real (ver brainColorClassFor en el JS) — si esta regla
       fijara un color acá, pisaría a esas clases por venir después en la
       hoja de estilos (misma especificidad, gana la última declarada). */
    /* stroke-width bajo + stroke-opacity reducida + resplandor permanente:
       menos "círculo de diagrama de red" de borde duro, más orbe de luz que
       se funde con la malla — el aspecto "rústico" reportado por el
       fundador venía de acá, no solo de las líneas rectas. */
    fill: currentColor; fill-opacity: 0.22; stroke: currentColor; stroke-width: 1; stroke-opacity: 0.6;
    filter: drop-shadow(0 0 6px currentColor);
    transform-origin: center; transform-box: fill-box;
  }
  .brain-node-center { fill-opacity: 0.25; stroke-width: 2.2; filter: drop-shadow(0 0 14px var(--brain-violet)); }
  .brain-node-specialist { stroke-dasharray: 2 2; }
  /* Nunca tuvo actividad real registrada — ni activo ni en espera, un nodo
     "fantasma": potencial todavía sin usar, no un estado inventado. */
  .brain-node-ghost { color: var(--brain-grey) !important; fill-opacity: 0.05; stroke-dasharray: 1 4; opacity: 0.4; animation: none !important; }
  .brain-ring { fill: none; stroke: rgba(150,170,190,0.16); stroke-width: 1; stroke-dasharray: 1 5; }

  /* Latido lento y tenue: el estado por defecto de cualquier nodo con
     historia real pero sin actividad reciente — "en espera", nunca del
     todo apagado. */
  @keyframes brain-breathe { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.04); } }
  .brain-node-idle { animation: brain-breathe 3.6s ease-in-out infinite; }
  .brain-mini-center.brain-node-idle { animation-duration: 2.4s; }

  /* Latido rápido tipo "lub-dub": nodos con actividad real reciente (ver
     BRAIN_ACTIVE_WINDOW_S en el JS) — más brillante y con un doble golpe,
     distinto a propósito del latido de espera de arriba. currentColor hace
     que el resplandor tome el color propio de cada nodo/tier. */
  @keyframes brain-heartbeat {
    0%, 100% { opacity: 0.85; transform: scale(1); filter: drop-shadow(0 0 3px currentColor); }
    12% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 16px currentColor); }
    24% { opacity: 0.9; transform: scale(1.02); }
    36% { opacity: 1; transform: scale(1.16); filter: drop-shadow(0 0 16px currentColor); }
    50%, 100% { opacity: 0.85; transform: scale(1); }
  }
  .brain-node-active { animation: brain-heartbeat 1.3s ease-in-out infinite; }

  /* Flujo continuo de luz sobre un edge activo — "corriente" entre neuronas,
     independiente de los pulsos puntuales que viajan por cada evento nuevo.
     currentColor: cada edge ya tiene su clase de color asignada al nodo que
     conecta (ver brainColorClassFor en el JS). */
  .brain-edge-flow {
    fill: none; stroke: currentColor; stroke-width: 1.8; stroke-opacity: 0.9;
    stroke-dasharray: 5 9; filter: drop-shadow(0 0 4px currentColor);
    animation: brain-flow 1s linear infinite;
  }
  .brain-edge-flow.brain-edge-flow-error { color: var(--brain-red) !important; }
  @keyframes brain-flow { to { stroke-dashoffset: -28; } }

  /* --- modo enfoque: chat a pantalla completa + barra lateral --- */
  .chat-focus-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 14;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .chat-focus-overlay.open { opacity: 1; pointer-events: auto; }
  .chat-focus-panel {
    position: fixed; z-index: 15;
    left: 50%; top: 50%; transform: translate(-50%, -46%);
    width: min(1100px, 96vw); height: min(860px, 94vh);
    background: rgba(5,10,12,0.98); border: 1px solid rgba(79,216,232,0.35);
    border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: row;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .chat-focus-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .chat-focus-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .chat-focus-close {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    background: none; border: 1px solid rgba(79,216,232,0.3); color: var(--text-dim);
    border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 0.75rem;
  }

  .brain-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 12;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .brain-overlay.open { opacity: 1; pointer-events: auto; }
  .brain-panel {
    position: fixed; z-index: 13;
    left: 50%; top: 50%; transform: translate(-50%, -46%);
    width: min(1100px, 96vw); height: min(760px, 92vh);
    background: rgba(5,10,12,0.98); border: 1px solid rgba(79,216,232,0.35);
    border-radius: 16px; padding: 1rem;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .brain-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .brain-layout { display: flex; flex-direction: row; gap: 1rem; flex: 1 1 auto; min-height: 0; }
  @media (max-width: 899px) { .brain-layout { flex-direction: column; } }
  .brain-graph {
    flex: 1.6 1 0; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    /* Viñeta radial: el grafo se lee como un objeto flotando en un volumen
       oscuro, no como un diagrama plano sobre el fondo del panel. */
    background: radial-gradient(ellipse at center, rgba(22,0,62,0.5) 0%, rgba(0,0,0,0.7) 78%);
  }
  /* Wrapper único que recibe el zoom/pan de cámara — SVG y canvas de
     partículas se mueven siempre juntos, nunca por separado, para que el
     enfoque hacia un nodo activo se sienta como una sola escena y no dos
     capas independientes. */
  .brain-graph-inner { position: absolute; inset: 0; will-change: transform; }
  .brain-graph-inner svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #brainParticles { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .brain-feed { flex: 1 1 0; min-width: 0; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.06); }
  @media (min-width: 900px) { .brain-feed { border-top: none; border-left: 1px solid rgba(255,255,255,0.06); padding-left: 0.8rem; } }
  .brain-feed-row {
    display: flex; align-items: baseline; gap: 0.5rem; padding: 0.3rem 0.2rem; font-size: 0.75rem;
    color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .brain-feed-row .dash-dot { align-self: center; }
  .brain-feed-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brain-feed-time { flex-shrink: 0; font-size: 0.68rem; color: var(--text-dim); }
  /* Opacidad baja a propósito: la línea recta centro-nodo tiene que existir
     (el pulso puntual viaja por ella, animateMotion/mpath) pero en reposo no
     debe leerse como un diagrama de red — la malla orgánica de arriba es la
     que tiene que dominar visualmente. */
  .brain-edge { stroke: var(--glow-dim); stroke-opacity: 0.13; stroke-width: 0.7; fill: none; }
  .brain-node-label { fill: var(--text-dim); font-size: 11px; text-anchor: middle; }
  /* Pulso puntual por evento real — currentColor toma el color propio del
     nodo de origen (ver brainColorClassFor), salvo que sea un error o un
     archivo con categoría real conocida, que pisan ese color a propósito. */
  /* Sin color por defecto, mismo motivo que .brain-node: spawnPulse siempre
     agrega una clase brain-color-*/brain-pulse-file-*/brain-pulse-error. */
  .brain-pulse { fill: currentColor; filter: drop-shadow(0 0 4px currentColor); }
  .brain-pulse-error { fill: var(--brain-red); filter: drop-shadow(0 0 4px var(--brain-red)); }
  .brain-pulse-file-image { fill: var(--brain-yellow); filter: drop-shadow(0 0 4px var(--brain-yellow)); }
  .brain-pulse-file-audio { fill: var(--brain-magenta); filter: drop-shadow(0 0 4px var(--brain-magenta)); }
  .brain-pulse-file-video { fill: var(--brain-green); filter: drop-shadow(0 0 4px var(--brain-green)); }
  .brain-pulse-file-doc { fill: var(--brain-aqua); filter: drop-shadow(0 0 4px var(--brain-aqua)); }

  .dash-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 58px;
    z-index: 6;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.3);
    background: rgba(5,10,12,0.6);

    display: flex; align-items: center; justify-content: center;

  /* --- dashboard --- */

    width: 100%; max-width: 1100px; margin: 0 auto;

    box-shadow: inset 0 0 26px rgba(79,216,232,0.06), inset 0 0 0 1px rgba(79,216,232,0.08);

  .dash-row.dash-dim { color: var(--text-dim); font-size: 0.72rem; }
  .dash-row, .dash-row-stacked { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-row-stacked {
    display: flex; flex-direction: column; gap: 0.1rem; padding: 0.3rem 0;

  }

  .dash-row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-row-sub { font-size: 0.68rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--text-dim); }
  .dash-dot.ok { background: var(--glow); box-shadow: 0 0 6px 2px rgba(79,216,232,0.6); }
  .dash-dot.off { background: var(--error); box-shadow: 0 0 6px 2px rgba(232,90,90,0.4); }
  .dash-stat { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 0.35rem; }
  .dash-stat-num { font-size: 1.3rem; color: var(--text); font-weight: 600; margin-right: 0.35rem; }
  .dash-chart { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin-top: 0.6rem; }
  .dash-bar { flex: 1 1 auto; height: 100%; display: flex; align-items: flex-end; }
  .dash-bar-fill {
    width: 100%; background: var(--glow); opacity: 0.85; border-radius: 4px 4px 0 0; min-height: 2px;
  }
  .dash-chart-label { font-size: 0.65rem; color: var(--text-dim); margin-top: 0.4rem; text-align: right; }
  .dash-loading { color: var(--text-dim); font-size: 0.8rem; padding: 2rem 0; text-align: center; }

  /* --- chat --- */
  .chat {
    position: relative; z-index: 2;
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 3.2rem) 1rem 1rem;
    width: 100%; max-width: 560px; margin: 0 auto;
  }
  .chat-inner {
    margin-top: auto;
    display: flex; flex-direction: column; gap: 0.55rem;

  }
  .msg {
    max-width: 82%; padding: 0.6rem 0.9rem; border-radius: 14px;
    font-size: 0.85rem; line-height: 1.5; animation: fadein 0.3s ease;
    overflow-wrap: anywhere; word-break: break-word;
  }
  .msg.snarf a { color: var(--glow-soft); text-decoration: underline; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end;
    background: radial-gradient(ellipse at center, rgba(79,216,232,0.14) 0%, rgba(10,18,20,0.14) 55%, rgba(4,10,12,0.2) 100%);
    box-shadow: inset 0 0 18px rgba(79,216,232,0.08), inset 0 0 0 1px rgba(79,216,232,0.1);
    backdrop-filter: blur(4px) saturate(1.2);

  }
  .msg.snarf {
    align-self: flex-start;
    background: radial-gradient(ellipse at center, rgba(200,235,240,0.06) 0%, rgba(10,14,15,0.12) 55%, rgba(4,7,8,0.18) 100%);
    box-shadow: inset 0 0 18px rgba(79,216,232,0.04), inset 0 0 0 1px rgba(255,255,255,0.06);
    backdrop-filter: blur(4px) saturate(1.15);
    -webkit-backdrop-filter: blur(4px) saturate(1.15);
    border: 1px solid rgba(255,255,255,0.16); border-bottom-left-radius: 4px;
  }
  .msg.snarf h1, .msg.snarf h2, .msg.snarf h3 {
    margin: 0.2rem 0 0.4rem; line-height: 1.3; color: var(--glow-soft);
  }
  .msg.snarf h1 { font-size: 1.05rem; }
  .msg.snarf h2 { font-size: 0.98rem; }
  .msg.snarf h3 { font-size: 0.9rem; }
  .msg.snarf p { margin: 0 0 0.5rem; }
  .msg.snarf p:last-child { margin-bottom: 0; }
  .msg.snarf ul, .msg.snarf ol { margin: 0 0 0.5rem; padding-left: 1.2rem; }
  .msg.snarf li { margin-bottom: 0.15rem; }
  .msg.snarf blockquote {
    margin: 0 0 0.5rem; padding: 0.3rem 0.7rem;

  }
  .msg.snarf code {
    background: rgba(79,216,232,0.12); padding: 0.1rem 0.35rem; border-radius: 4px;
    font-size: 0.82em;
  }
  .msg.snarf pre {
    background: rgba(0,0,0,0.4); border: 1px solid rgba(79,216,232,0.2);
    border-radius: 8px; padding: 0.6rem 0.7rem; overflow-x: auto; margin: 0 0 0.5rem;
  }
  .msg.snarf pre code { background: none; padding: 0; }
  .msg.snarf strong { color: var(--text); }
  .msg.snarf table {
    width: 100%; border-collapse: collapse; margin: 0 0 0.5rem; font-size: 0.8rem;
    display: block; overflow-x: auto; white-space: nowrap;
  }
  .msg.snarf th, .msg.snarf td {
    border: 1px solid rgba(79,216,232,0.2); padding: 0.35rem 0.55rem; text-align: left;
  }
  .msg.snarf th { color: var(--glow-soft); background: rgba(79,216,232,0.08); }
  .play-audio-btn {
    display: flex; width: fit-content; align-items: center; gap: 0.3rem;

    border: 1px solid rgba(79,216,232,0.3);
    color: var(--glow-soft);
    font-family: inherit;
    font-size: 0.65rem;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.6rem;

  }

  /* --- floating audio player --- */
  .audio-player {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: 50%;
    transform: translateX(-50%) translateY(-140%);
    /* Por encima de cualquier overlay (config 10/11, cerebro 12/13, modo
       enfoque 14/15) — antes quedaba tapado e inaccesible detrás de
       cualquiera de esos paneles mientras reproducía. */
    z-index: 20;
    display: flex; align-items: center; gap: 0.6rem;
    background: rgba(5,10,12,0.9);
    border: 1px solid rgba(79,216,232,0.4);
    box-shadow: 0 0 20px rgba(79,216,232,0.25);
    border-radius: 999px;
    padding: 0.5rem 0.6rem 0.5rem 0.9rem;
    backdrop-filter: blur(8px);
    transition: transform 0.3s ease;
    font-size: 0.7rem;
    color: var(--text);
  }
  .audio-player.visible { transform: translateX(-50%) translateY(0); }
  .audio-player .label { display: flex; align-items: center; gap: 0.4rem; color: var(--text-dim); }
  .audio-player .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--glow);
    box-shadow: 0 0 6px 2px rgba(79,216,232,0.8);
    animation: typing-bounce 1s infinite ease-in-out;
  }
  .audio-player button {
    background: rgba(79,216,232,0.12);
    border: 1px solid rgba(79,216,232,0.3);

    font-size: 0.68rem;
    padding: 0.3rem 0.55rem;
    border-radius: 999px;
    cursor: pointer;

  .audio-player .close-btn { background: rgba(232,90,90,0.12); border-color: rgba(232,90,90,0.4); }

  .typing { display: flex; gap: 4px; align-items: center; padding: 0.3rem 0; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--glow);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* --- bottom control cluster --- */
  .control-bar {
    position: relative; z-index: 2;
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0.7rem;
    width: 100%; padding: 0.6rem 1rem calc(env(safe-area-inset-bottom, 0px) + 1.4rem);
  }
  .mode-fab {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 16px;
    z-index: 6;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.3);
    background: rgba(5,10,12,0.6);
    color: var(--glow);
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 0.2s ease;

  .mode-fab.locked { opacity: 0.35; pointer-events: none; }
  .mode-popover {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 54px);
    right: 16px;
    z-index: 6;
    background: rgba(5,10,12,0.94);
    border: 1px solid rgba(79,216,232,0.3);
    border-radius: 14px;
    padding: 6px;
    display: flex; flex-direction: column; gap: 2px;
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .mode-popover.open { opacity: 1; transform: none; pointer-events: auto; }
  .mode-option {
    display: flex; align-items: center; gap: 0.55rem;
    background: none; border: none; color: var(--text-dim);
    font-family: inherit; font-size: 0.72rem;
    padding: 0.5rem 0.75rem; border-radius: 9px; cursor: pointer;
    white-space: nowrap; text-align: left;
  }
  .mode-option.active { background: rgba(79,216,232,0.18); color: var(--text); }
  .status {
    text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.7rem;
    color: var(--text-dim); min-height: 1.2em; text-align: center; padding: 0 1rem;
  }
  .review { width: 100%; max-width: 480px; display: none; flex-direction: column; gap: 0.5rem; }
  .review.visible { display: flex; }
  .review textarea {
    width: 100%; min-height: 4.5rem; max-height: 10rem; resize: none; overflow-y: auto; line-height: 1.4;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(79,216,232,0.25);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.85rem; padding: 0.7rem;
  }
  .review .actions { display: flex; gap: 0.6rem; justify-content: flex-end; }
  .review button {
    font-family: inherit; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.45rem 1rem; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(79,216,232,0.3); background: transparent; color: var(--text-dim);
  }
  .review button.primary { background: rgba(79,216,232,0.2); color: var(--text); border-color: var(--glow); }

  .orb-wrap {
    position: relative; width: 180px; height: 180px; cursor: pointer;
    user-select: none; -webkit-user-select: none; touch-action: none; flex-shrink: 0;
    transform: scale(0.74); transform-origin: center;
  }
  .rays, .rays2 {
    position: absolute; inset: -42px; border-radius: 50%;
    -webkit-mask-image: radial-gradient(circle, transparent 50%, black 55%, black 62%, transparent 68%);
    mask-image: radial-gradient(circle, transparent 50%, black 55%, black 62%, transparent 68%);
    opacity: 0.7; transition: opacity 0.4s ease;
  }
  .rays { background: repeating-conic-gradient(from 0deg, rgba(79,216,232,0.24) 0deg 1.2deg, transparent 1.2deg 8deg); animation: spin 16s linear infinite; }
  .rays2 { background: repeating-conic-gradient(from 15deg, rgba(182,245,251,0.14) 0deg 0.8deg, transparent 0.8deg 14deg); animation: spin 22s linear infinite reverse; }
  .ring-outer, .ring-inner { position: absolute; border-radius: 50%; }
  .ring-outer { inset: 0; border: 1px dashed rgba(79,216,232,0.35); animation: spin 26s linear infinite reverse; }
  .ring-inner { inset: 26px; border: 1px solid rgba(79,216,232,0.22); animation: spin 18s linear infinite; }
  .ring-inner::before, .ring-inner::after {
    content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: var(--glow); box-shadow: 0 0 6px 2px rgba(79,216,232,0.8);
    top: -2.5px; left: calc(50% - 2.5px);
  }
  .ring-inner::after { top: auto; bottom: -2.5px; }
  .orb-sphere {
    position: absolute; inset: 50px; border-radius: 50%; perspective: 260px;
  }
  .orb {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, transparent 0%, transparent 46%, rgba(79,216,232,0.22) 58%, rgba(182,245,251,0.65) 70%, rgba(79,216,232,0.18) 82%, transparent 94%);
    box-shadow: 0 0 26px 4px rgba(79,216,232,0.35), inset 0 0 26px 3px rgba(79,216,232,0.18);
    animation: breathe 3.4s ease-in-out infinite, flicker 5s steps(30) infinite;
    transition: box-shadow 0.4s ease;
  }
  .wire {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.32);
  }
  .wire.w1 { transform: rotateX(72deg); }
  .wire.w2 { transform: rotateX(40deg); }
  .wire.w3 { transform: rotateX(-40deg); }
  .wire.w4 { transform: rotateX(-72deg); }
  .wire.w5 { transform: rotateY(65deg); border-color: rgba(79,216,232,0.2); }
  .wire.w6 { transform: rotateY(115deg); border-color: rgba(79,216,232,0.2); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.045); opacity: 1; } }
  @keyframes flicker {
    0%, 100% { opacity: 1; } 46% { opacity: 1; } 47% { opacity: 0.82; } 48% { opacity: 1; }
    71% { opacity: 1; } 72% { opacity: 0.88; } 73% { opacity: 1; }
  }
  .orb-wrap.listening .orb {
    animation: pulse-fast 1s ease-in-out infinite, flicker 2.5s steps(30) infinite;
    box-shadow: 0 0 32px 8px rgba(79,216,232,0.55), inset 0 0 32px 6px rgba(79,216,232,0.3);
  }
  .orb-wrap.listening .rays, .orb-wrap.listening .rays2 { animation-duration: 5s; opacity: 1; }
  .orb-wrap.listening .ring-outer, .orb-wrap.listening .ring-inner { animation-duration: 6s; }
  @keyframes pulse-fast { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  .orb-wrap.thinking .orb { animation: pulse-fast 0.6s ease-in-out infinite; }
  .orb-wrap.thinking .rays, .orb-wrap.thinking .rays2 { animation-duration: 2.5s; }
  .orb-wrap.error .orb {
    background: radial-gradient(circle at 50% 50%, transparent 0%, transparent 46%, rgba(232,90,90,0.3) 58%, rgba(255,218,218,0.65) 70%, transparent 94%);
    box-shadow: 0 0 30px 6px rgba(232,90,90,0.4);
  }
  .orb-wrap.error .wire { border-color: rgba(232,90,90,0.35); }

  /* --- text mode --- */
  .text-row {
    display: none;
    width: 100%; max-width: 480px;
    gap: 0.5rem;
    align-items: flex-end;
  }
  .text-row.visible { display: flex; }
  .text-row textarea {
    flex: 1 1 auto;
    min-width: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(79,216,232,0.3);
    border-radius: 20px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.7rem 1rem;
    outline: none;
    resize: none;
    max-height: 9rem;
    overflow-y: auto;
    line-height: 1.4;
  }
  .text-row textarea::placeholder { color: var(--text-dim); }
  .text-row .icon-btn {
    flex: 0 0 auto;

/* ---------- markdown ---------- */
function renderMarkdown(text) {
  let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
  html = html.replace(/^(\|.+\|)\n(\|[\s:|-]+\|)\n((?:\|.+\|\n?)*)/gm, (_, headerLine, sepLine, bodyLines) => {
    const parseRow = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
    const headers = parseRow(headerLine);
    const rows = bodyLines.trim().split("\n").filter(Boolean).map(parseRow);
    const thead = "<thead><tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr></thead>";
    const tbody = "<tbody>" + rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody>";
    return `<table>${thead}${tbody}</table>\n`;
  });
  html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  html = html.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/^(?:-\s.*(?:\n|$))+/gm, (block) => {
    const items = block.trim().split("\n").map(l => `<li>${l.replace(/^-\s/, "")}</li>`).join("");
    return `<ul>${items}</ul>`;
  });
  html = html.replace(/^(?:\d+\.\s.*(?:\n|$))+/gm, (block) => {
    const items = block.trim().split("\n").map(l => `<li>${l.replace(/^\d+\.\s/, "")}</li>`).join("");
    return `<ol>${items}</ol>`;
  });
  html = html.split(/\n\n+/).map(p => {
    const t = p.trim();
    if (/^<h\d|^<ul|^<ol|^<pre|^<blockquote|^<table/.test(t)) return t;
    if (!t) return "";
    return `<p>${t.replace(/\n/g, "<br>")}</p>`;
  }).join("");
  return html;
}

/* ---------- chat helpers ---------- */
function idleLabel() {
  if (mode === "click") return "click para grabar";
  // En modo texto no hace falta: el placeholder del campo ("Escribile a
  // Snarf...") ya dice lo mismo — mostrar los dos era redundante.
  return "";
}
function setState(next, label) {
  state = next;
  orbWrap.className = "orb-wrap " + next;
  statusEl.textContent = label;
  modeFab.classList.toggle("locked", next === "listening" || next === "thinking");
}
function clearChat() { chatInner.innerHTML = ""; }
async function fetchAndPlay(text, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "generando audio...";
  try {
    const res = await apiFetch("/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (data.audio_base64) {
      await playAudio("data:audio/mpeg;base64," + data.audio_base64);
    } else {
      btn.textContent = "no disponible";
    }
  } catch (e) {
    btn.textContent = "error, probá de nuevo";
  } finally {
    btn.disabled = false;
    if (btn.textContent === "generando audio...") btn.textContent = original;
  }
}
function addMessage(text, who, withAudio) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (who === "snarf") {
    div.innerHTML = renderMarkdown(text);
    if (withAudio) {
      const btn = document.createElement("button");
      btn.className = "play-audio-btn";
      btn.textContent = "▶ escuchar";
      btn.addEventListener("click", () => fetchAndPlay(text, btn));
      div.appendChild(btn);
    }
  } else {
    div.textContent = text;
  }
  chatInner.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function showTyping() {
  typingBubble = document.createElement("div");
  typingBubble.className = "msg snarf";

}
function hideTyping() {
  if (typingBubble) { typingBubble.remove(); typingBubble = null; }
}

function playAudio(dataUrl) {
  sharedAudio.src = dataUrl;
  sharedAudio.playbackRate = currentSpeed;
  speedBtn.textContent = currentSpeed + "x";

function relativeTime(ts) {
  const diff = (Date.now() / 1000) - ts;
  if (diff < 60) return "ahora";
  if (diff < 3600) return Math.floor(diff / 60) + " min";
  if (diff < 86400) return Math.floor(diff / 3600) + " h";
  return Math.floor(diff / 86400) + " d";
}

function renderConvListInto(container, convs) {
  container.innerHTML = "";
  if (!convs.length) {
    container.innerHTML = '<div class="conv-empty">sin conversaciones todavía</div>';
    return;
  }
  convs.forEach(c => {
    const div = document.createElement("div");
    div.className = "conv-item" + (c.conversation_id === conversationId ? " active" : "");
    div.innerHTML = `${escapeHtml(c.title || "(sin título)")}<span class="conv-date">${relativeTime(c.last_activity)}</span>`;
    div.addEventListener("click", () => loadConversation(c.conversation_id));
    container.appendChild(div);
  });
}
async function refreshConvLists() {
  const targets = [convList, dashConvList].filter((el) => el && el.isConnected);
  if (!targets.length) return;
  try {
    const res = await apiFetch("/conversations");
    const convs = await res.json();
    targets.forEach((t) => renderConvListInto(t, convs));
  } catch (e) {
    targets.forEach((t) => { t.innerHTML = '<div class="conv-empty">error cargando conversaciones</div>'; });
  }
}

async function loadConversation(id) {
  conversationId = id;
  closeSidebar();
  clearChat();
  try {
    const res = await apiFetch("/conversations/" + id);
    const entries = await res.json();
    entries.forEach(e => {
      addMessage(e.input, "user");
      addMessage(e.response, "snarf", ttsAvailable);
    });
  } catch (e) {
    addMessage("no se pudo cargar la conversación: " + (e.message || e), "snarf");
  }
  setState("idle", idleLabel());
}

// El refresco de la interpretación de Gmail es 100% impulsado por el
// navegador, nunca por el servidor: solo pasa mientras el dashboard está
// abierto y visible. La parte cara (llamar al LLM) solo se paga cuando la
// parte barata (comparar el id del último mensaje) detecta correo nuevo.
const GMAIL_DIGEST_POLL_MS = 5 * 60 * 1000;
let gmailPollTimer = null;

function stopGmailDigestPolling() {
  if (gmailPollTimer) { clearInterval(gmailPollTimer); gmailPollTimer = null; }
}
function startGmailDigestPolling() {
  stopGmailDigestPolling();
  gmailPollTimer = setInterval(() => checkGmailForNewMail(), GMAIL_DIGEST_POLL_MS);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopGmailDigestPolling(); return; }
  if (currentView === "dashboard") {
    checkGmailForNewMail();
    startGmailDigestPolling();
  }
});

async function checkGmailForNewMail() {
  // El widget de Gmail puede estar en cualquier zona (arriba, derecha, o la
  // columna única de mobile) según cómo el fundador haya reordenado los
  // paneles — se busca por id, no por contenedor fijo.
  const body = document.querySelector('[data-widget-id="gmail"] .dash-widget-body');
  if (!body) return;
  try {
    const [listRes, digestRes] = await Promise.all([
      apiFetch("/dashboard/widgets/gmail?max_results=1"),
      apiFetch("/dashboard/widgets/gmail/digest"),
    ]);
    const listData = await listRes.json();
    const digestData = await digestRes.json();
    if (!listData.connected || !digestData.connected) return;
    const currentTopId = listData.messages && listData.messages[0] ? listData.messages[0].id : null;
    const cached = digestData.digest;
    const isNew = currentTopId && (!cached || cached.latest_message_id !== currentTopId);
    if (isNew || !cached) {
      await refreshGmailDigest(body);
    }
  } catch (e) {
    // chequeo silencioso: si falla, se reintenta en el próximo ciclo o al abrir de nuevo.
  }
}

function applyGmailDigest(body, digest) {
  const meta = body.querySelector("#gmailDigestMeta");
  const content = body.querySelector("#gmailDigestContent");
  if (!meta || !content) return;
  if (!digest) {
    meta.textContent = "sin interpretar todavía";
    content.innerHTML = "";
    return;
  }
  meta.textContent = "actualizado " + relativeTime(digest.generated_at);
  // El texto del LLM interpreta y prioriza, pero es prosa libre — no se le
  // pide que invente fechas o links. La referencia real (con fecha y enlace
  // reales) se arma acá, a partir de los datos estructurados que ya vinieron
  // del propio Gmail, para que la interpretación no quede sin ninguno.
  const refRows = (digest.messages || [])
    .map((m) => {
      const url = `https://mail.google.com/mail/u/0/#all/${encodeURIComponent(m.id || "")}`;
      const meta = [m.from, gmailDate(m.date)].filter(Boolean).join(" · ");
      return `<div class="dash-row-stacked"><span class="dash-row-title"><a href="${url}" target="_blank" rel="noopener">${escapeHtml(m.subject || "(sin asunto)")}</a></span><span class="dash-row-sub">${escapeHtml(meta)}</span></div>`;
    })
    .join("");
  content.innerHTML =
    renderMarkdown(digest.digest_text || "") +
    (refRows ? `<div class="dash-gmail-digest-refs">${refRows}</div>` : "");
}
async function refreshGmailDigest(body) {
  const btn = body.querySelector("#gmailDigestBtn");
  const meta = body.querySelector("#gmailDigestMeta");
  if (btn) { btn.disabled = true; btn.textContent = "interpretando..."; }
  else if (meta) meta.textContent = "interpretando...";
  try {
    const res = await apiFetch("/dashboard/widgets/gmail/digest/refresh", { method: "POST" });
    const data = await res.json();
    if (data.error) body.querySelector("#gmailDigestContent").innerHTML = errorBody(data.error);
    else applyGmailDigest(body, data.digest);
  } catch (e) {
    body.querySelector("#gmailDigestContent").innerHTML = errorBody(e.message || e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "interpretar bandeja"; }
  }
}
async function wireGmailDigest(body) {
  const btn = body.querySelector("#gmailDigestBtn");
  if (!btn) return;
  try {
    const res = await apiFetch("/dashboard/widgets/gmail/digest");
    const data = await res.json();
    if (data.connected) applyGmailDigest(body, data.digest);
  } catch (e) {}
  btn.addEventListener("click", () => refreshGmailDigest(body));
}

/* ---------- cerebro de Snarf ---------- */
// Tres anillos, reflejando la arquitectura real (COGNITION.md, ADR 0003) y
// el punto de entrada real de la información: Entrada (texto/voz/archivo,
// el anillo más interno — lo primero que pasa antes de que el Orchestrator
// haga nada), Especialistas Cognitivos (hoy solo el digest de Gmail — se
// suman más a medida que se construyan, ver Roadmaps), Capacidades en el
// anillo externo. `stt`/`tts` están separados (antes un solo nodo "voz")
// porque usage_log ya distingue el modelo real de cada llamada a
// ElevenLabs.
const BRAIN_INPUT_ORDER = ["input_text", "input_voice", "input_file"];
const BRAIN_SPECIALIST_ORDER = ["specialist_gmail"];
const BRAIN_CAPABILITY_ORDER = ["memory", "drive", "knowledge", "documents", "gmail", "calendar", "youtube", "llm", "stt", "tts"];
const BRAIN_NODE_LABELS = {
  input_text: "Texto",
  input_voice: "Voz",
  input_file: "Archivo",
  specialist_gmail: "Especialista Gmail",
  memory: "Memoria",
  drive: "Drive",
  knowledge: "Conocimiento",
  documents: "Documentos",
  gmail: "Gmail",
  calendar: "Calendar",
  youtube: "YouTube",
  llm: "Razonamiento",
  stt: "Escucha",
  tts: "Habla",
  orchestrator: "Orchestrator",
};
// Color real por nodo (paleta de la marca del fundador, ver CSS) — cada
// tier tiene su propio color base; currentColor lo propaga a fill/stroke/
// resplandor de nodo, edge y pulso sin repetir la lógica en tres lugares.
const BRAIN_NODE_COLOR_CLASS = {
  orchestrator: "brain-color-white",
  input_text: "brain-color-aqua",
  input_voice: "brain-color-violet",
  input_file: "brain-color-grey",
  specialist_gmail: "brain-color-magenta",
};
// Categoría real de archivo (categorize_mime, snarf/knowledge/extraction.py)
// → color del pulso puntual cuando ese archivo específico entra — la
// distinción "una imagen es distinta a una canción" que pidió el fundador,
// sin inventar una clasificación semántica que el sistema no tiene.
const BRAIN_FILE_CATEGORY_PULSE_CLASS = {
  image: "brain-pulse-file-image",
  audio: "brain-pulse-file-audio",
  video: "brain-pulse-file-video",
  pdf: "brain-pulse-file-doc",
  docx: "brain-pulse-file-doc",
  pptx: "brain-pulse-file-doc",
  xlsx: "brain-pulse-file-doc",
  text: "brain-pulse-file-doc",
  google_doc: "brain-pulse-file-doc",
};
function brainColorClassFor(id) {
  return BRAIN_NODE_COLOR_CLASS[id] || "brain-color-aqua"; // Capacidades: aqua por defecto
}
const BRAIN_POLL_MS = 3500;
// Una neurona se considera "activa" (latido rápido, flujo de luz en su edge)
// si tuvo un evento real en los últimos N segundos — más allá de eso, cae al
// latido lento de espera. No es un estado inventado: viene de
// nodes[id].last_timestamp, real, del backend.
const BRAIN_ACTIVE_WINDOW_S = 60;
const SVG_NS = "http://www.w3.org/2000/svg";
const XLINK_NS = "http://www.w3.org/1999/xlink";

function brainLayoutRing(ids, cx, cy, ringRadius) {
  return ids.map((id, i) => {
    const angle = -Math.PI / 2 + i * ((2 * Math.PI) / ids.length);
    return { id, x: cx + ringRadius * Math.cos(angle), y: cy + ringRadius * Math.sin(angle) };
  });
}
function brainLayoutAllNodes(cx, cy, inputRadius, specialistRadius, capabilityRadius) {
  const inputs = brainLayoutRing(BRAIN_INPUT_ORDER, cx, cy, inputRadius);
  const specialists = brainLayoutRing(BRAIN_SPECIALIST_ORDER, cx, cy, specialistRadius);
  const capabilities = brainLayoutRing(BRAIN_CAPABILITY_ORDER, cx, cy, capabilityRadius);
  return inputs.concat(specialists, capabilities);
}
function brainNodeRadius(count, min, max, k) {
  return Math.min(max, Math.max(min, min + Math.log2(1 + (count || 0)) * k));
}
function brainTotalEvents(nodes) {
  const n = (id) => (nodes[id] ? nodes[id].count : 0);
  return n("orchestrator") + n("llm") + n("stt") + n("tts");
}
function brainRelativeLabel(ts) {
  const diff = Date.now() / 1000 - ts;
  return diff < 60 ? "recién" : "hace " + relativeTime(ts);
}
function brainIsActive(node) {
  if (!node || node.last_timestamp == null) return false;
  return Date.now() / 1000 - node.last_timestamp <= BRAIN_ACTIVE_WINDOW_S;
}
// Ghost: nunca tuvo NINGUNA actividad real registrada (distinto de "idle",
// que sí tiene historia real pero no reciente) — potencial sin usar, no un
// estado inventado.
function brainStateClass(node) {
  if (!node || !node.count) return "brain-node-ghost";
  return brainIsActive(node) ? "brain-node-active" : "brain-node-idle";
}

// Widget colapsado: mini-grafo estático (una sola carga, sin polling propio
// — se refresca junto con el resto del dashboard, igual que Drive/Calendar).
// El estado activo/idle/fantasma de cada nodo se calcula igual que en
// pantalla completa, así el widget ya se ve "vivo" en vez de una foto muerta.
function brainMiniBodyHTML(data) {
  const nodes = data.nodes;
  const cx = 80, cy = 80;
  const layout = brainLayoutAllNodes(cx, cy, 20, 38, 64);
  const rendered = layout.map((p) => {
    const node = nodes[p.id] || { count: 0, last_timestamp: null };
    const isSpecialist = BRAIN_SPECIALIST_ORDER.includes(p.id);
    const isInput = BRAIN_INPUT_ORDER.includes(p.id);
    const stateCls = brainStateClass(node);
    const r = brainNodeRadius(node.count, isSpecialist || isInput ? 3.5 : 3, isSpecialist || isInput ? 11 : 9, isSpecialist || isInput ? 2 : 1.7);
    const nodeCls = `brain-node ${brainColorClassFor(p.id)}${isSpecialist ? " brain-node-specialist" : ""} ${stateCls}`;
    const edgeCls = `brain-edge ${brainColorClassFor(p.id)}${stateCls === "brain-node-active" ? " brain-edge-flow" : ""}`;
    return {
      edge: `<line x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}" class="${edgeCls}" />`,
      node: `<circle class="${nodeCls}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" />`,
    };
  });
  const centerNode = nodes.orchestrator || { count: 0, last_timestamp: null };
  const centerStateCls = brainStateClass(centerNode);
  const centerR = brainNodeRadius(centerNode.count, 8, 14, 2);
  const total = brainTotalEvents(nodes);
  const lastEvent = data.events.length ? data.events[data.events.length - 1] : null;
  return `
    <div class="brain-mini">
      <svg viewBox="0 0 160 160">
        ${rendered.map((r) => r.edge).join("")}
        ${rendered.map((r) => r.node).join("")}
        <circle class="brain-node-center brain-mini-center brain-color-white ${centerStateCls}" cx="${cx}" cy="${cy}" r="${centerR.toFixed(1)}" />
      </svg>
      <div class="brain-mini-stat">${total} evento${total === 1 ? "" : "s"} registrado${total === 1 ? "" : "s"}</div>
      <div class="brain-mini-stat-sub">${lastEvent ? "última actividad: " + brainRelativeLabel(lastEvent.timestamp) : "todavía sin actividad registrada"}</div>
    </div>`;
}
async function loadBrainWidgetInto(root) {
  const body = root.querySelector('[data-widget-id="brain"] .dash-widget-body');
  if (!body) return;
  try {

  } catch (e) {

  }
  // En el body, no en el head — así el asa de arrastre (que vive en el head)

// Pantalla completa: grafo grande construido una sola vez (buildBrainGraphSkeleton)
// y actualizado en cada poll (applyBrainSnapshot) — solo mientras está abierta
// corre el polling en vivo, mismo criterio que el auto-refresh del digest de Gmail.
let brainGraphBuilt = false;
let brainNodeEls = {};
let brainEdgePaths = {};
let brainEdgeFlowPaths = {};
let brainPollTimer = null;
let brainSince = null;

function buildBrainGraphSkeleton() {
  const cx = 250, cy = 250, inputR = 65, specialistR = 125, capabilityR = 195;
  const layout = brainLayoutAllNodes(cx, cy, inputR, specialistR, capabilityR);
  const edgesG = document.getElementById("brainEdges");
  const flowsG = document.getElementById("brainEdgeFlows");
  const nodesG = document.getElementById("brainNodes");
  edgesG.innerHTML = "";
  flowsG.innerHTML = "";
  nodesG.innerHTML = "";
  brainNodeEls = {};
  brainEdgePaths = {};
  brainEdgeFlowPaths = {};

  // Anillos guía, puramente visuales: separan Entrada / Especialistas
  // Cognitivos / Capacidades, como los anillos concéntricos de un HUD tipo
  // Jarvis — más niveles, más profundidad.
  [inputR, specialistR, capabilityR].forEach((r) => {
    const ring = document.createElementNS(SVG_NS, "circle");
    ring.setAttribute("cx", cx);
    ring.setAttribute("cy", cy);
    ring.setAttribute("r", r);
    ring.setAttribute("class", "brain-ring");
    edgesG.appendChild(ring);
  });

  const centerCircle = document.createElementNS(SVG_NS, "circle");
  centerCircle.setAttribute("cx", cx);
  centerCircle.setAttribute("cy", cy);
  centerCircle.setAttribute("r", 30);
  centerCircle.setAttribute("class", "brain-node-center brain-color-white");
  nodesG.appendChild(centerCircle);
  brainNodeEls.orchestrator = centerCircle;

  const centerLabel = document.createElementNS(SVG_NS, "text");
  centerLabel.setAttribute("x", cx);
  centerLabel.setAttribute("y", cy + 48);
  centerLabel.setAttribute("class", "brain-node-label");
  centerLabel.textContent = "Orchestrator";
  nodesG.appendChild(centerLabel);

  layout.forEach((p) => {
    const isSpecialist = BRAIN_SPECIALIST_ORDER.includes(p.id);
    const isInput = BRAIN_INPUT_ORDER.includes(p.id);
    const colorCls = brainColorClassFor(p.id);
    const d = `M ${cx} ${cy} L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;

    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("id", `edge-${p.id}`);
    path.setAttribute("d", d);
    path.setAttribute("class", `brain-edge ${colorCls}`);
    edgesG.appendChild(path);
    brainEdgePaths[p.id] = path;

    // Path hermano, mismo trazado: la base de arriba nunca cambia de clase
    // (la referencia el <mpath> de cada pulso puntual); este overlay es el
    // que prende/apaga el flujo continuo según el nodo esté activo o no.
    const flowPath = document.createElementNS(SVG_NS, "path");
    flowPath.setAttribute("d", d);
    flowPath.setAttribute("class", `brain-edge ${colorCls}`);
    flowsG.appendChild(flowPath);
    brainEdgeFlowPaths[p.id] = flowPath;

    const circle = document.createElementNS(SVG_NS, "circle");
    circle.setAttribute("cx", p.x.toFixed(1));
    circle.setAttribute("cy", p.y.toFixed(1));
    circle.setAttribute("r", isSpecialist || isInput ? 14 : 11);
    circle.setAttribute("class", `brain-node ${colorCls}${isSpecialist ? " brain-node-specialist" : ""}`);
    nodesG.appendChild(circle);
    brainNodeEls[p.id] = circle;

    const label = document.createElementNS(SVG_NS, "text");
    label.setAttribute("x", p.x.toFixed(1));
    label.setAttribute("y", (p.y + (p.y > cy ? 24 : -18)).toFixed(1));
    label.setAttribute("class", "brain-node-label");
    label.textContent = BRAIN_NODE_LABELS[p.id];
    nodesG.appendChild(label);
  });

  resizeBrainCanvas();
  initBrainParticles();
  initBrainMesh();
}

function brainFeedRowHTML(ev) {
  const isError = ev.status !== "ok";
  const label = BRAIN_NODE_LABELS[ev.node] || ev.node;
  return `<div class="brain-feed-row">
    <span class="dash-dot ${isError ? "off" : "ok"}"></span>
    <span class="brain-feed-label">${escapeHtml(label)} · ${escapeHtml(ev.label || "")}</span>
    <span class="brain-feed-time">${relativeTime(ev.timestamp)}</span>
  </div>`;
}
function renderBrainFeed(events, replace) {
  const rowsHtml = events
    .slice()
    .reverse()
    .map(brainFeedRowHTML)
    .join("");
  if (replace) brainFeedList.innerHTML = rowsHtml;
  else brainFeedList.insertAdjacentHTML("afterbegin", rowsHtml);
  while (brainFeedList.children.length > 60) brainFeedList.lastElementChild.remove();
}

function spawnPulse(ev) {
  const isError = ev.status !== "ok";
  // Cámara y partículas reaccionan a CUALQUIER evento real, incluido
  // unknown_tool en el centro — es la parte que realmente "actúa" ante lo
  // que pasa, aunque no haya un edge que recorrer.
  triggerBrainCameraFocus(ev.node);
  spawnBrainBurst(ev.node, isError);
  // unknown_tool: la falla es del modelo, no de una Capacidad — nunca viaja
  // por ningún edge, el centro ya se ve activo por su propio latido.
  if (ev.node === "orchestrator" || !brainEdgePaths[ev.node]) return;
  // Prioridad de color del pulso: error > categoría real de archivo > color
  // propio del nodo de origen. Un archivo real (imagen/audio/video/doc) se
  // ve distinto porque categorize_mime ya conoce su tipo real — nunca se
  // inventa una subcategoría (ej. "canción" vs "podcast") que el sistema no
  // puede saber.
  let colorCls;
  if (isError) colorCls = "brain-pulse-error";
  else if (ev.node === "input_file" && BRAIN_FILE_CATEGORY_PULSE_CLASS[ev.label]) colorCls = BRAIN_FILE_CATEGORY_PULSE_CLASS[ev.label];
  else colorCls = brainColorClassFor(ev.node);

  const circle = document.createElementNS(SVG_NS, "circle");
  circle.setAttribute("r", "4");
  circle.setAttribute("class", `brain-pulse ${colorCls}`);
  const anim = document.createElementNS(SVG_NS, "animateMotion");
  anim.setAttribute("dur", "0.9s");
  anim.setAttribute("fill", "freeze");
  const mpath = document.createElementNS(SVG_NS, "mpath");
  mpath.setAttributeNS(XLINK_NS, "href", `#edge-${ev.node}`);
  anim.appendChild(mpath);
  circle.appendChild(anim);
  document.getElementById("pulseLayer").appendChild(circle);
  try { anim.beginElement(); } catch (e) {}

  const cleanup = () => circle.remove();
  anim.addEventListener("endEvent", cleanup);
  setTimeout(cleanup, 1300); // defensivo, por si endEvent no dispara en algún motor
}

function applyBrainSnapshot(snap, spawnPulses) {
  const nodes = snap.nodes;
  const lastStatusByNode = {};
  snap.events.forEach((ev) => { lastStatusByNode[ev.node] = ev.status; });

  Object.keys(brainNodeEls).forEach((id) => {
    const node = nodes[id] || { count: 0, last_timestamp: null };
    const isSpecialist = BRAIN_SPECIALIST_ORDER.includes(id);
    const isInput = BRAIN_INPUT_ORDER.includes(id);
    const r = id === "orchestrator"
      ? brainNodeRadius(node.count, 24, 40, 5)
      : isSpecialist || isInput
        ? brainNodeRadius(node.count, 12, 24, 3)
        : brainNodeRadius(node.count, 9, 24, 4);
    brainNodeEls[id].setAttribute("r", r.toFixed(1));

    const stateCls = brainStateClass(node);
    brainNodeEls[id].classList.remove("brain-node-active", "brain-node-idle", "brain-node-ghost");
    brainNodeEls[id].classList.add(stateCls);

    const flowPath = brainEdgeFlowPaths[id];
    if (flowPath) {
      const active = stateCls === "brain-node-active";
      const isError = active && lastStatusByNode[id] && lastStatusByNode[id] !== "ok";
      flowPath.classList.toggle("brain-edge-flow", active);
      flowPath.classList.toggle("brain-edge-flow-error", isError);
    }
  });
  renderBrainFeed(snap.events, !spawnPulses);
  if (spawnPulses) {
    // Si un lote trae una ráfaga real (ej. una corrida de indexación), se
    // anima solo lo último para no disparar una tormenta de pulsos — el
    // resto igual queda reflejado en los conteos y en el feed.
    snap.events.slice(-12).forEach(spawnPulse);
  }
}

// ---- capa de partículas/resplandor/cámara (canvas, sobre el SVG ya construido) ----
// Nunca reemplaza la lógica de nodos/edges/colores de arriba — es pura
// atmósfera y foco de cámara sobre datos ya reales (qué nodo se enciende,
// cuándo). #brainGraphInner (SVG + canvas) se mueve siempre junto vía un
// único transform CSS, así el zoom hacia un nodo nunca desalinea las dos capas.
const BRAIN_VIEWBOX_SIZE = 500;
const BRAIN_AMBIENT_COLOR_NAMES = ["aqua", "violet", "magenta", "white", "grey"];
const BRAIN_MAX_PARTICLES = 400;
let brainParticles = [];
let brainCanvasTransform = { scale: 1, offsetX: 0, offsetY: 0 };
let brainAnimFrameId = null;
let brainLastFrameTs = null;
let brainFocusResetTimer = null;
const brainCamera = { x: 250, y: 250, zoom: 1, targetX: 250, targetY: 250, targetZoom: 1, driftPhase: Math.random() * Math.PI * 2 };

function brainCssColor(name) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(`--brain-${name}`).trim();
  return v || "#ffffff";
}
function resizeBrainCanvas() {
  const rect = brainGraphInner.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = window.devicePixelRatio || 1;
  brainParticlesCanvas.width = Math.round(rect.width * dpr);
  brainParticlesCanvas.height = Math.round(rect.height * dpr);
  const contentSize = Math.min(rect.width, rect.height);
  brainCanvasTransform = {
    scale: contentSize / BRAIN_VIEWBOX_SIZE,
    offsetX: (rect.width - contentSize) / 2,
    offsetY: (rect.height - contentSize) / 2,
  };
}
function brainViewboxToCanvas(x, y) {
  return {
    x: brainCanvasTransform.offsetX + x * brainCanvasTransform.scale,
    y: brainCanvasTransform.offsetY + y * brainCanvasTransform.scale,
  };
}
function spawnAmbientParticle() {
  const depth = 0.3 + Math.random() * 0.7; // 0=lejos/tenue/lento, 1=cerca/brillante/rápido — profundidad real, no decorativa al azar puro
  return {
    kind: "ambient",
    x: Math.random() * BRAIN_VIEWBOX_SIZE,
    y: Math.random() * BRAIN_VIEWBOX_SIZE,
    vx: (Math.random() - 0.5) * 22 * depth,
    vy: (Math.random() - 0.5) * 22 * depth,
    r: (0.7 + Math.random() * 1.8) * (0.5 + depth * 0.7),
    depth,
    color: brainCssColor(BRAIN_AMBIENT_COLOR_NAMES[Math.floor(Math.random() * BRAIN_AMBIENT_COLOR_NAMES.length)]),
    alpha: 0.1 + Math.random() * 0.3,
  };
}
function initBrainParticles() {
  const count = isDesktopDashboard() ? 90 : 45;
  brainParticles = Array.from({ length: count }, spawnAmbientParticle);
}

// ---- malla de filamentos (referencia real: capturas de Jarvis/Ultron
// pasadas por el fundador — una masa volumétrica de líneas finas tipo
// sinapsis, no un diagrama de nodos prolijo). Puramente atmósfera, igual
// que las partículas ambiente: no representa ningún dato propio, solo hace
// que el grafo real (nodos/edges/colores, sin tocar) se sienta como una
// entidad de luz densa en vez de un esquema plano. Generada una sola vez al
// construir el grafo — se anima con jitter por frame, no se recalcula.
const BRAIN_MESH_LINK_DIST = 78;
const BRAIN_MESH_SATELLITES_PER_NODE = 9;
const BRAIN_MESH_NEIGHBORS = 4;
let brainMeshPoints = [];
let brainMeshLinks = [];

function initBrainMesh() {
  brainMeshPoints = [];
  brainMeshLinks = [];
  Object.entries(brainNodeEls).forEach(([id, el]) => {
    const cx = parseFloat(el.getAttribute("cx")) || 250;
    const cy = parseFloat(el.getAttribute("cy")) || 250;
    const color = getComputedStyle(el).color;
    for (let i = 0; i < BRAIN_MESH_SATELLITES_PER_NODE; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 10 + Math.random() * 46;
      brainMeshPoints.push({
        x: cx + Math.cos(angle) * dist,
        y: cy + Math.sin(angle) * dist,
        color,
        phase: Math.random() * Math.PI * 2,
      });
    }
  });
  // Enlaza cada punto con sus ~3 vecinos reales más cercanos dentro de un
  // radio — así la malla queda densa cerca de cada nodo y rala entre
  // regiones distintas, en vez de una nube uniforme sin forma.
  for (let i = 0; i < brainMeshPoints.length; i++) {
    const candidates = [];
    for (let j = 0; j < brainMeshPoints.length; j++) {
      if (i === j) continue;
      const dx = brainMeshPoints[i].x - brainMeshPoints[j].x;
      const dy = brainMeshPoints[i].y - brainMeshPoints[j].y;
      const d = Math.hypot(dx, dy);
      if (d < BRAIN_MESH_LINK_DIST) candidates.push({ j, d });
    }
    candidates.sort((a, b) => a.d - b.d);
    candidates.slice(0, BRAIN_MESH_NEIGHBORS).forEach(({ j }) => {
      const key = i < j ? `${i}_${j}` : `${j}_${i}`;
      if (!brainMeshLinks.some((l) => l.key === key)) brainMeshLinks.push({ key, a: i, b: j });
    });
  }
}
function drawBrainAura(ctx, ts) {
  const t = ts / 1000;
  const breathe = 0.85 + Math.sin(t * 0.25) * 0.15; // nunca del todo estática, ni en reposo
  const center = brainViewboxToCanvas(250, 250);
  const radius = 235 * brainCanvasTransform.scale;
  const grad = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, radius);
  grad.addColorStop(0, `rgba(161,36,255,${(0.11 * breathe).toFixed(3)})`);
  grad.addColorStop(0.55, `rgba(0,255,222,${(0.07 * breathe).toFixed(3)})`);
  grad.addColorStop(1, "transparent");
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 1;
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
  ctx.fill();
}
function drawBrainMesh(ctx, ts) {
  const t = ts / 1000;
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = Math.max(0.5, 0.9 * brainCanvasTransform.scale);
  brainMeshLinks.forEach(({ a, b }) => {
    const pa = brainMeshPoints[a];
    const pb = brainMeshPoints[b];
    const ax = pa.x + Math.sin(t * 0.6 + pa.phase) * 2.4;
    const ay = pa.y + Math.cos(t * 0.5 + pa.phase) * 2.4;
    const bx = pb.x + Math.sin(t * 0.6 + pb.phase) * 2.4;
    const by = pb.y + Math.cos(t * 0.5 + pb.phase) * 2.4;
    const posA = brainViewboxToCanvas(ax, ay);
    const posB = brainViewboxToCanvas(bx, by);
    const jitter = Math.sin(t * 0.8 + pa.phase + pb.phase) * 5 * brainCanvasTransform.scale;
    const midX = (posA.x + posB.x) / 2 + jitter;
    const midY = (posA.y + posB.y) / 2 - jitter;
    ctx.strokeStyle = pa.color;
    ctx.globalAlpha = 0.19;
    ctx.beginPath();
    ctx.moveTo(posA.x, posA.y);
    ctx.quadraticCurveTo(midX, midY, posB.x, posB.y);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}
function spawnBrainBurst(nodeId, isError) {
  const node = brainNodeEls[nodeId];
  if (!node) return;
  const cx = parseFloat(node.getAttribute("cx"));
  const cy = parseFloat(node.getAttribute("cy"));
  if (Number.isNaN(cx) || Number.isNaN(cy)) return;
  const color = isError ? brainCssColor("red") : getComputedStyle(node).color;
  for (let i = 0; i < 16; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 30 + Math.random() * 90;
    brainParticles.push({
      kind: "burst",
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 1.2 + Math.random() * 2.4,
      color,
      alpha: 1,
      life: 0,
      maxLife: 0.8 + Math.random() * 0.7,
    });
  }
  if (brainParticles.length > BRAIN_MAX_PARTICLES) {
    const overflow = brainParticles.length - BRAIN_MAX_PARTICLES;
    let removed = 0;
    brainParticles = brainParticles.filter((p) => {
      if (p.kind === "burst" && removed < overflow) { removed++; return false; }
      return true;
    });
  }
}
function triggerBrainCameraFocus(nodeId) {
  const node = brainNodeEls[nodeId];
  if (!node) return;
  const cx = parseFloat(node.getAttribute("cx"));
  const cy = parseFloat(node.getAttribute("cy"));
  if (Number.isNaN(cx) || Number.isNaN(cy)) return;
  // El origen de la escala se mezcla hacia el centro (no va 100% al nodo) y
  // el zoom es más moderado — un foco total sobre un nodo del anillo
  // externo empuja el lado opuesto del grafo (y sus etiquetas) fuera del
  // recorte del contenedor. Bug real reportado por el fundador, corregido
  // acá en vez de solo en el estilo.
  brainCamera.targetX = 250 + (cx - 250) * 0.18;
  brainCamera.targetY = 250 + (cy - 250) * 0.18;
  brainCamera.targetZoom = 1.07;
  if (brainFocusResetTimer) clearTimeout(brainFocusResetTimer);
  brainFocusResetTimer = setTimeout(() => {
    brainCamera.targetX = 250;
    brainCamera.targetY = 250;
    brainCamera.targetZoom = 1;
  }, 2400);
}
function drawGlowDot(ctx, x, y, r, color, alpha) {
  if (alpha <= 0 || r <= 0) return;
  ctx.globalAlpha = alpha;
  const halo = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
  halo.addColorStop(0, color);
  halo.addColorStop(1, "transparent");
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(x, y, r * 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = Math.min(1, alpha * 1.6);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
}
function updateAndDrawParticle(ctx, p, dt) {
  if (p.kind === "ambient") {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.x < -15) p.x = BRAIN_VIEWBOX_SIZE + 15; else if (p.x > BRAIN_VIEWBOX_SIZE + 15) p.x = -15;
    if (p.y < -15) p.y = BRAIN_VIEWBOX_SIZE + 15; else if (p.y > BRAIN_VIEWBOX_SIZE + 15) p.y = -15;
  } else {
    p.life += dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.94;
    p.vy *= 0.94;
    p.alpha = Math.max(0, 1 - p.life / p.maxLife);
  }
  const pos = brainViewboxToCanvas(p.x, p.y);
  const radiusPx = p.r * brainCanvasTransform.scale;
  drawGlowDot(ctx, pos.x, pos.y, radiusPx, p.color, p.alpha);
}
function updateBrainCamera(dt) {
  const ease = 1 - Math.pow(0.0005, dt);
  brainCamera.x += (brainCamera.targetX - brainCamera.x) * ease;
  brainCamera.y += (brainCamera.targetY - brainCamera.y) * ease;
  brainCamera.zoom += (brainCamera.targetZoom - brainCamera.zoom) * ease;

  // Deriva ambiental sutil, siempre presente — la sensación de flotar en el
  // espacio digital pedida, nunca del todo estática ni cuando no hay foco.
  brainCamera.driftPhase += dt * 0.12;
  const driftX = Math.sin(brainCamera.driftPhase) * 3;
  const driftY = Math.cos(brainCamera.driftPhase * 0.83) * 3;
  const wobble = 1 + Math.sin(brainCamera.driftPhase) * 0.012;

  const origin = brainViewboxToCanvas(brainCamera.x + driftX, brainCamera.y + driftY);
  brainGraphInner.style.transformOrigin = `${origin.x}px ${origin.y}px`;
  brainGraphInner.style.transform = `scale(${(brainCamera.zoom * wobble).toFixed(4)})`;
}
function renderBrainFrame(ts) {
  if (brainLastFrameTs == null) brainLastFrameTs = ts;
  const dt = Math.min(0.05, (ts - brainLastFrameTs) / 1000); // tope: evita saltos si la pestaña estuvo pausada
  brainLastFrameTs = ts;

  const ctx = brainParticlesCanvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, brainParticlesCanvas.width / dpr, brainParticlesCanvas.height / dpr);
  ctx.globalCompositeOperation = "lighter"; // aditivo — el resplandor es real, no un blur simulado

  // Orden de dibujo: aura y malla primero (fondo volumétrico), partículas
  // encima — nodos y etiquetas (SVG, capa aparte) siguen siempre legibles.
  drawBrainAura(ctx, ts);
  drawBrainMesh(ctx, ts);

  brainParticles = brainParticles.filter((p) => p.kind !== "burst" || p.alpha > 0.02);
  brainParticles.forEach((p) => updateAndDrawParticle(ctx, p, dt));

  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  updateBrainCamera(dt);
  brainAnimFrameId = requestAnimationFrame(renderBrainFrame);
}
function startBrainAnimationLoop() {
  stopBrainAnimationLoop();
  brainLastFrameTs = null;
  brainAnimFrameId = requestAnimationFrame(renderBrainFrame);
}
function stopBrainAnimationLoop() {
  if (brainAnimFrameId) { cancelAnimationFrame(brainAnimFrameId); brainAnimFrameId = null; }
}
window.addEventListener("resize", () => { if (isBrainOpen()) resizeBrainCanvas(); });

function isBrainOpen() { return brainOverlay.classList.contains("open"); }
function stopBrainPolling() {
  if (brainPollTimer) { clearInterval(brainPollTimer); brainPollTimer = null; }
}
function startBrainPolling() {
  stopBrainPolling();
  brainPollTimer = setInterval(pollBrain, BRAIN_POLL_MS);
}
async function pollBrain() {
  try {
    const url = brainSince === null ? "/dashboard/brain" : `/dashboard/brain?since=${brainSince}`;
    const res = await apiFetch(url);
    const data = await res.json();
    applyBrainSnapshot(data, brainSince !== null);
    brainSince = data.server_time;
  } catch (e) {
    // fallo silencioso: se reintenta en el próximo ciclo, mismo criterio que Gmail
  }
}

  Object.values(brainEdgeFlowPaths).forEach((el) => el.classList.remove("brain-edge-flow", "brain-edge-flow-error"));
  brainGraphInner.style.transform = "";
