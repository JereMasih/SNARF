<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snarf</title>
<style>
  :root {
    --glow: #4fd8e8;
    --glow-soft: #b6f5fb;
    --glow-dim: #1c5a63;
    --text-dim: #6f8891;
    --text: #d7eef2;
    --error: #e85a5a;

    /* Paleta real de la marca del fundador ("PALETA DE COLORES JERE MASIH
       TRADER", encontrada en su Drive indexado) — reusada tal cual, no
       inventada. Solo el cerebro de Snarf la usa; el resto de la interfaz
       se queda monocromática cian a propósito. */
    --brain-magenta: #ff00ee;
    --brain-aqua: #00ffde;
    --brain-violet: #a124ff;
    --brain-violet-dark: #16003e;
    --brain-green: #00ff0a;
    --brain-red: #ff2952;
    --brain-yellow: #ffe600;
    --brain-white: #ffffff;
    --brain-grey: #6b7684;

    /* Sistema de diseño "holográfico" del HUD (Fase 0 del plan de dock
       radial, ver TELEMETRY_SCHEMA.md/web/hud_design_tokens.css) — el cian
       reusa --glow de arriba a propósito (mismo acento de toda la
       interfaz, no una paleta paralela). El ámbar es la única adición
       real: decisión de diseño nueva de esa fase, reservada para
       atención/estado (nunca "tipo de archivo", ese significado ya es de
       --brain-yellow). */
    --hud-amber: #ffb454;
    --hud-amber-soft: #ffd9a8;
    /* Rojo de señal para las etiquetas del dock del cerebro (Vista HUD) —
       decisión de diseño nueva (2026-08-03), con autorización explícita
       del fundador para reusar la estética literal de sus referencias
       visuales (HUD tipo Iron Man Mark III). Supersede, solo para este
       componente puntual, el límite de "color literal no" de ADR
       0006/0037 — ver ADR nueva. Nunca reemplaza --error (semántica
       distinta: esto es un acento de etiqueta, no un estado de fallo). */
    --hud-signal-red: #ff3b3b;
    --hud-font-mono: "SF Mono", "Menlo", "Cascadia Code", "Roboto Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Barras de desplazamiento ocultas por default en TODA la interfaz —
     aparecen solo mientras se hace scroll de verdad (clase .scrollbar-visible,
     agregada/quitada por un listener global de "scroll", ver <script>), nunca
     permanentes. Antes un textarea de una sola línea ya mostraba una barra
     visible con solo `overflow-y: auto` — esto la deja invisible hasta que
     realmente haga falta desplazar. */
  * { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  *.scrollbar-visible { scrollbar-color: rgba(79,216,232,0.35) transparent; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: transparent; border-radius: 999px; }
  *.scrollbar-visible::-webkit-scrollbar-thumb { background: rgba(79,216,232,0.35); }
  html { background: #000; height: 100%; overflow-x: hidden; overscroll-behavior: none; }
  body {
    margin: 0;
    height: 100dvh;
    background: #000;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* --- atmosphere layers --- */
  .bg-glow {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 65% 55% at 50% 40%, #0c1c22 0%, #050a0c 45%, #000000 82%);
    z-index: 0;
  }
  .nebula {
    position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.35; z-index: 0;
    animation: drift 26s ease-in-out infinite;
  }
  .nebula.a { width: 55vw; height: 55vw; background: #0d3a42; top: -10%; left: -15%; }
  .nebula.b { width: 45vw; height: 45vw; background: #072a33; bottom: -15%; right: -10%; animation-duration: 32s; animation-delay: -8s; }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(3%, -4%) scale(1.08); }
  }
  .grid {
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(79,216,232,0.035) 0px, rgba(79,216,232,0.035) 1px, transparent 1px, transparent 46px),
      repeating-linear-gradient(90deg, rgba(79,216,232,0.035) 0px, rgba(79,216,232,0.035) 1px, transparent 1px, transparent 46px);
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 40%, black 0%, transparent 75%);
    mask-image: radial-gradient(ellipse 60% 55% at 50% 40%, black 0%, transparent 75%);
    z-index: 0;
  }
  .particle {
    position: fixed; width: 3px; height: 3px; border-radius: 50%;
    background: var(--glow); box-shadow: 0 0 6px 2px rgba(79,216,232,0.7);
    opacity: 0; z-index: 0; animation: float-up linear infinite;
  }
  @keyframes float-up {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 0.8; } 90% { opacity: 0.4; }
    100% { transform: translateY(-40vh); opacity: 0; }
  }
  .scanline {
    position: fixed; left: 0; right: 0; top: -2px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(79,216,232,0.45), transparent);
    animation: scan 7s linear infinite; z-index: 1;
  }
  @keyframes scan { 0% { top: -2px; } 100% { top: 100%; } }

  .corner {
    position: fixed; width: 26px; height: 26px;
    border: 1px solid rgba(79,216,232,0.3); z-index: 1;
  }
  .corner.tl { top: env(safe-area-inset-top, 12px); left: 12px; border-right: none; border-bottom: none; }
  .corner.tr { top: env(safe-area-inset-top, 12px); right: 12px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: calc(env(safe-area-inset-bottom, 12px) + 12px); left: 12px; border-right: none; border-top: none; }
  .corner.br { bottom: calc(env(safe-area-inset-bottom, 12px) + 12px); right: 12px; border-left: none; border-top: none; }

  /* --- top bar: menu toggle --- */
  .menu-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: 16px;
    z-index: 6;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.3);
    background: rgba(5,10,12,0.6);
    color: var(--glow);
    font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  /* En Vista HUD no abre nada que tenga sentido todavía ahí (pedido
     explícito) — la clase la pone/saca JS en setDashboardView. */
  body.dash-hud-active .menu-btn { display: none; }

  /* --- sidebar --- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: min(280px, 78vw);
    background: rgba(4,8,10,0.92);
    border-right: 1px solid rgba(79,216,232,0.2);
    backdrop-filter: blur(10px);
    z-index: 8;
    transform: translateX(-105%);
    transition: transform 0.28s ease;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 60px) 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .sidebar.open { transform: translateX(0); }
  /* Modo enfoque (desktop): la misma barra lateral del menú hamburguesa de
     mobile, reparentada adentro del panel de chat a pantalla completa —
     acá deja de ser un cajón fuera de pantalla y pasa a ocupar su lugar fijo
     al costado, siempre visible mientras el modo enfoque está abierto. */
  .chat-focus-panel .sidebar.docked {
    position: static; transform: none; transition: none;
    width: 260px; min-width: 260px; height: 100%;
    padding: 0.8rem 0;
  }
  .sidebar-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 7; opacity: 0; pointer-events: none; transition: opacity 0.28s ease;
  }
  .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
  .new-conv-btn {
    margin: 0 14px 14px;
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    border: 1px solid rgba(79,216,232,0.35);
    background: rgba(79,216,232,0.1);
    color: var(--text);
    font-family: inherit;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-align: left;
  }
  .conv-list { overflow-y: auto; overscroll-behavior: contain; flex: 1 1 auto; padding: 0 8px; }
  /* Swipe hacia abajo desde arriba del todo para refrescar el historial —
     crece de 0 a su alto real en vez de seguir el dedo 1:1 (más simple,
     igual responde al gesto real). */
  .pull-refresh-indicator {
    max-height: 0; overflow: hidden; opacity: 0;
    font-size: 0.68rem; letter-spacing: 0.03em; color: var(--text-dim); text-align: center;
    transition: max-height 0.15s ease, opacity 0.15s ease;
  }
  .pull-refresh-indicator.visible { max-height: 28px; opacity: 1; padding: 0.4rem 0; }
  .pull-refresh-indicator.ready { color: var(--glow-soft); }
  .conv-item {
    padding: 0.65rem 0.7rem;
    border-radius: 8px;
    font-size: 0.72rem;
    color: var(--text-dim);
    cursor: pointer;
    margin-bottom: 2px;
    line-height: 1.4;
  }
  .conv-item:hover, .conv-item.active { background: rgba(79,216,232,0.1); color: var(--text); }
  .conv-item .conv-date { display: block; font-size: 0.6rem; opacity: 0.7; margin-top: 2px; }
  .conv-empty { padding: 1rem 0.7rem; font-size: 0.7rem; color: var(--text-dim); opacity: 0.6; }
  /* --- user menu (sidebar) --- */
  .user-menu { margin: 10px 14px 0; position: relative; }
  .user-menu-btn {
    width: 100%; display: flex; align-items: center; gap: 0.55rem;
    padding: 0.55rem 0.7rem; border-radius: 10px;
    border: 1px solid rgba(79,216,232,0.25); background: rgba(79,216,232,0.06);
    color: var(--text); font-family: inherit; font-size: 0.72rem; cursor: pointer; text-align: left;
  }
  .user-avatar {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: rgba(79,216,232,0.2); border: 1px solid rgba(79,216,232,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: var(--glow-soft); text-transform: uppercase;
  }
  .user-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-caret { color: var(--text-dim); font-size: 0.6rem; transition: transform 0.2s ease; }
  .user-menu.open .user-caret { transform: rotate(180deg); }
  .user-menu-popover {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 6px);
    background: rgba(5,10,12,0.96); border: 1px solid rgba(79,216,232,0.3);
    border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
    opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .user-menu.open .user-menu-popover { opacity: 1; transform: none; pointer-events: auto; }
  .user-menu-item {
    display: flex; align-items: center; gap: 0.5rem; background: none; border: none;
    color: var(--text-dim); font-family: inherit; font-size: 0.72rem;
    padding: 0.5rem 0.6rem; border-radius: 8px; cursor: pointer; text-align: left;
  }
  .user-menu-item:hover:not(:disabled) { background: rgba(79,216,232,0.1); color: var(--text); }
  .user-menu-item:disabled { opacity: 0.45; cursor: default; }
  .user-menu-item.danger { color: #e88a8a; }
  .user-menu-item.danger:hover { background: rgba(232,90,90,0.12); color: #fff; }

  /* --- view switching (chat / dashboard) --- */
  #appRoot { position: relative; z-index: 2; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .view-chat, .view-dashboard {
    flex: 1 1 auto; min-height: 0; display: none; flex-direction: column;
  }
  .view-chat.active, .view-dashboard.active { display: flex; }

  /* --- modo Jarvis: grilla unificada y redimensionable (desktop ancho) ---
     Reemplaza las tres zonas fijas de antes (arriba/izquierda/derecha) por
     una sola grilla de 12 columnas donde todo bloque —incluidos el chat y
     el historial, antes fijos— es igual de movible y redimensionable. */
  @media (min-width: 900px) {
    /* rem es siempre relativo al <html> raíz, nunca al ancestro más cercano
       — por eso el aumento de legibilidad va acá (gatillado solo por ancho
       de pantalla, no por body.jarvis-mode, que no es seleccionable desde
       html) y no en cada clase suelta. Pensado para 1920×1080 real. */
    html { font-size: 18px; }
    /* El historial de conversaciones ya es un bloque siempre visible de la
       grilla en desktop, pero el botón hamburguesa (menuBtn) sigue siendo el
       único camino real al menú de usuario (configuración del dashboard,
       cerrar sesión) — ocultarlo del todo, como hacía antes, dejaba el modo
       desktop sin ningún acceso a esos dos. Se mantiene visible; abre el
       mismo cajón lateral de siempre, que funciona igual estando o no en
       modo Jarvis. */
    /* El toggle de modo (Toque/Teclado) sí se oculta: en desktop siempre se
       arranca en modo Teclado (ver "let mode" más abajo) y la caja de texto
       ya tiene su propio botón de micrófono al lado — el modo Toque (el
       orbe a pantalla completa) no aporta nada ahí y el toggle quedaba
       sobrando en la barra superior. */
    body.jarvis-mode .mode-fab { display: none; }
    /* Ya no hay una vista "solo chat" separada en desktop — el chat vive
       siempre dentro de la grilla (ver reparentChatIntoDashboard); el modo
       enfoque cubre la misma necesidad expandiendo ese mismo bloque. */
    body.jarvis-mode .dash-btn { display: none; }
    body.jarvis-mode #appRoot {
      display: block; height: 100%; overflow-y: auto;
      padding: calc(env(safe-area-inset-top, 0px) + 3.8rem) 1.2rem 1.5rem;
    }
    body.jarvis-mode .view-chat { display: none; }
    body.jarvis-mode .view-dashboard { display: contents; }
    body.jarvis-mode .dash-mobile-stack { display: none; }
    body.jarvis-mode .dash-grid-desktop {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: 28px;
      grid-auto-flow: row;
      gap: 0.9rem;
    }
    /* Cada bloque necesita una altura real (no solo intrínseca) para que
       grid-row: span funcione — el contenido que no entra scrollea adentro
       en vez de desbordar la tarjeta. Solo en desktop: mobile conserva su
       .dash-widget de altura intrínseca de siempre, sin tocar. */
    body.jarvis-mode .dash-widget {
      display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden;
    }
    body.jarvis-mode .dash-widget-body {
      display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow-y: auto;
    }
    /* El historial de conversaciones/proyectos ya vive como bloque propio
       de la grilla (#dashHistoryParked) — mostrarlo TAMBIÉN acá, dentro del
       cajón del hamburguesa, era pura redundancia (mismo contenido, dos
       lugares). El cajón en escritorio queda solo para lo que no tiene otro
       camino: configuración del dashboard y cerrar sesión. Selector con
       #sidebar a propósito: #dashHistoryParked reusa las mismas clases
       .sidebar-tabs/.sidebar-tab-panel y no debe verse afectado. */
    /* :not(.docked) a propósito: dentro del modo enfoque (openChatFocus) esta
       misma barra se reutiliza como panel de historial fijo — ocultarla ahí
       también era un bug real (modo enfoque quedaba sin nada al costado). */
    /* :not(.hud-drawer) a propósito, mismo motivo que :not(.docked): dentro
       del drawer lateral de Vista HUD (v2) esta barra también se reutiliza
       para mostrar conversaciones/proyectos de verdad. */
    body.jarvis-mode #sidebar:not(.docked):not(.hud-drawer) .sidebar-tabs, body.jarvis-mode #sidebar:not(.docked):not(.hud-drawer) .sidebar-tab-panel { display: none; }
  }
  .dash-grid-desktop { display: none; }

  /* --- Vista HUD del dashboard (rediseño radial) — TODO este bloque es
     aditivo: la grilla clásica de arriba no pierde ninguna regla, sigue
     funcionando exactamente igual con el toggle en "clásica" (ver Decisión
     R del rediseño: reversible de verdad, no solo en apariencia). Solo
     relevante en escritorio — Vista HUD nunca se activa en mobile. */
  .dash-view-toggle { display: none; }
  body.jarvis-mode .dash-view-toggle { display: flex; gap: 0.4rem; justify-content: center; margin-bottom: 0.6rem; }
  .dash-view-toggle-btn {
    font-family: var(--hud-font-mono); font-size: 0.7rem; letter-spacing: 0.02em;
    background: rgba(79,216,232,0.06); border: 1px solid rgba(79,216,232,0.25);
    color: var(--text-dim); padding: 0.3rem 0.7rem; border-radius: 999px; cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .dash-view-toggle-btn.active { color: var(--glow); border-color: var(--glow); background: rgba(79,216,232,0.12); }

  .dash-hud-view { display: none; flex-direction: column; min-height: 0; }
  body.jarvis-mode .dash-hud-view:not([hidden]) { display: flex; height: calc(100% - 2.2rem); }
  body.jarvis-mode .dash-grid-desktop[hidden] { display: none; }

  .dash-hud-banner {
    flex: 0 0 auto; text-align: center; font-family: var(--hud-font-mono); font-size: 0.78rem;
    color: var(--text-dim); padding: 0.3rem 1rem 0.6rem; min-height: 1.4rem; transition: color 0.3s ease;
  }
  .dash-hud-banner.curating { color: var(--glow-soft); }
  .dash-hud-banner-dot {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--hud-amber);
    margin-right: 0.4rem; animation: hud-focal-pulse-mini 1.4s ease-in-out infinite;
  }

  .dash-hud-stage {
    position: relative; flex: 1 1 auto; min-height: 0;
    /* v2: escena 3D real (antes solo el orbe simulaba profundidad a mano) —
       un único plano de perspectiva compartido por widgets y líneas de
       conexión, para que "más lejos del centro" también se lea como "más
       atrás", no solo "más chico en 2D". */
    perspective: 1400px;
  }
  /* Bug real de colisión de `transform` (mismo tipo ya encontrado antes en
     esta sesión, ver ADR 0069/0078): .orb-wrap ya trae su propio
     `transform: scale(0.74)` declarado más abajo en esta hoja de estilos —
     como es la MISMA propiedad, una simple `.dash-hud-orb { transform:
     translate(...) }` perdía el centrado (el scale posterior en el orden
     del archivo ganaba entero, sin combinarse). Selector con más
     especificidad + ambas funciones combinadas en un solo valor para que
     nunca dependa del orden de declaración. */
  .dash-hud-stage .dash-hud-orb {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0.74);
    /* Por encima de .dash-hud-widgets (z-index 3, ver más abajo) a
       propósito (pedido explícito: "la esfera central... que no sea
       tapada con nada") — el empaquetado ya evita que un widget quede EN
       REPOSO sobre el centro, pero mientras se reacomoda (transition de
       550ms sobre transform) su trayectoria puede cruzar el centro de
       paso; con un z-index más alto el orbe sigue siempre visible encima,
       nunca depende de que ningún cálculo de posición sea perfecto. */
    z-index: 5; pointer-events: none;
  }
  .dash-hud-orb.curating .orb { animation: pulse-fast 1.4s ease-in-out infinite, flicker 3s steps(30) infinite; }

  /* Líneas de conexión esfera→widget (v2) — un <line> real por widget
     activo, mismo ciclo de vida que las cards (ver renderDashboardHudWidgets
     en JS: se agregan/actualizan/quitan en el mismo paso). Entre el orbe
     (z-index 1) y las cards (z-index 3): visualmente "salen de atrás de
     cada card, hacia la esfera". */
  .dash-hud-connections { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .dash-hud-connection-line {
    stroke: var(--glow); fill: none; stroke-width: 1;
    stroke-dasharray: 3 5; opacity: 0.35;
    transition: opacity 400ms ease, stroke-dashoffset 400ms linear;
    animation: dash-hud-connection-pulse 2.4s linear infinite;
  }
  @keyframes dash-hud-connection-pulse { to { stroke-dashoffset: -16; } }

  .dash-hud-widgets { position: absolute; inset: 0; z-index: 3; }
  .dash-hud-node {
    position: absolute; left: 0; top: 0;
    padding: 0.55rem 0.7rem; border-radius: 10px;
    background: radial-gradient(circle at 30% 20%, rgba(79,216,232,0.08), rgba(5,10,12,0.82) 70%);
    border: 1px solid rgba(79,216,232,0.28);
    box-shadow: 0 0 10px rgba(79,216,232,0.1), 0 4px 14px rgba(0,0,0,0.35);
    backdrop-filter: blur(5px) saturate(1.15); cursor: pointer;
    display: flex; flex-direction: column;
    /* Transform único (posición XY + profundidad Z + escala) para que TODO
       (radial, 3D, jerarquía por tier) viva en una sola propiedad animable —
       nunca left/top + transform por separado, para no competir con los
       @keyframes de entrada/salida (que solo tocan filter/box-shadow/::before,
       nunca transform: ver dash-hud-node-arrive más abajo). */
    transition: transform 550ms cubic-bezier(.2,.8,.2,1), opacity 500ms ease, border-color 200ms ease, box-shadow 200ms ease;
  }
  .dash-hud-node:hover { border-color: var(--glow); box-shadow: 0 0 14px rgba(79,216,232,0.28), 0 4px 16px rgba(0,0,0,0.4); z-index: 4; }
  .dash-hud-node-head {
    display: flex; align-items: center; gap: 0.35rem; margin-bottom: 0.2rem; flex: 0 0 auto;
    font-family: var(--hud-font-mono); font-size: 0.62rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--glow-soft);
  }
  .dash-hud-node-icon { opacity: 0.85; }
  .dash-hud-node-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* El rojo queda reservado de verdad para error real (data-alert, ver
     has_error_recent) — antes también coloreaba de rojo por defecto
     cualquier globo (pedido explícito: sacarlo, no era una señal real de
     nada, solo ruido visual). */
  .dash-hud-node[data-alert="1"] { border-color: rgba(255,90,90,0.5); }
  .dash-hud-node[data-alert="1"] .dash-hud-node-head { color: var(--error); }

  /* Familias visuales (ver HUD_BUBBLE_FAMILY en JS): un nodo/tool nuevo
     hereda su estilo por familia, sin CSS nuevo. */
  .dash-hud-node[data-family="document"] { border-color: rgba(255,180,84,0.35); }
  .dash-hud-node[data-family="document"] .dash-hud-node-head { color: var(--hud-amber); }
  .dash-hud-node[data-family="voice"] .dash-hud-slot-body { font-style: italic; }
  .dash-hud-node[data-family="think"] { opacity: 0.9; }
  .dash-hud-node[data-family="admin"] { border-color: rgba(255,255,255,0.2); }
  .dash-hud-node[data-family="input"] { opacity: 0.85; }

  /* --- Jerarquía por tamaño (v2, Decisión 1/9 del plan): 3 tiers, cada uno
     con más lugar real para contenido — nunca solo "lo mismo más grande". --- */
  .dash-hud-node[data-tier="small"] { font-size: 0.85em; }
  .dash-hud-node[data-tier="medium"] { font-size: 0.95em; }
  .dash-hud-node[data-tier="large"] { font-size: 1.05em; padding: 0.75rem 0.9rem; }
  .dash-hud-node[data-tier="large"] .dash-hud-node-head { font-size: 0.68rem; }

  /* --- Slots de contenido — vocabulario compartido por las 24 plantillas
     (ver snarf/telemetry/widget_templates.py): cada plantilla es una
     combinación de estos, nunca CSS a medida por plantilla individual. --- */
  .dash-hud-slot-body {
    font-size: 0.72rem; color: var(--text); opacity: 0.92; flex: 1 1 auto; min-height: 0;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  }
  .dash-hud-node[data-tier="small"] .dash-hud-slot-body { -webkit-line-clamp: 1; }
  .dash-hud-node[data-tier="large"] .dash-hud-slot-body { -webkit-line-clamp: 4; font-size: 0.78rem; }
  .dash-hud-slot-caption {
    margin-top: 0.15rem; font-size: 0.66rem; color: var(--text-dim); font-style: italic; flex: 0 0 auto;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  }
  .dash-hud-node[data-tier="large"] .dash-hud-slot-caption { -webkit-line-clamp: 3; font-size: 0.72rem; }
  .dash-hud-slot-narrative {
    font-size: 0.8rem; color: var(--text); opacity: 0.95; font-style: italic; line-height: 1.45; flex: 1 1 auto; overflow: hidden;
  }
  .dash-hud-slot-badge {
    display: flex; align-items: center; justify-content: center; flex: 1 1 auto;
    font-family: var(--hud-font-mono); font-size: 1.4rem; color: var(--glow);
  }
  .dash-hud-slot-icon-big { display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex: 0 0 auto; }
  .dash-hud-slot-stat-row { display: flex; gap: 0.6rem; flex: 1 1 auto; }
  .dash-hud-slot-stat { flex: 1 1 0; min-width: 0; }
  .dash-hud-slot-stat-value { font-family: var(--hud-font-mono); font-size: 1.05rem; color: var(--glow-soft); line-height: 1.2; }
  .dash-hud-slot-stat-label { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .dash-hud-slot-list { list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 0.2rem; }
  .dash-hud-slot-list li {
    font-size: 0.7rem; color: var(--text); opacity: 0.88; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding-left: 0.6rem; position: relative;
  }
  .dash-hud-slot-list li::before { content: ""; position: absolute; left: 0; top: 0.4em; width: 4px; height: 4px; border-radius: 50%; background: var(--glow-soft); }
  .dash-hud-slot-timeline { list-style: none; margin: 0; padding: 0 0 0 0.8rem; border-left: 1px solid rgba(79,216,232,0.25); flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 0.35rem; }
  .dash-hud-slot-timeline li { font-size: 0.7rem; color: var(--text); opacity: 0.88; position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-hud-slot-timeline li::before { content: ""; position: absolute; left: -0.94rem; top: 0.35em; width: 6px; height: 6px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 4px var(--glow); }
  .dash-hud-slot-timeline-time { color: var(--text-dim); font-family: var(--hud-font-mono); font-size: 0.6rem; margin-right: 0.35rem; }
  .dash-hud-slot-wall { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.3rem; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .dash-hud-slot-wall-item {
    font-size: 0.62rem; color: var(--text-dim); background: rgba(79,216,232,0.06); border: 1px solid rgba(79,216,232,0.15);
    border-radius: 6px; padding: 0.3rem 0.4rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .dash-hud-slot-stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; flex: 1 1 auto; }
  .dash-hud-slot-ticker { font-family: var(--hud-font-mono); font-size: 0.72rem; color: var(--glow-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; display: flex; align-items: center; gap: 0.35rem; }
  .dash-hud-slot-ticker::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--hud-signal-red); flex-shrink: 0; animation: breathe 2.2s ease-in-out infinite; }
  .dash-hud-slot-gauge {
    width: 62%; aspect-ratio: 1; margin: 0 auto; border-radius: 50%; flex-shrink: 0;
    background: conic-gradient(var(--glow) calc(var(--gauge-pct, 0) * 1%), rgba(255,255,255,0.08) 0);
    display: flex; align-items: center; justify-content: center;
  }
  .dash-hud-slot-gauge::after { content: attr(data-gauge-label); font-family: var(--hud-font-mono); font-size: 0.6rem; color: var(--text); background: rgba(5,10,12,0.85); border-radius: 50%; width: 74%; height: 74%; display: flex; align-items: center; justify-content: center; text-align: center; }
  .dash-hud-slot-chart { flex: 1 1 auto; min-height: 28px; display: flex; align-items: flex-end; gap: 2px; }
  .dash-hud-slot-chart-bar { flex: 1 1 0; background: linear-gradient(to top, var(--glow), var(--glow-soft)); border-radius: 1px 1px 0 0; min-height: 2px; opacity: 0.8; }

  /* --- Animación de entrada/salida por TIER (Decisión 4 del plan v2): un
     lenguaje de movimiento consistente, nunca 24 efectos sueltos. Solo
     tocan opacity/filter/::before — nunca `transform` (esa la gobierna
     siempre el JS vía transición normal, ver arriba), para que jamás
     compitan con el reposicionamiento real del FLIP. --- */
  .dash-hud-node[data-anim="arriving"] { opacity: 0; }
  .dash-hud-node[data-anim="arriving"][data-tier="small"] { animation: dash-hud-pop-in 300ms cubic-bezier(.2,.8,.2,1) forwards; }
  .dash-hud-node[data-anim="arriving"][data-tier="medium"] { animation: dash-hud-pop-in 450ms cubic-bezier(.2,.8,.2,1) forwards, dash-hud-trail-flash 450ms ease forwards; }
  .dash-hud-node[data-anim="arriving"][data-tier="large"] { animation: dash-hud-pop-in 700ms cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes dash-hud-pop-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dash-hud-trail-flash { 0% { filter: brightness(1); } 30% { filter: brightness(1.9); } 100% { filter: brightness(1); } }
  .dash-hud-node[data-anim="arriving"][data-tier="large"]::before {
    content: ""; position: absolute; inset: 0; border-radius: 10px; pointer-events: none;
    border: 1px solid var(--glow); animation: dash-hud-scan-sweep 650ms ease forwards;
  }
  @keyframes dash-hud-scan-sweep {
    0% { clip-path: inset(0 100% 0 0); opacity: 1; }
    70% { clip-path: inset(0 0 0 0); opacity: 1; }
    100% { clip-path: inset(0 0 0 0); opacity: 0; }
  }
  .dash-hud-node[data-anim="arriving"][data-tier="large"] > * { animation: dash-hud-pop-in 350ms ease 220ms both; }

  .dash-hud-node[data-anim="leaving"] { opacity: 0; pointer-events: none; }
  .dash-hud-node[data-tier="small"][data-anim="leaving"] { transition: opacity 280ms ease, transform 280ms ease; }
  .dash-hud-node[data-tier="medium"][data-anim="leaving"],
  .dash-hud-node[data-tier="large"][data-anim="leaving"] { transition: opacity 400ms ease, transform 400ms ease; }

  .dash-hud-node.dash-hud-node-updating { animation: dash-hud-node-updating 500ms ease; }
  @keyframes dash-hud-node-updating {
    0%, 100% { box-shadow: 0 0 10px rgba(79,216,232,0.1), 0 4px 14px rgba(0,0,0,0.35); }
    40% { box-shadow: 0 0 20px rgba(79,216,232,0.5), 0 4px 14px rgba(0,0,0,0.35); }
  }

  /* --- Chat como capa ambiente permanente (Decisión 5/6 del plan v2, solo
     Vista HUD) — hermano fijo de #appRoot (mismo nivel que
     .brain-panel/.chat-focus-panel) para sobrevivir cualquier cambio de
     vista. Ya no hay un binario colapsado/expandido: la barra de input
     (adjuntar/texto/mic, el mismo .control-bar de siempre) está SIEMPRE
     visible; lo único que cambia de estado es el modo enfoque real
     (openChatFocus, ver JS), disparado por un botón chico y sutil en vez de
     la barra grande de antes. --- */
  .chat-dock {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    /* Bug real de colisión de z-index encontrado con Playwright: 11 pisaba
       a .settings-panel (también 11) — cualquier modal (settings/brain/
       chat-focus/node-drill, z-index 10-17) tiene que quedar SIEMPRE por
       encima de esta capa ambiente, nunca al revés. */
    width: min(760px, 92vw); z-index: 9;
    display: flex; flex-direction: column;
    background: transparent; border: none; box-shadow: none;
    transition: left 350ms ease, right 350ms ease, transform 350ms ease, margin-left 350ms ease;
  }
  .chat-dock[hidden] { display: none; }
  /* Posición configurable (Decisión 7): default izquierda en escritorio —
     mismo elemento fijo, solo cambia su ancla horizontal. */
  .chat-dock[data-position="left"] { left: 2rem; transform: none; }
  .chat-dock[data-position="right"] { left: auto; right: 2rem; transform: none; }
  .chat-dock[data-position="center"] { left: 50%; transform: translateX(-50%); }
  /* El drawer de conversaciones (Decisión 8) desplaza de verdad, nunca
     superpone — se combina con cualquier posición de arriba. */
  .chat-dock.drawer-open[data-position="left"],
  .chat-dock.drawer-open[data-position="center"] { margin-left: 300px; }

  /* Solo storage: mientras la Vista HUD está activa, los botones reales de
     acá adentro viven dentro de .text-row, a la altura del input (ver
     reparentChatIntoDock/reparentChatOutOfDock) — nunca flotando aparte a
     mitad de pantalla como antes. */
  .chat-dock-toolbar { display: none; }
  .chat-dock-icon-btn {
    width: 1.9rem; height: 1.9rem; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: rgba(5,10,12,0.75); border: 1px solid rgba(79,216,232,0.25); color: var(--text-dim);
    font-size: 0.8rem; cursor: pointer; opacity: 0.55; backdrop-filter: blur(4px);
    transition: opacity 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .chat-dock-icon-btn:hover { opacity: 1; color: var(--glow); border-color: var(--glow); }
  /* Reubicados dentro de la fila de input (Decisión: misma altura que
     adjuntar, no flotando arriba) — mismo tamaño que el resto de los
     .icon-btn de la fila para que quede prolijamente alineado. Scopeado a
     #chatDock a propósito: si el modo enfoque se abre desde acá, .text-row
     (con estos botones adentro, mismo nodo vivo) viaja a chatFocusMain —
     ahí no tienen sentido (☰ ya es redundante con el sidebar siempre
     visible, ⤢ sería reabrir el enfoque en el que ya se está) y quedan
     ocultos solos, sin lógica de show/hide aparte. */
  .text-row #chatDockDrawerBtn, .text-row #chatDockFocusBtn { display: none; }
  #chatDock .text-row #chatDockDrawerBtn, #chatDock .text-row #chatDockFocusBtn {
    display: flex; width: 42px; height: 42px; flex: 0 0 auto;
  }

  .chat-dock-body { display: flex; flex-direction: column; height: min(58vh, 560px); min-height: 0; }
  .chat-dock .chat {
    flex: 1 1 auto; min-height: 0; background: none; max-width: none;
    /* Fondo del chat "abierto" al dashboard de atrás — sin caja contenedora
       propia, mismo pedido explícito: las burbujas flotan sobre el fondo.
       Degradado acotado al último 10% superior nada más (pedido real del
       fundador: la sombra se comía contenido con un tercio entero — el
       resto del chat queda siempre a opacidad plena). */
    -webkit-mask-image: linear-gradient(to top, black 90%, transparent 100%);
    mask-image: linear-gradient(to top, black 90%, transparent 100%);
  }
  /* Sin contenedor propio (pedido explícito): la barra de input queda
     posada directo sobre el fondo del dashboard, igual que el chat. */
  .chat-dock .control-bar { background: none; border: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; padding-top: 0.4rem; }
  /* Los globos del chat tampoco llevan contenedor acá — única vista del
     ecosistema donde flotan directo sobre el fondo (pedido explícito, para
     que el degradado de arriba se vea bien). */
  #chatDock .msg.user, #chatDock .msg.snarf {
    background: none; border: none; box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none;
  }

  /* --- Drill-down genérico por nodo (Decisión 4) — mismo patrón visual de
     overlay+panel que .brain-overlay/.brain-panel y .chat-focus-*, panel
     propio porque el contenido de #brainPanel está armado a medida para el
     grafo/HUD del cerebro, no para una lista genérica de actividad. --- */
  .node-drill-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 16;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .node-drill-overlay.open { opacity: 1; pointer-events: auto; }
  .node-drill-panel {
    position: fixed; z-index: 17; left: 50%; top: 50%; transform: translate(-50%, -46%);
    width: min(640px, 94vw); max-height: min(600px, 86vh);
    background: rgba(5,10,12,0.98); border: 1px solid rgba(79,216,232,0.35); border-radius: 16px;
    padding: 1rem; display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .node-drill-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .node-drill-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; flex-shrink: 0; }
  .node-drill-body { overflow-y: auto; min-height: 0; flex: 1 1 auto; }
  .node-drill-row { padding: 0.5rem 0.2rem; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.8rem; }
  .node-drill-row-verb { font-weight: 500; }
  .node-drill-row-detalle { color: var(--text-dim); font-size: 0.74rem; margin-top: 0.1rem; }
  .node-drill-row-meta { color: var(--text-dim); font-size: 0.68rem; margin-top: 0.1rem; }

  /* --- Drawer lateral de conversaciones/proyectos (Decisión 8, solo Vista
     HUD) — reparenta el #sidebar real (mismo criterio "mover el nodo vivo"
     que ya usa openChatFocus), nunca lo clona. Mismo mecanismo de slide que
     .sidebar de siempre, en un ancla propia para poder desplazar el chat-dock
     en vez de superponerse a él. --- */
  .dash-hud-sidebar-drawer {
    /* z-index 9, mismo motivo que .chat-dock arriba: colisionaba con
       .brain-overlay (también 12) — ambiente, nunca por encima de un modal. */
    position: fixed; left: 0; top: 0; bottom: 0; width: 300px; z-index: 9;
    background: rgba(5,10,12,0.97); border-right: 1px solid rgba(79,216,232,0.25);
    box-shadow: 0 0 24px rgba(0,0,0,0.5);
    transform: translateX(-100%); transition: transform 300ms ease;
    display: flex; flex-direction: column;
  }
  .dash-hud-sidebar-drawer.open { transform: translateX(0); }
  .dash-hud-sidebar-drawer-toolbar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: flex-end; gap: 0.3rem;
    padding: 0.6rem 0.6rem 0; padding-top: calc(env(safe-area-inset-top, 0px) + 0.6rem);
  }
  .dash-hud-sidebar-pin-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.85rem;
    opacity: 0.55; transition: opacity 150ms ease, color 150ms ease;
  }
  .dash-hud-sidebar-pin-btn:hover { opacity: 1; }
  .dash-hud-sidebar-pin-btn.pinned { opacity: 1; color: var(--hud-amber); }
  .dash-hud-sidebar-drawer-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  /* #sidebar reparentado adentro: deja de ser el overlay fijo de siempre
     (mismo criterio que .chat-focus-panel .sidebar.docked, contexto propio). */
  .dash-hud-sidebar-drawer-body .sidebar {
    position: static; width: 100%; height: 100%; transform: none; transition: none;
  }

  /* --- Chat con profundidad 3D real (Decisión 4, solo dentro del dock de
     Vista HUD — en Vista clásica y en modo enfoque el chat sigue siendo la
     lista plana de siempre, sin efecto). Los mensajes más viejos se alejan
     hacia arriba y hacia el fondo: más chicos, más oscuros, más
     transparentes — la sensación de "canvas 3D" pedida. `--depth` lo fija
     JS por mensaje (0 = el más nuevo, junto al input) en cada addMessage(). --- */
  #chatDock .chat { perspective: 900px; }
  #chatDock .chat-inner { transform-style: preserve-3d; }
  #chatDock .msg {
    --depth: 0;
    transform: translateZ(calc(var(--depth) * -34px)) translateY(calc(var(--depth) * -2px)) scale(calc(1 - var(--depth) * 0.045));
    opacity: calc(1 - var(--depth) * 0.11);
    filter: brightness(calc(1 - var(--depth) * 0.09));
    transition: transform 500ms ease, opacity 500ms ease, filter 500ms ease;
  }

  /* --- panel drag handle / reordering --- */
  .dash-widget-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.15rem; flex-shrink: 0; }
  .dash-widget-head h3 { margin: 0; }
  .dash-widget-sub {
    font-size: 0.66rem; color: var(--text-dim); margin-bottom: 0.6rem; opacity: 0.85;
    flex-shrink: 0;
  }
  .dash-row a, .dash-row-title a {
    color: inherit; text-decoration: none; border-bottom: 1px dotted rgba(79,216,232,0.4);
  }
  .dash-row a:hover, .dash-row-title a:hover { color: var(--glow-soft); border-bottom-color: var(--glow-soft); }
  .dash-widget-config {
    display: flex; align-items: center; gap: 0.4rem; font-size: 0.66rem; color: var(--text-dim);
    margin-bottom: 0.5rem;
  }
  .dash-widget-config select {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(79,216,232,0.3); border-radius: 6px;
    color: var(--text); font-family: inherit; font-size: 0.68rem; padding: 0.15rem 0.4rem;
  }
  .dash-gmail-list { margin-top: 0.7rem; padding-top: 0.6rem; border-top: 1px solid rgba(255,255,255,0.06); }
  .dash-gmail-digest-refs { margin-top: 0.5rem; padding-top: 0.4rem; border-top: 1px dashed rgba(255,255,255,0.08); }
  .dash-mini-btn {
    background: rgba(79,216,232,0.12); border: 1px solid rgba(79,216,232,0.35); color: var(--glow-soft);
    font-family: inherit; font-size: 0.66rem; letter-spacing: 0.02em; padding: 0.3rem 0.6rem;
    border-radius: 999px; cursor: pointer;
  }
  .dash-mini-btn:disabled { opacity: 0.5; cursor: default; }
  #gmailDigestContent {
    font-size: 0.76rem; line-height: 1.5; margin-top: 0.5rem;
    max-height: 260px; overflow-y: auto;
  }
  #gmailDigestContent p { margin: 0 0 0.4rem; }
  #gmailDigestContent ul, #gmailDigestContent ol { margin: 0 0 0.4rem; padding-left: 1.1rem; }
  #gmailDigestContent strong { color: var(--glow-soft); }
  .dash-drag-handle {
    color: var(--text-dim); cursor: grab; touch-action: none; opacity: 0.55;
    display: flex; align-items: center; justify-content: center;
    min-width: 32px; min-height: 32px; margin: -8px -6px -8px 0;
    user-select: none; -webkit-user-select: none;
  }
  .dash-drag-handle:hover { opacity: 1; color: var(--glow); }
  .dash-widget.dragging, .dash-widget.dragging * { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  .dash-widget.dragging { opacity: 0.4; border-color: var(--glow); }
  .dash-resize-handle {
    position: absolute; right: 4px; bottom: 4px; width: 18px; height: 18px; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); opacity: 0.45; cursor: nwse-resize; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  .dash-resize-handle:hover { opacity: 1; color: var(--glow); }
  .dash-widget.resizing { border-color: var(--glow); }
  .dash-widget-expand-handle {
    color: var(--text-dim); cursor: pointer; opacity: 0.55;
    display: flex; align-items: center; justify-content: center;
    min-width: 26px; min-height: 26px; margin: -6px -4px -6px 0.2rem;
  }
  .dash-widget-expand-handle:hover { opacity: 1; color: var(--glow); }

  /* --- panel de configuración --- */
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .settings-overlay.open { opacity: 1; pointer-events: auto; }
  .settings-panel {
    position: fixed; z-index: 11;
    left: 50%; top: 50%; transform: translate(-50%, -46%);
    width: min(360px, 88vw); max-height: 70vh; overflow-y: auto;
    background: rgba(5,10,12,0.97); border: 1px solid rgba(79,216,232,0.35);
    border-radius: 16px; padding: 1rem;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .settings-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.7rem; }
  .settings-head h3 { margin: 0; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--glow-soft); }
  .settings-close {
    background: none; border: 1px solid rgba(79,216,232,0.3); color: var(--text-dim);
    border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 0.75rem;
  }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.55rem 0.2rem; font-size: 0.78rem; color: var(--text);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-toggle {
    width: 34px; height: 19px; border-radius: 999px; border: 1px solid rgba(79,216,232,0.35);
    background: rgba(255,255,255,0.06); position: relative; cursor: pointer; flex-shrink: 0;
  }
  .settings-toggle::after {
    content: ""; position: absolute; top: 1px; left: 1px; width: 15px; height: 15px;
    border-radius: 50%; background: var(--text-dim); transition: transform 0.18s ease, background 0.18s ease;
  }
  .settings-toggle.on { background: rgba(79,216,232,0.25); border-color: var(--glow); }
  .settings-toggle.on::after { transform: translateX(15px); background: var(--glow); }

  .settings-section-head { margin: 1rem 0 0.6rem; padding-top: 0.8rem; border-top: 1px solid rgba(255,255,255,0.08); }
  .settings-section-head h3 { margin: 0; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--glow-soft); }
  .settings-slider-row { padding: 0.3rem 0.2rem 0.4rem; }
  .settings-slider-labels {
    display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-dim); margin-bottom: 0.5rem;
  }
  .settings-slider-labels #sarcasmValue { color: var(--glow); font-variant-numeric: tabular-nums; font-weight: 600; }
  .settings-slider-row input[type="range"] { width: 100%; accent-color: var(--glow); cursor: pointer; }

  .settings-profile-row { padding: 0.3rem 0.2rem 0.4rem; }
  .settings-profile-row input[type="text"] {
    width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(79,216,232,0.25); border-radius: 8px; color: var(--text);

  .llm-routing-list { display: flex; flex-direction: column; gap: 0.55rem; padding: 0.3rem 0.2rem 0.4rem; }
  .llm-routing-row { display: flex; flex-direction: column; gap: 0.25rem; }
