  .llm-routing-row select {
    width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.06);
    border: 1px solid rgba(79,216,232,0.25); border-radius: 8px; color: var(--text);
    font-size: 0.8rem; padding: 0.45rem 0.5rem; font-family: inherit; cursor: pointer;
  }
  .llm-routing-row select:focus { outline: none; border-color: var(--glow); }
  .llm-routing-row option:disabled { color: var(--text-dim); }

  /* --- barra lateral: Conversaciones / Proyectos ---
     .conv-list ya es flex:1 1 auto dentro de #sidebar — dos listas con el
     mismo flex competirían por el espacio, así que el switcher alterna cuál
     panel está montado en ese mismo lugar, nunca ambos a la vez. */
  .sidebar-tabs { display: flex; gap: 0.4rem; margin: 0 14px 10px; }
  .sidebar-tab {
    flex: 1 1 auto; background: none; border: 1px solid rgba(79,216,232,0.25);
    color: var(--text-dim); font-family: inherit; font-size: 0.68rem;
    padding: 0.4rem 0.3rem; border-radius: 8px; cursor: pointer;
  }
  .sidebar-tab.active { background: rgba(79,216,232,0.12); color: var(--text); border-color: var(--glow); }
  .sidebar-tab-panel { display: none; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .sidebar-tab-panel.active { display: flex; }

  /* --- "home" de un Proyecto, dentro del área de chat (Proyectos Mark II) ---
     Reemplaza al modal chico que existía antes — entrar a un proyecto desde
     la barra lateral muestra esto en #chatInner mientras no haya ninguna
     conversación cargada, en vez de abrir un panel flotante aparte. */
  .project-home { padding: 1.4rem 1.2rem 2rem; display: flex; flex-direction: column; gap: 1.1rem; max-width: 640px; margin: 0 auto; }
  .project-home-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.6rem; }
  .project-home-head h2 { margin: 0; font-size: 1.15rem; color: var(--glow-soft); }
  .project-home-actions { display: flex; align-items: center; gap: 0.8rem; font-size: 0.72rem; }
  .project-home-actions a { color: var(--glow); text-decoration: none; }
  /* Separado del resto de las acciones (antes al lado del link a Drive,
     demasiado a mano de un click sin querer) — al final de todo, mismo
     criterio que "cerrar sesión" en el menú de usuario: una acción de baja
     frecuencia y alto costo de error no debería competir por atención con
     las de uso diario. */
  .project-home-delete-btn {
    align-self: center; margin-top: 0.4rem;
    background: none; border: 1px solid rgba(232,90,90,0.35);
    color: #e88a8a; font-family: inherit; font-size: 0.7rem;
    padding: 0.45rem 0.9rem; border-radius: 999px; cursor: pointer;
  }
  .project-home-delete-btn:hover { background: rgba(232,90,90,0.12); color: #fff; }
  .project-home-stats { display: flex; gap: 0.8rem; }
  .project-stat {
    flex: 1 1 0; text-align: center; padding: 0.7rem 0.4rem; border-radius: 10px;
    background: rgba(79,216,232,0.06); border: 1px solid rgba(79,216,232,0.2);
  }
  .project-stat strong { display: block; font-size: 1.2rem; color: var(--text); }
  .project-stat span { font-size: 0.66rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }
  .project-home-summary { font-size: 0.82rem; line-height: 1.55; color: var(--text); margin: 0; white-space: pre-wrap; }
  .project-home-prompt-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0.4rem; }
  .project-home-prompt-footer span { font-size: 0.66rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }

  /* --- mover/quitar una conversación de un proyecto (spec Mark II) ---
     Mismo patrón visual que .user-menu/.user-menu-popover (botón + popover
     con .open en el wrapper) en vez del icono suelto 📁 de la primera
     versión — un solo menú contextual (⋮) por fila para todas las acciones. */
  .conv-item-row { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; }
  .conv-item-row .conv-item-main { flex: 1 1 auto; min-width: 0; cursor: pointer; }
  .conv-item-menu { position: relative; flex-shrink: 0; }
  .conv-item-menu-btn {
    width: 22px; height: 22px; border-radius: 6px; border: none; background: none;
    color: var(--text-dim); font-size: 0.85rem; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .conv-item-menu-btn:hover { color: var(--text); background: rgba(79,216,232,0.15); }
  .conv-item-menu-popover {
    position: absolute; right: 0; top: calc(100% + 4px); min-width: 165px;
    background: rgba(5,10,12,0.96); border: 1px solid rgba(79,216,232,0.3);
    border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
    opacity: 0; transform: translateY(-4px); pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease; z-index: 5;
  }
  .conv-item-menu.open .conv-item-menu-popover { opacity: 1; transform: none; pointer-events: auto; }
  .conv-item-menu-item {
    display: block; width: 100%; background: none; border: none; color: var(--text-dim);
    font-family: inherit; font-size: 0.72rem; padding: 0.5rem 0.6rem; border-radius: 8px;
    cursor: pointer; text-align: left;
  }
  .conv-item-menu-item:hover { background: rgba(79,216,232,0.1); color: var(--text); }
  .conv-item-menu-empty { padding: 0.5rem 0.6rem; font-size: 0.68rem; color: var(--text-dim); opacity: 0.6; }
  .project-field { display: flex; flex-direction: column; gap: 0.4rem; }
  .project-field-label { font-size: 0.66rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .project-field textarea {
    width: 100%; min-height: 4.5rem; max-height: 9rem; resize: vertical; overflow-y: auto;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(79,216,232,0.25);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.78rem; padding: 0.6rem;
  }
  .project-section { border-top: 1px solid rgba(255,255,255,0.06); padding-top: 0.6rem; }
  .project-section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.4rem; }
  .project-section-head h4 { margin: 0; font-size: 0.72rem; color: var(--glow-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  .project-item-row {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.2rem;
    font-size: 0.76rem; color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .project-item-row:last-child { border-bottom: none; }
  .project-item-row .task-text { flex: 1 1 auto; cursor: pointer; }
  .project-item-row .task-text.done { text-decoration: line-through; color: var(--text-dim); }
  .project-item-row .project-item-delete {
    background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 0.75rem; flex-shrink: 0;
  }
  .project-item-row .project-item-delete:hover { color: var(--error); }
  .project-empty { padding: 0.5rem 0.2rem; font-size: 0.72rem; color: var(--text-dim); opacity: 0.7; }

  /* --- cerebro de Snarf --- */
  .brain-mini { display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
  .brain-mini svg { width: 100%; max-width: 160px; height: auto; }
  .brain-mini-stat { font-size: 0.78rem; color: var(--text); text-align: center; }
  .brain-mini-stat-sub { font-size: 0.68rem; color: var(--text-dim); text-align: center; }
  /* Mini-animación del cerebro dentro del indicador de "pensando" — chica,
     clickeable, invita a mirar el cerebro completo mientras se espera.
     Va al lado de los tres puntitos (mismo renglón, ver .thinking-row):
     los puntitos siguen siendo la señal inmediata (aparecen sin esperar
     red), el cerebro se materializa al lado apenas llegan sus datos reales
     — la entrada en remolino (giro + escala desde chico) es lo que conecta
     visualmente ambas señales como una sola idea de "pensando". */
  .thinking-row { display: flex; align-items: center; gap: 0.55rem; }
  .thinking-brain-preview {
    width: 30px; height: 30px; cursor: pointer;
    border-radius: 50%; transition: transform 0.15s ease, filter 0.15s ease;
    filter: drop-shadow(0 0 6px rgba(79,216,232,0.35));
    animation: brain-swirl-in 0.7s cubic-bezier(0.32, 1.4, 0.5, 1) both;
  }
  .thinking-brain-preview:hover { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(79,216,232,0.55)); }
  .thinking-brain-preview svg { width: 100%; height: 100%; }
  @keyframes brain-swirl-in {
    0% { transform: scale(0.15) rotate(-200deg); opacity: 0; }
    70% { opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .thinking-brain-preview { animation: none; }
  }

  /* El color de cada nodo/edge viene de `color` (currentColor) — una clase
     por Capacidad/tier se lo asigna una sola vez al construir el grafo, acá
     abajo solo se define la paleta en sí. */
  .brain-color-aqua { color: var(--brain-aqua); }
  .brain-color-magenta { color: var(--brain-magenta); }
  .brain-color-violet { color: var(--brain-violet); }
  .brain-color-grey { color: var(--brain-grey); }
  .brain-color-white { color: var(--brain-white); }

  .brain-node {
    /* Sin color por defecto a propósito: cada nodo siempre lleva una clase
       brain-color-* real (ver brainColorClassFor en el JS) — si esta regla
       fijara un color acá, pisaría a esas clases por venir después en la
       hoja de estilos (misma especificidad, gana la última declarada). */
    /* stroke-width bajo + stroke-opacity reducida + resplandor permanente:
       menos "círculo de diagrama de red" de borde duro, más orbe de luz que
       se funde con la malla — el aspecto "rústico" reportado por el
       fundador venía de acá, no solo de las líneas rectas. */
    fill: currentColor; fill-opacity: 0.22; stroke: currentColor; stroke-width: 1; stroke-opacity: 0.6;
    filter: drop-shadow(0 0 6px currentColor);
    transform-origin: center; transform-box: fill-box;
  }
  .brain-node-center { fill-opacity: 0.25; stroke-width: 2.2; filter: drop-shadow(0 0 14px var(--brain-violet)); }
  .brain-node-specialist { stroke-dasharray: 2 2; }
  /* Nunca tuvo actividad real registrada — ni activo ni en espera, un nodo
     "fantasma": potencial todavía sin usar, no un estado inventado. */
  .brain-node-ghost { color: var(--brain-grey) !important; fill-opacity: 0.05; stroke-dasharray: 1 4; opacity: 0.4; animation: none !important; }
  .brain-ring { fill: none; stroke: rgba(150,170,190,0.16); stroke-width: 1; stroke-dasharray: 1 5; }

  /* Latido lento y tenue: el estado por defecto de cualquier nodo con
     historia real pero sin actividad reciente — "en espera", nunca del
     todo apagado. */
  @keyframes brain-breathe { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.04); } }
  .brain-node-idle { animation: brain-breathe 3.6s ease-in-out infinite; }
  .brain-mini-center.brain-node-idle { animation-duration: 2.4s; }

  /* Activo (actividad real reciente, ver BRAIN_ACTIVE_WINDOW_S en el JS):
     antes era un "lub-dub" de dos golpes con salto de escala grande
     (1.2/1.16) — el fundador lo describió como un "tac-tac" feo, sobre todo
     con varios nodos latiendo a la vez sin sincronía. La diferenciación
     ahora es sobre todo luminosidad/brillo (el glow crece bastante más que
     en reposo), con un solo pulso suave y un movimiento mínimo. */
  @keyframes brain-heartbeat {
    0%, 100% { opacity: 0.85; transform: scale(1); filter: drop-shadow(0 0 4px currentColor); }
    50% { opacity: 1; transform: scale(1.05); filter: drop-shadow(0 0 18px currentColor); }
  }
  .brain-node-active { animation: brain-heartbeat 1.6s ease-in-out infinite; }
  /* El ícono (línea fina, con detalle real) se nota mucho más que el círculo
     de fondo (una mancha de luz difusa) al rebotar en escala — acá la
     diferenciación es pura luz: nada de transform. */
  .brain-node-icon.brain-node-active {
    animation: brain-icon-glow 1.6s ease-in-out infinite;
  }
  @keyframes brain-icon-glow {
    0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 3px currentColor); }
    50% { opacity: 1; filter: drop-shadow(0 0 11px currentColor); }
  }

  /* --- modo enfoque: chat a pantalla completa + barra lateral --- */
  .chat-focus-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 14;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .chat-focus-overlay.open { opacity: 1; pointer-events: auto; }
  .chat-focus-panel {
    position: fixed; z-index: 15;
    left: 50%; top: 50%; transform: translate(-50%, -46%);
    width: min(1100px, 96vw); height: min(860px, 94vh);
    background: rgba(5,10,12,0.98); border: 1px solid rgba(79,216,232,0.35);
    border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: row;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .chat-focus-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .chat-focus-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .chat-focus-close {
    position: absolute; top: 10px; right: 10px; z-index: 2;
    background: none; border: 1px solid rgba(79,216,232,0.3); color: var(--text-dim);
    border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 0.75rem;
  }

  .brain-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 12;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .brain-overlay.open { opacity: 1; pointer-events: auto; }
  .brain-panel {
    position: fixed; z-index: 13;
    left: 50%; top: 50%; transform: translate(-50%, -46%);
    width: min(1100px, 96vw); height: min(760px, 92vh);
    background: rgba(5,10,12,0.98); border: 1px solid rgba(79,216,232,0.35);
    border-radius: 16px; padding: 1rem;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .brain-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .brain-layout { display: flex; flex-direction: row; gap: 1rem; flex: 1 1 auto; min-height: 0; }
  @media (max-width: 899px) { .brain-layout { flex-direction: column; } }
  .brain-graph {
    flex: 1.6 1 0; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    /* Viñeta radial: el grafo se lee como un objeto flotando en un volumen
       oscuro, no como un diagrama plano sobre el fondo del panel. */
    background: radial-gradient(ellipse at center, rgba(22,0,62,0.5) 0%, rgba(0,0,0,0.7) 78%);
  }
  /* Wrapper único que recibe el zoom/pan de cámara — SVG y canvas de
     partículas se mueven siempre juntos, nunca por separado, para que el
     enfoque hacia un nodo activo se sienta como una sola escena y no dos
     capas independientes. */
  .brain-graph-inner { position: absolute; inset: 0; will-change: transform; }
  .brain-graph-inner svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #brainParticles { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .brain-feed { flex: 1 1 0; min-width: 0; overflow-y: auto; overscroll-behavior: contain; border-top: 1px solid rgba(255,255,255,0.06); }
  @media (min-width: 900px) { .brain-feed { border-top: none; border-left: 1px solid rgba(255,255,255,0.06); padding-left: 0.8rem; } }
  .brain-feed-row {
    display: flex; align-items: baseline; gap: 0.5rem; padding: 0.3rem 0.2rem; font-size: 0.75rem;
    color: var(--text); border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .brain-feed-row .dash-dot { align-self: center; }
  .brain-feed-icon { align-self: center; flex-shrink: 0; opacity: 0.9; }
  .brain-feed-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brain-feed-time { flex-shrink: 0; font-size: 0.68rem; color: var(--text-dim); }

  /* Opacidad baja a propósito: la línea recta centro-nodo tiene que existir
     (el pulso puntual viaja por ella, animateMotion/mpath) pero en reposo no
     debe leerse como un diagrama de red — la malla orgánica de arriba es la
     que tiene que dominar visualmente. */
  .brain-edge { stroke: var(--glow-dim); stroke-opacity: 0.13; stroke-width: 0.7; fill: none; }
  /* El haz de luz en movimiento entre nodos ya NO lo lleva esta línea — el
     fundador señaló que el pulso de guiones ("tac, tac, tac") se veía
     mecánico. El movimiento real ahora es un flujo de partículas con deriva
     orgánica (spawnFlowParticle, en el canvas) que viaja del orquestador a
     cada nodo activo; esta línea queda estática, solo más brillante que en
     reposo, como guía visual de "acá hay una conexión encendida". Declarado
     DESPUÉS de .brain-edge a propósito: ambas clases conviven en el mismo
     <path> con igual especificidad, y el orden en la hoja decide cuál
     stroke-width gana. currentColor: cada edge ya tiene su clase de color
     asignada al nodo que conecta (brainColorClassFor). */
  .brain-edge-flow {
    fill: none; stroke: currentColor; stroke-width: 1.4; stroke-opacity: 0.55;
    filter: drop-shadow(0 0 5px currentColor);
  }
  .brain-edge-flow.brain-edge-flow-error { color: var(--brain-red) !important; }
  /* Ícono propio de cada nodo (reemplaza el emoji/texto de antes) — dibujado
     a mano en el mismo lenguaje monolínea del resto de la interfaz, no un
     emoji. overflow:visible porque el glow del filter puede salirse del
     viewBox chico del <svg> anidado. El nombre completo sigue disponible
     como tooltip nativo (<title> SVG) al pasar el mouse. */
  .brain-node-icon { overflow: visible; opacity: 0.85; }
  .brain-node-icon.brain-node-active { filter: drop-shadow(0 0 5px currentColor); }
  .brain-node-icon.brain-node-ghost { opacity: 0.35; }
  /* Pulso puntual por evento real — currentColor toma el color propio del
     nodo de origen (ver brainColorClassFor), salvo que sea un error o un
     archivo con categoría real conocida, que pisan ese color a propósito. */
  /* Sin color por defecto, mismo motivo que .brain-node: spawnPulse siempre
     agrega una clase brain-color-*/brain-pulse-file-*/brain-pulse-error. */
  .brain-pulse { fill: currentColor; filter: drop-shadow(0 0 4px currentColor); }
  .brain-pulse-error { fill: var(--brain-red); filter: drop-shadow(0 0 4px var(--brain-red)); }
  .brain-pulse-file-image { fill: var(--brain-yellow); filter: drop-shadow(0 0 4px var(--brain-yellow)); }
  .brain-pulse-file-audio { fill: var(--brain-magenta); filter: drop-shadow(0 0 4px var(--brain-magenta)); }
  .brain-pulse-file-video { fill: var(--brain-green); filter: drop-shadow(0 0 4px var(--brain-green)); }
  .brain-pulse-file-doc { fill: var(--brain-aqua); filter: drop-shadow(0 0 4px var(--brain-aqua)); }

  .dash-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 58px;
    z-index: 6;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.3);
    background: rgba(5,10,12,0.6);
    color: var(--glow);
    font-size: 0.95rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  /* Mismo slot que .mode-fab (right:16px) — nunca coinciden: el fab de modo
     se oculta en escritorio (body.jarvis-mode .mode-fab) y este botón solo
     se muestra cuando hay una conversación de proyecto cargada, nunca
     mientras se mira el propio home. */
  .project-home-btn {
    display: none;
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 16px;
    z-index: 6;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.3);
    background: rgba(5,10,12,0.6);
    color: var(--glow);
    font-size: 1rem;
    align-items: center; justify-content: center;
    cursor: pointer;
  }
  .project-home-btn.visible { display: flex; }

  /* --- dashboard --- */
  .dash-mobile-stack {
    position: relative; z-index: 2;
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 3.6rem) 1rem calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
    width: 100%; max-width: 1100px; margin: 0 auto;
  }
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 0.9rem;
  }
  .dash-widget {
    position: relative;
    border: 1px solid rgba(79,216,232,0.36);
    background:
      radial-gradient(ellipse at center, rgba(79,216,232,0.07) 0%, rgba(10,18,20,0.16) 60%, rgba(4,10,12,0.24) 100%);
    box-shadow: inset 0 0 26px rgba(79,216,232,0.06), inset 0 0 0 1px rgba(79,216,232,0.08);
    backdrop-filter: blur(4px) saturate(1.2);
    -webkit-backdrop-filter: blur(4px) saturate(1.2);
    border-radius: 14px;
    padding: 1rem 1.1rem;
  }
  .dash-widget h3 {
    margin: 0 0 0.7rem; font-size: 0.82rem; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--glow-soft); font-weight: 400;
  }
  .dash-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text); padding: 0.25rem 0; }
  .dash-row.dash-dim { color: var(--text-dim); font-size: 0.72rem; }
  .dash-row, .dash-row-stacked { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-row-stacked {
    display: flex; flex-direction: column; gap: 0.1rem; padding: 0.3rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.78rem; color: var(--text);
  }
  .dash-row-stacked:last-child { border-bottom: none; }
  .dash-row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-row-sub { font-size: 0.68rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--text-dim); }
  .dash-dot.ok { background: var(--glow); box-shadow: 0 0 6px 2px rgba(79,216,232,0.6); }
  .dash-dot.off { background: var(--error); box-shadow: 0 0 6px 2px rgba(232,90,90,0.4); }
  .dash-stat { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 0.35rem; }
  .dash-stat-num { font-size: 1.3rem; color: var(--text); font-weight: 600; margin-right: 0.35rem; }
  .dash-chart { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin-top: 0.6rem; }
  .dash-bar { flex: 1 1 auto; height: 100%; display: flex; align-items: flex-end; }
  .dash-bar-fill {
    width: 100%; background: var(--glow); opacity: 0.85; border-radius: 4px 4px 0 0; min-height: 2px;
  }
  .dash-chart-label { font-size: 0.65rem; color: var(--text-dim); margin-top: 0.4rem; text-align: right; }
  .dash-loading { color: var(--text-dim); font-size: 0.8rem; padding: 2rem 0; text-align: center; }

  /* --- chat --- */
  .chat {
    position: relative; z-index: 2;
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    /* Sin esto, llegar al final scrolleando rápido "se escapa" hacia la
       página/dashboard entero en vez de frenar acá — bug real reportado. */
    overscroll-behavior: contain;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 3.2rem) 1rem 1rem;
    width: 100%; max-width: 560px; margin: 0 auto;
  }
  .chat-inner {
    margin-top: auto;
    display: flex; flex-direction: column; gap: 0.55rem;
    min-width: 0;
  }
  /* Indica en qué proyecto está la conversación abierta — antes no había
     ningún rastro de esto una vez adentro de una conversación real (solo se
     veía en el home). Sticky sobre .chat (su propio scrollport) para que no
     se pierda arriba al leer mensajes viejos. */
  .project-context-bar {
    display: none;
    position: sticky; top: 0; z-index: 3;
    align-self: center;
    margin-bottom: 0.6rem;
    padding: 0.3rem 0.8rem;
    border-radius: 999px;
    background: rgba(5,10,12,0.75);
    border: 1px solid rgba(79,216,232,0.3);
    backdrop-filter: blur(6px);
    color: var(--text-dim);
    font-size: 0.68rem;
    letter-spacing: 0.02em;
  }
  .project-context-bar.visible { display: block; }
  .msg {
    max-width: 82%; padding: 0.6rem 0.9rem; border-radius: 14px;
    font-size: 0.85rem; line-height: 1.5; animation: fadein 0.3s ease;
    overflow-wrap: anywhere; word-break: break-word;
  }
  .msg.snarf a { color: var(--glow-soft); text-decoration: underline; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end;
    background: radial-gradient(ellipse at center, rgba(79,216,232,0.14) 0%, rgba(10,18,20,0.14) 55%, rgba(4,10,12,0.2) 100%);
    box-shadow: inset 0 0 18px rgba(79,216,232,0.08), inset 0 0 0 1px rgba(79,216,232,0.1);
    backdrop-filter: blur(4px) saturate(1.2);
    -webkit-backdrop-filter: blur(4px) saturate(1.2);
    border: 1px solid rgba(79,216,232,0.4); border-bottom-right-radius: 4px;
  }
  /* Nota de voz estilo WhatsApp: el audio real es el mensaje, la
     transcripción queda disponible pero oculta por default. */
  .voice-note-toggle {
    display: block; margin-top: 0.35rem;
    background: none; border: none; color: var(--text-dim);
    font-family: inherit; font-size: 0.68rem; cursor: pointer; padding: 0.2rem 0.3rem;
  }
  .voice-note-toggle:hover { color: var(--text); }
  .voice-note-transcript {
    margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid rgba(79,216,232,0.15);
    color: var(--text-dim); font-size: 0.8rem;
  }
  .msg.snarf {
    align-self: flex-start;
    background: radial-gradient(ellipse at center, rgba(200,235,240,0.06) 0%, rgba(10,14,15,0.12) 55%, rgba(4,7,8,0.18) 100%);
    box-shadow: inset 0 0 18px rgba(79,216,232,0.04), inset 0 0 0 1px rgba(255,255,255,0.06);
    backdrop-filter: blur(4px) saturate(1.15);
    -webkit-backdrop-filter: blur(4px) saturate(1.15);
    border: 1px solid rgba(255,255,255,0.16); border-bottom-left-radius: 4px;
  }
  .msg.snarf h1, .msg.snarf h2, .msg.snarf h3 {
    margin: 0.2rem 0 0.4rem; line-height: 1.3; color: var(--glow-soft);
  }
  .msg.snarf h1 { font-size: 1.05rem; }
  .msg.snarf h2 { font-size: 0.98rem; }
  .msg.snarf h3 { font-size: 0.9rem; }
  .msg.snarf p { margin: 0 0 0.5rem; }
  .msg.snarf p:last-child { margin-bottom: 0; }
  .msg.snarf ul, .msg.snarf ol { margin: 0 0 0.5rem; padding-left: 1.2rem; }
  .msg.snarf li { margin-bottom: 0.15rem; }
  .msg.snarf blockquote {
    margin: 0 0 0.5rem; padding: 0.3rem 0.7rem;
    border-left: 2px solid var(--glow); color: var(--text-dim); font-style: italic;
  }
  .msg.snarf code {
    background: rgba(79,216,232,0.12); padding: 0.1rem 0.35rem; border-radius: 4px;
    font-size: 0.82em;
  }
  .msg.snarf pre {
    position: relative;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(79,216,232,0.2);
    border-radius: 8px; padding: 0.6rem 0.7rem; overflow-x: auto; margin: 0 0 0.5rem;
  }
  .msg.snarf pre code { background: none; padding: 0; }
  /* Copiar un bloque de código/entregable puntual, sin arrastrar el resto
     del mensaje (el comentario de Snarf alrededor del texto) — distinto del
     botón "copiar respuesta" de más abajo, que copia todo. */
  .copy-code-btn {
    position: absolute; top: 6px; right: 6px;
    background: rgba(5,10,12,0.7); border: 1px solid rgba(79,216,232,0.3);
    color: var(--glow-soft); font-family: inherit; font-size: 0.62rem;
    padding: 0.2rem 0.5rem; border-radius: 999px; cursor: pointer;
  }
  .copy-code-btn:hover { background: rgba(79,216,232,0.15); }
  .msg-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
  .msg-actions .play-audio-btn, .msg-actions .copy-msg-btn { margin-top: 0; }
  .copy-msg-btn {
    display: flex; width: fit-content; align-items: center; gap: 0.3rem;
    background: rgba(79,216,232,0.1);
    border: 1px solid rgba(79,216,232,0.3);
    color: var(--glow-soft);
    font-family: inherit;
    font-size: 0.65rem;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.6rem;
    border-radius: 999px;
    cursor: pointer;
  }
  .msg.snarf strong { color: var(--text); }
  .msg.snarf table {
    width: 100%; border-collapse: collapse; margin: 0 0 0.5rem; font-size: 0.8rem;
    display: block; overflow-x: auto; white-space: nowrap;
  }
  .msg.snarf th, .msg.snarf td {
    border: 1px solid rgba(79,216,232,0.2); padding: 0.35rem 0.55rem; text-align: left;
  }
  .msg.snarf th { color: var(--glow-soft); background: rgba(79,216,232,0.08); }
  .play-audio-btn {
    display: flex; width: fit-content; align-items: center; gap: 0.3rem;
    margin-top: 0.5rem;
    background: rgba(79,216,232,0.1);
    border: 1px solid rgba(79,216,232,0.3);
    color: var(--glow-soft);
    font-family: inherit;
    font-size: 0.65rem;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.6rem;
    border-radius: 999px;
    cursor: pointer;
  }
  /* Botón "escuchar entregable" — más discreto que "escuchar": es la opción
     secundaria, solo visible cuando la respuesta trae un entregable real. */
  .play-audio-btn-full {
    background: transparent;
    border-color: rgba(79,216,232,0.15);
    opacity: 0.75;
  }
  .play-audio-btn-full:hover { opacity: 1; }
  /* Placeholder mientras se genera automáticamente el audio de "escuchar"
     (turnos que llegaron por voz) — nunca hay botón que tocar acá, el
     player lo reemplaza solo cuando está listo. */
  .voice-note-slot {
    display: inline-flex; align-items: center;
    font-size: 0.65rem; letter-spacing: 0.04em; color: var(--glow-soft);
    opacity: 0.6; margin-top: 0.5rem;
  }
  .voice-note-slot:empty { display: none; }
  /* Contenedor de los reproductores de audio de una respuesta — siempre
     arriba del texto (la comunicación primaria cuando hay audio es el
     audio), vacío y sin ocupar espacio cuando todavía no se generó ninguno. */
  .voice-note-players:not(:empty) { margin-bottom: 0.6rem; display: flex; flex-direction: column; gap: 0.4rem; }
  .msg-text :first-child { margin-top: 0; }

  /* --- reproductor de nota de voz embebido (por burbuja, estilo WhatsApp) ---
     Reemplaza al reproductor flotante único de antes: cada nota de voz
     (propia o generada de una respuesta de Snarf) tiene su propio play,
     progreso, velocidad y menú — replayable las veces que haga falta, sin
     "cerrar" nada. Un solo <audio> real de fondo (sharedAudio) alimenta a
     la burbuja activa en cada momento, mismo criterio que cualquier
     reproductor de medios: solo suena una cosa a la vez. */
  .voice-note-player {
    display: flex; align-items: center; gap: 0.5rem;
    margin-top: 0.5rem;
    background: rgba(79,216,232,0.08);
    border: 1px solid rgba(79,216,232,0.3);
    border-radius: 999px;
    padding: 0.35rem 0.4rem 0.35rem 0.35rem;
    font-size: 0.7rem;
    color: var(--text);
  }
  .vn-play-btn {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(79,216,232,0.16); border: 1px solid var(--glow);
    color: var(--text); font-size: 0.8rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .vn-progress {
    flex: 1 1 auto; min-width: 40px; height: 4px; border-radius: 999px;
    background: rgba(79,216,232,0.18); cursor: pointer; position: relative;
  }
  .vn-progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: var(--glow); border-radius: 999px;
  }
  .vn-time {
    flex-shrink: 0; font-variant-numeric: tabular-nums; font-size: 0.64rem; color: var(--text-dim);
    white-space: nowrap;
  }
  .vn-speed-btn {
    flex-shrink: 0; background: rgba(79,216,232,0.12); border: 1px solid rgba(79,216,232,0.3);
    color: var(--text); font-family: inherit; font-size: 0.64rem;
    padding: 0.2rem 0.4rem; border-radius: 999px; cursor: pointer;
  }
  .vn-menu .conv-item-menu-btn { color: var(--text-dim); }

  .typing { display: flex; gap: 4px; align-items: center; padding: 0.3rem 0; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--glow);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* --- bottom control cluster --- */
  .control-bar {
    position: relative; z-index: 2;
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0.7rem;
    width: 100%; padding: 0.6rem 1rem calc(env(safe-area-inset-bottom, 0px) + 1.4rem);
  }
  .mode-fab {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 16px;
    z-index: 6;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.3);
    background: rgba(5,10,12,0.6);
    color: var(--glow);
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }
  .mode-fab.locked { opacity: 0.35; pointer-events: none; }
  .mode-popover {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 54px);
    right: 16px;
    z-index: 6;
    background: rgba(5,10,12,0.94);
    border: 1px solid rgba(79,216,232,0.3);
    border-radius: 14px;
    padding: 6px;
    display: flex; flex-direction: column; gap: 2px;
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .mode-popover.open { opacity: 1; transform: none; pointer-events: auto; }
  .mode-option {
    display: flex; align-items: center; gap: 0.55rem;
    background: none; border: none; color: var(--text-dim);
    font-family: inherit; font-size: 0.72rem;
    padding: 0.5rem 0.75rem; border-radius: 9px; cursor: pointer;
    white-space: nowrap; text-align: left;
  }
  .mode-option.active { background: rgba(79,216,232,0.18); color: var(--text); }
  .status {
    text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.7rem;
    color: var(--text-dim); min-height: 1.2em; text-align: center; padding: 0 1rem;
  }
  /* Aparece solo tras un error real de red/servicio en el envío de una nota
     de voz (transcripción o /send) donde ya tenemos lo necesario (el audio
     grabado, o la transcripción si ya se había obtenido) para reintentar sin
     forzar a grabar todo de nuevo. */
  .retry-btn {
    display: flex; align-items: center; gap: 0.3rem; width: fit-content;
    background: rgba(232,90,90,0.1); border: 1px solid rgba(232,90,90,0.35);
    color: #e88a8a; font-family: inherit; font-size: 0.68rem; letter-spacing: 0.03em;
    padding: 0.3rem 0.7rem; border-radius: 999px; cursor: pointer;
  }
  /* Bug real: `display: flex` de arriba le gana al `[hidden]` del navegador
     (misma causa que .text-row .icon-btn, ver ADR 0059) — sin esto, el botón
     quedaba visible siempre, en cualquier chat, sin importar `.hidden`. */
  .retry-btn[hidden] { display: none; }
  .retry-btn:hover { background: rgba(232,90,90,0.18); }
  .review { width: 100%; max-width: 480px; display: none; flex-direction: column; gap: 0.5rem; }
  .review.visible { display: flex; }
  .review textarea {
    width: 100%; min-height: 4.5rem; max-height: 10rem; resize: none; overflow-y: auto; line-height: 1.4;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(79,216,232,0.25);
    border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.85rem; padding: 0.7rem;
  }
  .review .actions { display: flex; gap: 0.6rem; justify-content: flex-end; }
  .review button {
    font-family: inherit; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.45rem 1rem; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(79,216,232,0.3); background: transparent; color: var(--text-dim);
  }
  .review button.primary { background: rgba(79,216,232,0.2); color: var(--text); border-color: var(--glow); }

  .orb-wrap {
    position: relative; width: 180px; height: 180px; cursor: pointer;
    user-select: none; -webkit-user-select: none; touch-action: none; flex-shrink: 0;
    transform: scale(0.74); transform-origin: center;
  }
  .rays, .rays2 {
    position: absolute; inset: -42px; border-radius: 50%;
    -webkit-mask-image: radial-gradient(circle, transparent 50%, black 55%, black 62%, transparent 68%);
    mask-image: radial-gradient(circle, transparent 50%, black 55%, black 62%, transparent 68%);
    opacity: 0.7; transition: opacity 0.4s ease;
  }
  .rays { background: repeating-conic-gradient(from 0deg, rgba(79,216,232,0.24) 0deg 1.2deg, transparent 1.2deg 8deg); animation: spin 16s linear infinite; }
  .rays2 { background: repeating-conic-gradient(from 15deg, rgba(182,245,251,0.14) 0deg 0.8deg, transparent 0.8deg 14deg); animation: spin 22s linear infinite reverse; }
  .ring-outer, .ring-inner { position: absolute; border-radius: 50%; }
  .ring-outer { inset: 0; border: 1px dashed rgba(79,216,232,0.35); animation: spin 26s linear infinite reverse; }
  .ring-inner { inset: 26px; border: 1px solid rgba(79,216,232,0.22); animation: spin 18s linear infinite; }
  .ring-inner::before, .ring-inner::after {
    content: ""; position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: var(--glow); box-shadow: 0 0 6px 2px rgba(79,216,232,0.8);
    top: -2.5px; left: calc(50% - 2.5px);
  }
  .ring-inner::after { top: auto; bottom: -2.5px; }
  .orb-sphere {
    position: absolute; inset: 50px; border-radius: 50%; perspective: 260px;
  }
  .orb {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, transparent 0%, transparent 46%, rgba(79,216,232,0.22) 58%, rgba(182,245,251,0.65) 70%, rgba(79,216,232,0.18) 82%, transparent 94%);
    box-shadow: 0 0 26px 4px rgba(79,216,232,0.35), inset 0 0 26px 3px rgba(79,216,232,0.18);
    animation: breathe 3.4s ease-in-out infinite, flicker 5s steps(30) infinite;
    transition: box-shadow 0.4s ease;
  }
  .wire {
    position: absolute; inset: 0; border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.32);
  }
  .wire.w1 { transform: rotateX(72deg); }
  .wire.w2 { transform: rotateX(40deg); }
  .wire.w3 { transform: rotateX(-40deg); }
  .wire.w4 { transform: rotateX(-72deg); }
  .wire.w5 { transform: rotateY(65deg); border-color: rgba(79,216,232,0.2); }
  .wire.w6 { transform: rotateY(115deg); border-color: rgba(79,216,232,0.2); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.045); opacity: 1; } }
  @keyframes flicker {
    0%, 100% { opacity: 1; } 46% { opacity: 1; } 47% { opacity: 0.82; } 48% { opacity: 1; }
    71% { opacity: 1; } 72% { opacity: 0.88; } 73% { opacity: 1; }
  }
  .orb-wrap.listening .orb {
    animation: pulse-fast 1s ease-in-out infinite, flicker 2.5s steps(30) infinite;
    box-shadow: 0 0 32px 8px rgba(79,216,232,0.55), inset 0 0 32px 6px rgba(79,216,232,0.3);
  }
  .orb-wrap.listening .rays, .orb-wrap.listening .rays2 { animation-duration: 5s; opacity: 1; }
  .orb-wrap.listening .ring-outer, .orb-wrap.listening .ring-inner { animation-duration: 6s; }
  @keyframes pulse-fast { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
  .orb-wrap.thinking .orb { animation: pulse-fast 0.6s ease-in-out infinite; }
  .orb-wrap.thinking .rays, .orb-wrap.thinking .rays2 { animation-duration: 2.5s; }
  .orb-wrap.error .orb {
    background: radial-gradient(circle at 50% 50%, transparent 0%, transparent 46%, rgba(232,90,90,0.3) 58%, rgba(255,218,218,0.65) 70%, transparent 94%);
    box-shadow: 0 0 30px 6px rgba(232,90,90,0.4);
  }
  .orb-wrap.error .wire { border-color: rgba(232,90,90,0.35); }

  /* --- text mode --- */
  .text-row {
    position: relative;
    display: none;
    width: 100%; max-width: 480px;
    gap: 0.5rem;
    align-items: flex-end;
  }
  .text-row.visible { display: flex; }
  .text-row textarea {
    flex: 1 1 auto;
    min-width: 0;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(79,216,232,0.3);
    border-radius: 20px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.7rem 1rem;
    outline: none;
    resize: none;
    max-height: 9rem;
    overflow-y: auto;
    line-height: 1.4;
  }
  .text-row textarea::placeholder { color: var(--text-dim); }
  .text-row .icon-btn {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(79,216,232,0.14);
    border: 1px solid var(--glow);
    color: var(--text);
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  /* micBtn y textSendBtn se comportan como un único multibotón: nunca están
     los dos visibles a la vez salvo el instante de bloqueo (mic desaparece,
     quedan tacho+flecha). El [hidden] de acá pisa el display:flex de
     .text-row .icon-btn de arriba porque es más específico (mismo origen
     "autor", gana la especificidad, no alcanza con el atributo solo). */
  .text-row .icon-btn[hidden] { display: none; }
  .text-row #micBtn.recording {
    background: rgba(232,90,90,0.16); border-color: var(--error); color: var(--error);
    animation: pulse-fast 1s ease-in-out infinite;
  }
  /* Grabación a un tap: tocar el mic entra directo a grabar, manos libres
     desde el primer instante (sin estado de "mantener presionado" ni de
     "bloqueo" intermedio) — un tap simple, tacho para cancelar, flecha para
     terminar y enviar. Reemplaza el gesto anterior de mantener presionado +
     deslizar para bloquear: en iPhone, mantener el dedo sobre el botón
     disparaba la lupa de aumento nativa de iOS (pensada para cajas de
     texto), rompiendo el gesto por completo (bug real reportado). El botón
     mic no cambia de posición: solo se reemplaza el contenido de
     attach+textInput por este overlay mientras se graba. */
  .record-overlay {
    display: none;
    flex: 1 1 auto; min-width: 0;
    align-items: center; gap: 0.5rem;
    padding: 0 0.9rem;
    height: 42px;
  }
  .text-row.recording #attachBtn, .text-row.recording #textInput { display: none; }
  .text-row.recording .record-overlay { display: flex; }
  .record-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--error); flex-shrink: 0;
    animation: pulse-fast 1s ease-in-out infinite;
  }
  .record-timer { font-variant-numeric: tabular-nums; font-size: 0.82rem; color: var(--text); flex-shrink: 0; }
  .record-hint { font-size: 0.72rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: opacity 0.15s ease; }
  .record-hint.fading { opacity: 0.25; }
  .record-cancel-btn {
    flex-shrink: 0; margin-left: auto; background: none; border: none; font-size: 0.95rem; cursor: pointer;
    color: var(--text-dim); padding: 0.2rem 0.3rem;
  }
  /* Waveform en vivo: mini barras que se ensanchan hacia arriba/abajo con la
     amplitud real del audio (AnalyserNode sobre el stream del mic) y vuelven
     a puntitos quietos en silencio — muestra que está capturando la voz,
     sin necesitar el estado de "bloqueado" que existía antes. */
  .record-wave {
    display: flex; align-items: center; gap: 3px; height: 18px; flex-shrink: 0;
  }
  .record-wave i {
    display: block; width: 2.5px; height: 4px; border-radius: 1.5px;
    background: var(--text-dim);
    transition: height 0.08s ease, background 0.08s ease;
  }
  .text-row.recording .record-wave i { background: var(--error); }
</style>
</head>

const SCROLLBAR_HIDE_DELAY_MS = 800;

/* ---------- markdown ---------- */
function renderMarkdown(text) {
  let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
  html = html.replace(/^(\|.+\|)\n(\|[\s:|-]+\|)\n((?:\|.+\|\n?)*)/gm, (_, headerLine, sepLine, bodyLines) => {
    const parseRow = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
    const headers = parseRow(headerLine);
    const rows = bodyLines.trim().split("\n").filter(Boolean).map(parseRow);
    const thead = "<thead><tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr></thead>";
    const tbody = "<tbody>" + rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody>";
    return `<table>${thead}${tbody}</table>\n`;
  });
  html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  html = html.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/^(?:-\s.*(?:\n|$))+/gm, (block) => {
    const items = block.trim().split("\n").map(l => `<li>${l.replace(/^-\s/, "")}</li>`).join("");
    return `<ul>${items}</ul>`;
  });
  html = html.replace(/^(?:\d+\.\s.*(?:\n|$))+/gm, (block) => {
    const items = block.trim().split("\n").map(l => `<li>${l.replace(/^\d+\.\s/, "")}</li>`).join("");
    return `<ol>${items}</ol>`;
  });
  html = html.split(/\n\n+/).map(p => {
    const t = p.trim();
    if (/^<h\d|^<ul|^<ol|^<pre|^<blockquote|^<table/.test(t)) return t;
    if (!t) return "";
    return `<p>${t.replace(/\n/g, "<br>")}</p>`;
  }).join("");
  return html;
}

// Sintetiza voz para `text` y devuelve el audio_id, o null si no se pudo
// (sin tocar ningún elemento del DOM — lo usan tanto el disparo automático
// como el botón manual, cada uno decide qué hacer con el resultado).
async function synthesizeVoiceNote(text) {
  try {
    const res = await apiFetch("/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    return data.audio_id || null;
  } catch (e) {
    return null;
  }
}
// Genera (o recupera de caché, instantáneo) la nota de voz de `text` y
// reemplaza `btn` por el reproductor embebido real — antes esto reproducía
// directo en un reproductor flotante de un solo uso, sin forma real de
// volver a escucharlo después de pausarlo/cerrarlo. El reproductor se
// inserta en `playersContainer` (arriba del texto de la burbuja, no donde
// estaba el botón) y arranca solo: tocar el botón ya es la confirmación de
// que se quiere escuchar — si no, se le pone pausa.
async function generateVoiceNoteAndPlay(text, btn, downloadName, playersContainer) {
  btn.disabled = true;
  btn.textContent = "generando...";
  const audioId = await synthesizeVoiceNote(text);
  if (audioId) {
    const player = buildVoiceNotePlayer(audioId, downloadName);
    playersContainer.appendChild(player);
    btn.remove();
    player.querySelector(".vn-play-btn").click();
  } else {
    btn.textContent = "no disponible";
    btn.disabled = false;
  }
}
async function copyTextToClipboard(text, btn) {
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "✓ copiado";
  } catch (e) {
    btn.textContent = "no se pudo copiar";
  }
  setTimeout(() => { btn.textContent = original; }, 1600);
}

// Botón de copiar propio por cada bloque ```código``` — para pedir un texto,
// prompt o entregable puntual sin arrastrar el comentario de Snarf alrededor.
function addCodeBlockCopyButtons(container) {
  container.querySelectorAll("pre").forEach((pre) => {
    const code = pre.querySelector("code");
    if (!code) return;
    const btn = document.createElement("button");
    btn.className = "copy-code-btn";
    btn.textContent = "📋 copiar";
    btn.addEventListener("click", () => copyTextToClipboard(code.textContent, btn));
    pre.appendChild(btn);
  });
}

// Profundidad 3D del chat (Decisión 4, solo tiene efecto visual dentro de
// #chatDock — ver CSS scoped a #chatDock .msg): 0 = el mensaje más nuevo,
// crece hacia atrás en el tiempo. Tope en CHAT_DEPTH_MAX porque la fórmula
// de opacidad/escala ya llega a ~0 ahí — más allá no aporta nada visible.
const CHAT_DEPTH_MAX = 9;
function reindexChatDepth() {
  const msgs = chatInner.querySelectorAll(".msg");
  const total = msgs.length;
  msgs.forEach((el, i) => el.style.setProperty("--depth", Math.min(total - 1 - i, CHAT_DEPTH_MAX)));
}

function addMessage(text, who, withAudio, inputAudioId, speech, autoSpeak, deliverable) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  if (who === "snarf") {
    // Los reproductores de audio van SIEMPRE arriba del texto — la
    // comunicación primaria cuando hay audio es el audio, la respuesta
    // completa en pantalla queda debajo, y los botones en su lugar de
    // siempre, debajo de todo.
    const playersContainer = document.createElement("div");
    playersContainer.className = "voice-note-players";
    div.appendChild(playersContainer);

    const textEl = document.createElement("div");
    textEl.className = "msg-text";
    textEl.innerHTML = renderMarkdown(text);
    div.appendChild(textEl);
    addCodeBlockCopyButtons(textEl);

    const actions = document.createElement("div");
    actions.className = "msg-actions";
    if (withAudio) {
      // "Escuchar": narración hablada de la MISMA respuesta completa que ya
      // está en pantalla (speech) — ya no es un resumen acortado, ver ADR de
      // esta ronda. Si el turno llegó por voz, se sintetiza sola, sin tocar
      // nada — es gratis (tier local) y es lo esperable cuando ya le
      // hablaste a Snarf. No se reproduce sola (no autoplay): aparece lista
      // para tocar. Si el turno llegó por texto, sigue siendo un botón
      // manual — al tocarlo sí arranca solo (ya es una confirmación
      // explícita). Mensajes viejos sin speech propio se degradan al texto.
      if (autoSpeak && speech) {
        const summarySlot = document.createElement("span");
        summarySlot.className = "voice-note-slot";
        summarySlot.textContent = "generando audio...";
        playersContainer.appendChild(summarySlot);
        synthesizeVoiceNote(speech).then((audioId) => {
          if (audioId) summarySlot.replaceWith(buildVoiceNotePlayer(audioId, "respuesta-de-snarf"));
          else summarySlot.remove();
        });
      } else {
        const listenBtn = document.createElement("button");
        listenBtn.className = "play-audio-btn";
        listenBtn.innerHTML = `${ICONS.mic} escuchar`;
        listenBtn.addEventListener("click", () => generateVoiceNoteAndPlay(speech || text, listenBtn, "respuesta-de-snarf", playersContainer));
        actions.appendChild(listenBtn);
      }

      // "Escuchar entregable": solo aparece cuando ESTA respuesta trae un
      // entregable puntual (un plan, un documento, una copia pedida)
      // distinto de la charla alrededor — lee solo eso, completo, sin lo
      // que Snarf dijo antes o después. Siempre manual, nunca automático.
      if (deliverable) {
        const deliverableBtn = document.createElement("button");
        deliverableBtn.className = "play-audio-btn play-audio-btn-full";
        deliverableBtn.innerHTML = `${ICONS.speaker} escuchar entregable`;
        deliverableBtn.addEventListener("click", () => generateVoiceNoteAndPlay(deliverable, deliverableBtn, "entregable", playersContainer));
        actions.appendChild(deliverableBtn);
      }
    }
    const copyBtn = document.createElement("button");
    copyBtn.className = "copy-msg-btn";
    copyBtn.textContent = "📋 copiar respuesta";
    copyBtn.addEventListener("click", () => copyTextToClipboard(text, copyBtn));
    actions.appendChild(copyBtn);
    div.appendChild(actions);
  } else if (inputAudioId) {
    // Nota de voz real, estilo WhatsApp: reproducible las veces que haga
    // falta (reproductor embebido propio, con progreso/velocidad/menú de
    // compartir-descargar), con la transcripción disponible como
    // desplegable en vez de mostrarse siempre — el audio es el mensaje.
    div.classList.add("voice-note");
    const player = buildVoiceNotePlayer(inputAudioId, "nota-de-voz");
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "voice-note-toggle";
    toggleBtn.textContent = "▾ transcripción";
    const transcriptEl = document.createElement("div");
    transcriptEl.className = "voice-note-transcript";
    transcriptEl.textContent = text;
    transcriptEl.hidden = true;
    toggleBtn.addEventListener("click", () => {
      transcriptEl.hidden = !transcriptEl.hidden;
      toggleBtn.textContent = (transcriptEl.hidden ? "▾" : "▴") + " transcripción";
    });
    div.appendChild(player);
    div.appendChild(toggleBtn);
    div.appendChild(transcriptEl);
  } else {
    div.textContent = text;
  }
  chatInner.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  reindexChatDepth();
  return div;
}
// Mientras Snarf piensa, el indicador de "..." suma una mini-animación del
