function makeReorderable(containerOrContainers, onReorder) {
  const containers = Array.isArray(containerOrContainers) ? containerOrContainers : [containerOrContainers];
  const allCards = () => containers.flatMap((c) => [...c.querySelectorAll("[data-widget-id]")]);

  containers.forEach((container) => {
    container.querySelectorAll("[data-drag-handle]").forEach((handle) => {
      handle.addEventListener("pointerdown", (e) => {
        // Sin esto, el mousedown inicial dispara la selección de texto nativa
        // del navegador (arrastra sobre todo el contenido de la columna en vez
        // de mover el panel) antes de que el drag llegue a engancharse.
        e.preventDefault();
        const card = handle.closest("[data-widget-id]");
        const isTouch = e.pointerType === "touch";
        let dragging = false;
        let holdTimer = null;

        // Los listeners de mover/soltar van en document, no en el asa: en
        // cuanto el cursor/dedo se despega del asa (que es chica), un listener
        // puesto ahí deja de recibir eventos. setPointerCapture debería evitar
        // esto pero no siempre se comporta igual entre navegadores; document
        // siempre recibe el evento sin importar qué haya debajo del puntero.
        const begin = () => {
          dragging = true;
          isDraggingPanel = true;
          card.classList.add("dragging");
        };
        if (isTouch) holdTimer = setTimeout(begin, 350);
        else begin();

        const onMove = (ev) => {
          // No cancelamos el hold por jitter del dedo: el asa ya tiene
          // touch-action:none, así que el navegador no le va a robar el gesto
          // para hacer scroll aunque el dedo tiemble durante la espera.
          if (!dragging) return;
          ev.preventDefault();
          const siblings = allCards().filter((c) => c !== card);
          let inserted = false;
          for (const sib of siblings) {
            const rect = sib.getBoundingClientRect();
            // 2D, no solo Y: con bloques de ancho variable en una grilla real
            // (antes todos tenían el mismo ancho), comparar solo la altura
            // ubicaba mal el punto de inserción en filas con más de un bloque.
            // "antes" de un hermano = está completamente arriba de su fila
            // (sin importar X), o está en su misma franja vertical y a la
            // izquierda de su punto medio horizontal.
            const before = ev.clientY < rect.top || (ev.clientY < rect.bottom && ev.clientX < rect.left + rect.width / 2);
            if (before) {
              sib.parentElement.insertBefore(card, sib);
              inserted = true;
              break;
            }
          }
          if (!inserted) containers[containers.length - 1].appendChild(card);
        };
        const onUp = () => {
          if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          if (dragging) {
            card.classList.remove("dragging");
            isDraggingPanel = false;
            const newIds = allCards().map((c) => c.dataset.widgetId);
            onReorder(newIds);
          }
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    });
  });
}

function reorderWithinSubset(order, subsetIds, newSubsetOrder) {
  // Un id del subset que hoy está oculto (no viene en newSubsetOrder) antes
  // igual consumía un idx++ — con casi todo compartiendo un solo scope de
  // reordenamiento (la grilla unificada), esto se dispara mucho más seguido
  // que antes. Si no está en el nuevo orden, se deja donde ya estaba.
  const newSet = new Set(newSubsetOrder);
  let idx = 0;
  return order.map((id) => (subsetIds.includes(id) && newSet.has(id) ? newSubsetOrder[idx++] : id));
}

function gridMetrics(gridEl) {
  const cs = getComputedStyle(gridEl);
  const colGap = parseFloat(cs.columnGap) || 0;
  const rowGap = parseFloat(cs.rowGap) || 0;
  // El navegador ya resuelve "repeat(12, 1fr)" a píxeles concretos acá — no
  // hace falta medir aparte, y queda correcto sin importar el ancho real del
  // contenedor en cada momento.
  const colWidth = parseFloat(cs.gridTemplateColumns.split(" ")[0]) || 1;
  const rowHeight = parseFloat(cs.gridAutoRows) || 28;
  return { colWidth, colGap, rowHeight, rowGap };
}

// Redimensionar es un gesto nuevo, separado del de arrastrar-para-reordenar
// — mismo estilo general (Pointer Events, listeners en document) pero mueve
// el borde del bloque en vez de su posición en el DOM.
function makeResizable(containerOrContainers, onResize) {
  const containers = Array.isArray(containerOrContainers) ? containerOrContainers : [containerOrContainers];
  containers.forEach((container) => {
    container.querySelectorAll("[data-resize-handle]").forEach((handle) => {
      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation(); // nunca debe interferir con el asa de arrastre del mismo bloque
        const card = handle.closest("[data-widget-id]");
        const grid = card.parentElement;
        const { colWidth, colGap, rowHeight, rowGap } = gridMetrics(grid);
        const startX = e.clientX, startY = e.clientY;
        const startRect = card.getBoundingClientRect();
        const startColSpan = Math.max(1, Math.round((startRect.width + colGap) / (colWidth + colGap)));
        const startRowSpan = Math.max(1, Math.round((startRect.height + rowGap) / (rowHeight + rowGap)));
        card.classList.add("resizing");
        isDraggingPanel = true; // reusa la misma bandera para que el swipe/otros gestos no interfieran
        let colSpan = startColSpan, rowSpan = startRowSpan;

        const onMove = (ev) => {
          const deltaCol = Math.round((ev.clientX - startX) / (colWidth + colGap));
          const deltaRow = Math.round((ev.clientY - startY) / (rowHeight + rowGap));
          colSpan = clamp(startColSpan + deltaCol, MIN_COL_SPAN, MAX_COL_SPAN);
          rowSpan = clamp(startRowSpan + deltaRow, MIN_ROW_SPAN, MAX_ROW_SPAN);
          card.style.gridColumn = `span ${colSpan}`;
          card.style.gridRow = `span ${rowSpan}`;
        };
        const onUp = () => {
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          card.classList.remove("resizing");
          isDraggingPanel = false;
          onResize(card.dataset.widgetId, colSpan, rowSpan);
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    });
  });
}

  const ids = visibleOrdered(WIDGET_IDS);

  dashboardInner.innerHTML = `<div class="dash-grid">${ids.map((id) => widgetShell(id, widgetBodyHTML(id, summary), { draggable: true, resizable: false })).join("")}</div>`;

// Chat e historial no se reconstruyen por HTML como los demás widgets — son
// nodos vivos con listeners atados (grabación, textarea, audio, refresco de
// conversaciones). wrapExistingAsBlock los mueve (nunca clona) a un wrapper
// .dash-widget nuevo, la primera vez que arranca en desktop.
function wrapExistingAsBlock(id, bodyEl, { draggable = true, resizable = true } = {}) {
  const wrapper = document.createElement("div");
  wrapper.className = "dash-widget";
  wrapper.dataset.widgetId = id;
  if (resizable) applyBlockSpan(wrapper, id);
  const head = document.createElement("div");
  head.className = "dash-widget-head";
  head.innerHTML = `<h3>${WIDGET_LABELS[id]}</h3>` + (draggable ? `<span class="dash-drag-handle" data-drag-handle>${ICONS.drag}</span>` : "");
  const sub = document.createElement("div");
  sub.className = "dash-widget-sub";
  sub.textContent = WIDGET_SUBTITLES[id] || "";
  wrapper.appendChild(head);
  wrapper.appendChild(sub);
  wrapper.appendChild(bodyEl); // mueve el nodo vivo, no lo duplica
  if (resizable) {
    wrapper.insertAdjacentHTML("beforeend", `<span class="dash-resize-handle" data-resize-handle title="arrastrá para cambiar el tamaño">${ICONS.resize}</span>`);
  }
  return wrapper;
}

function reparentChatIntoDashboard() {

function renderDesktopDashboard(summary) {
  const ids = visibleOrdered(DESKTOP_BLOCK_IDS); // siempre incluye chat/historial (forzado en el backend)
  const rest = ids.filter((id) => !ALWAYS_VISIBLE_BLOCK_IDS.includes(id));

  dashGridDesktop.querySelectorAll("[data-widget-id]").forEach((el) => {
    if (!ALWAYS_VISIBLE_BLOCK_IDS.includes(el.dataset.widgetId)) el.remove();
  });
  dashGridDesktop.insertAdjacentHTML(
    "beforeend",
    rest.map((id) => widgetShell(id, widgetBodyHTML(id, summary), { draggable: true, resizable: true })).join("")
  );

  // Reordena TODO (los widgets recién reconstruidos + chat/historial, que
  // son permanentes) al orden real guardado — appendChild sobre un nodo ya
  // existente lo MUEVE, así que este único loop deja el DOM en el orden correcto.
  ids.forEach((id) => {
    const el = dashGridDesktop.querySelector(`[data-widget-id="${id}"]`);
    if (el) { applyBlockSpan(el, id); dashGridDesktop.appendChild(el); }
  });

  makeReorderable(dashGridDesktop, (newIds) => {
    dashboardPrefs.panel_order = reorderWithinSubset(dashboardPrefs.panel_order, DESKTOP_BLOCK_IDS, newIds);
    persistPrefs();
  });
  makeResizable(dashGridDesktop, (id, colSpan, rowSpan) => {
    dashboardPrefs.widget_options[id] = { ...(dashboardPrefs.widget_options[id] || {}), col_span: colSpan, row_span: rowSpan };
    persistPrefs();
  });

  loadGoogleWidgetsInto(dashGridDesktop, rest);
  if (rest.includes("brain")) loadBrainWidgetInto(dashGridDesktop);
  if (rest.includes("usage")) loadUsageWidgetInto(dashGridDesktop);
  refreshConvLists();
}

async function refreshDashboard() {
  try {
    if (!dashboardPrefs) dashboardPrefs = await (await apiFetch("/dashboard/preferences")).json();
    const summary = await (await apiFetch("/dashboard/summary")).json();
    lastSummary = summary;
    setUserLabel(summary.user_id);
    if (isDesktopDashboard()) renderDesktopDashboard(summary);
    else renderMobileDashboard(summary);
  } catch (e) {
    dashboardInner.innerHTML = '<div class="dash-loading">error cargando el dashboard</div>';
  }
}
apiFetch("/dashboard/summary").then((r) => r.json()).then((d) => setUserLabel(d.user_id)).catch(() => {});

/* ---------- panel de configuración ---------- */
function openSettings() {
  settingsOverlay.classList.add("open");
  settingsPanel.classList.add("open");
  renderSettingsList();
}
function closeSettings() {
  settingsOverlay.classList.remove("open");
  settingsPanel.classList.remove("open");
}
async function renderSettingsList() {
  if (!dashboardPrefs) dashboardPrefs = await (await apiFetch("/dashboard/preferences")).json();
  settingsList.innerHTML = WIDGET_IDS.map((id) => `
    <div class="settings-row">
      <span>${WIDGET_LABELS[id]}</span>
      <button class="settings-toggle ${dashboardPrefs.visible_widgets[id] ? "on" : ""}" data-widget-id="${id}"></button>
    </div>
  `).join("");
  settingsList.querySelectorAll(".settings-toggle").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.widgetId;
      dashboardPrefs.visible_widgets[id] = !dashboardPrefs.visible_widgets[id];
      btn.classList.toggle("on", dashboardPrefs.visible_widgets[id]);
      persistPrefs();
      if (currentView === "dashboard") refreshDashboard();
    });
  });
}
settingsBtn.addEventListener("click", () => { userMenu.classList.remove("open"); openSettings(); });
settingsCloseBtn.addEventListener("click", closeSettings);
settingsOverlay.addEventListener("click", closeSettings);

/* ---------- swipe entre chat y dashboard ---------- */
let touchStartX = null;
let touchStartY = null;
document.addEventListener("touchstart", (e) => {
  // En desktop ya no hay una vista "solo chat" separada a la que swipear —
  // el chat vive siempre dentro de la grilla del dashboard.
  if (isDesktopDashboard() || state === "listening" || isDraggingPanel) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (isDesktopDashboard() || touchStartX === null || isDraggingPanel) { touchStartX = null; return; }
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) {
    if (dx < 0 && currentView === "chat") showDashboard();
    else if (dx > 0 && currentView === "dashboard") showChat();
  }
}, { passive: true });

/* ---------- audio recording ---------- */
function pickMimeType() {
  const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  for (const type of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
  }
  return "";
}
function extFor(mime) {
  if (mime.includes("mp4")) return "mp4";
  if (mime.includes("ogg")) return "ogg";
  return "webm";
}
async function startRecording() {
  // Se pide un stream nuevo en cada grabación (en vez de cachear uno para
  // siempre): en iOS Safari, backgrounding o bloqueo de pantalla suele matar
  // los tracks de un stream viejo sin avisar, y reusarlo produce grabaciones
  // vacías indistinguibles de "no funciona". El navegador no vuelve a pedir
  // permiso si ya fue otorgado para este origen.
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  const mimeType = pickMimeType();
  mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  recordedMimeType = mediaRecorder.mimeType || mimeType || "audio/webm";
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.start();
  setState("listening", "escuchando...");
}
function stopRecording() {
  return new Promise((resolve) => {
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      resolve(new Blob(chunks, { type: recordedMimeType }));
    };
    mediaRecorder.stop();
  });
}
async function transcribeBlob(blob) {
  const form = new FormData();
  form.append("file", blob, "audio." + extFor(blob.type || recordedMimeType));
  const res = await apiFetch("/transcribe", { method: "POST", body: form });
  if (!res.ok) throw new Error("transcribe HTTP " + res.status);
  const data = await res.json();
  // data.error: el STT en sí falló (cuota, red) — distinto de una
  // transcripción vacía real (audio corto o silencio genuino), que no trae
  // este campo. Sin la distinción, un fallo de servicio se mostraba como
  // "no se escuchó nada" — engañoso, porque reintentar no soluciona nada.
  return { transcript: data.transcript || "", error: data.error || null };
}

async function sendText(text) {
  if (!text.trim()) { setState("idle", idleLabel()); return; }
  addMessage(text, "user");
  setState("thinking", "pensando...");
  showTyping();
  try {
    const res = await apiFetch("/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, conversation_id: conversationId }),
    });
    if (!res.ok) throw new Error("send HTTP " + res.status);
    const data = await res.json();
    hideTyping();
    addMessage(data.response, "snarf", ttsAvailable);
    setState("idle", idleLabel());
  } catch (e) {
    hideTyping();
    setState("error", "error: " + (e.message || e));
  }
}

async function handleClickMode() {
  unlockAudio();
  if (state === "error") setState("idle", idleLabel());
  if (state === "idle") {
    try { await startRecording(); } catch (e) { setState("error", "sin micrófono: " + (e.message || e)); }
  } else if (state === "listening") {
    setState("thinking", "transcribiendo...");
    try {
      const blob = await stopRecording();
      const { transcript, error } = await transcribeBlob(blob);
      if (error) { setState("error", error); return; }
      if (!transcript.trim()) { setState("idle", "no se escuchó nada, probá de nuevo"); return; }
      reviewText.value = transcript;
      autoResizeTextarea(reviewText);
      review.classList.add("visible");
      setState("idle", "revisá y enviá");
    } catch (e) { setState("error", "error: " + (e.message || e)); }
  }
}
orbWrap.addEventListener("click", () => { if (mode === "click") handleClickMode(); });

document.getElementById("sendBtn").addEventListener("click", () => {
  review.classList.remove("visible");
  sendText(reviewText.value);
});
document.getElementById("cancelBtn").addEventListener("click", () => {
  review.classList.remove("visible");
  setState("idle", idleLabel());
});

// Textarea que crece con el texto (tipeado o transcripto) hasta un máximo,
// después scrollea adentro — así se ve completo mientras se edita antes de
// enviar, en vez de cortarse en una sola línea.
function autoResizeTextarea(el) {
  el.style.height = "auto";
  el.style.height = el.scrollHeight + "px";
}
textInput.addEventListener("input", () => autoResizeTextarea(textInput));
reviewText.addEventListener("input", () => autoResizeTextarea(reviewText));

function sendFromTextInput() {
  const text = textInput.value;
  textInput.value = "";
  autoResizeTextarea(textInput);
  unlockAudio();
  sendText(text).then(() => textInput.focus());
}
textSendBtn.addEventListener("click", sendFromTextInput);
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendFromTextInput(); }
});

async function handleMicClick() {
  unlockAudio();
  if (state === "error") setState("idle", idleLabel());
  if (state === "idle") {
    try {
      await startRecording();
      micBtn.classList.add("recording");
    } catch (err) {
      setState("error", "sin micrófono: " + (err.message || err));
    }
  } else if (state === "listening") {
    micBtn.classList.remove("recording");
    setState("thinking", "transcribiendo...");
    try {
      const blob = await stopRecording();
      const { transcript, error } = await transcribeBlob(blob);
      if (error) { setState("error", error); return; }
      textInput.value = transcript;
      autoResizeTextarea(textInput);
      setState("idle", idleLabel());
      textInput.focus();
    } catch (err) {
      setState("error", "error: " + (err.message || err));
    }
  }
}
micBtn.addEventListener("click", handleMicClick);

/* ---------- adjuntar archivo ---------- */
async function uploadAttachedFile(file) {
  addMessage("adjuntando " + file.name + "...", "user");
  showTyping();
  const form = new FormData();
  form.append("file", file);
  try {
    const res = await apiFetch("/files/upload", { method: "POST", body: form });
    hideTyping();
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      addMessage("no pude subir el archivo: " + (err.detail || res.status), "snarf");
      return;
    }
    const data = await res.json();
    const link = data.webViewLink ? `[${data.name}](${data.webViewLink})` : data.name;
    let text = `Subí y guardé **${link}** en tu Drive` + (data.indexed ? ", ya vectorizado y buscable." : " (todavía sin vectorizar).");
    if (data.analysis) text += `\n\n${data.analysis}`;
    addMessage(text, "snarf");
  } catch (e) {
    hideTyping();
    addMessage("no pude subir el archivo: " + (e.message || e), "snarf");
  }
}
attachBtn.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (file) uploadAttachedFile(file);
});

// En desktop arrancamos siempre en el Dashboard (con la distribución que el
// usuario haya guardado la última vez) — el chat vive ahí adentro como un
// bloque más. Mobile sigue arrancando en "chat", sin tocar nada.
if (isDesktopDashboard()) {
  reparentIntoDashboardOnce();
  showDashboard();
}

setMode(mode, false);

fetch("/status").then(r => r.json()).then(s => {
  ttsAvailable = !!s.tts_available;
  if (!s.stt_available || !s.tts_available) setState("error", "faltan credenciales de voz (ver .env)");
  else if (!s.llm_available) statusEl.textContent = "modo eco (sin ANTHROPIC_API_KEY)";
}).catch(() => {});
