<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snarf</title>
<style>
  :root {
    --glow: #4fd8e8;
    --glow-soft: #b6f5fb;
    --glow-dim: #1c5a63;
    --text-dim: #6f8891;
    --text: #d7eef2;
    --error: #e85a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #000; height: 100%; overflow-x: hidden; overscroll-behavior: none; }
  body {
    margin: 0;
    height: 100dvh;
    background: #000;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* --- atmosphere layers --- */
  .bg-glow {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 65% 55% at 50% 40%, #0c1c22 0%, #050a0c 45%, #000000 82%);
    z-index: 0;
  }
  .nebula {
    position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.35; z-index: 0;
    animation: drift 26s ease-in-out infinite;
  }
  .nebula.a { width: 55vw; height: 55vw; background: #0d3a42; top: -10%; left: -15%; }
  .nebula.b { width: 45vw; height: 45vw; background: #072a33; bottom: -15%; right: -10%; animation-duration: 32s; animation-delay: -8s; }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(3%, -4%) scale(1.08); }
  }
  .grid {
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(79,216,232,0.035) 0px, rgba(79,216,232,0.035) 1px, transparent 1px, transparent 46px),
      repeating-linear-gradient(90deg, rgba(79,216,232,0.035) 0px, rgba(79,216,232,0.035) 1px, transparent 1px, transparent 46px);
    -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 40%, black 0%, transparent 75%);
    mask-image: radial-gradient(ellipse 60% 55% at 50% 40%, black 0%, transparent 75%);
    z-index: 0;
  }
  .particle {
    position: fixed; width: 3px; height: 3px; border-radius: 50%;
    background: var(--glow); box-shadow: 0 0 6px 2px rgba(79,216,232,0.7);
    opacity: 0; z-index: 0; animation: float-up linear infinite;
  }
  @keyframes float-up {
    0% { transform: translateY(0); opacity: 0; }
    10% { opacity: 0.8; } 90% { opacity: 0.4; }
    100% { transform: translateY(-40vh); opacity: 0; }
  }
  .scanline {
    position: fixed; left: 0; right: 0; top: -2px; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(79,216,232,0.45), transparent);
    animation: scan 7s linear infinite; z-index: 1;
  }
  @keyframes scan { 0% { top: -2px; } 100% { top: 100%; } }

  .corner {
    position: fixed; width: 26px; height: 26px;
    border: 1px solid rgba(79,216,232,0.3); z-index: 1;
  }
  .corner.tl { top: env(safe-area-inset-top, 12px); left: 12px; border-right: none; border-bottom: none; }
  .corner.tr { top: env(safe-area-inset-top, 12px); right: 12px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: calc(env(safe-area-inset-bottom, 12px) + 12px); left: 12px; border-right: none; border-top: none; }
  .corner.br { bottom: calc(env(safe-area-inset-bottom, 12px) + 12px); right: 12px; border-left: none; border-top: none; }

  /* --- top bar: menu toggle --- */
  .menu-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: 16px;
    z-index: 6;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.3);
    background: rgba(5,10,12,0.6);
    color: var(--glow);
    font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* --- sidebar --- */
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: min(280px, 78vw);
    background: rgba(4,8,10,0.92);
    border-right: 1px solid rgba(79,216,232,0.2);
    backdrop-filter: blur(10px);
    z-index: 8;
    transform: translateX(-105%);
    transition: transform 0.28s ease;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 60px) 0 calc(env(safe-area-inset-bottom, 0px) + 16px);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 7; opacity: 0; pointer-events: none; transition: opacity 0.28s ease;
  }
  .sidebar-overlay.open { opacity: 1; pointer-events: auto; }
  .new-conv-btn {
    margin: 0 14px 14px;
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    border: 1px solid rgba(79,216,232,0.35);
    background: rgba(79,216,232,0.1);
    color: var(--text);
    font-family: inherit;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-align: left;
  }
  .conv-list { overflow-y: auto; flex: 1 1 auto; padding: 0 8px; }
  .conv-item {
    padding: 0.65rem 0.7rem;
    border-radius: 8px;
    font-size: 0.72rem;
    color: var(--text-dim);
    cursor: pointer;
    margin-bottom: 2px;
    line-height: 1.4;
  }
  .conv-item:hover, .conv-item.active { background: rgba(79,216,232,0.1); color: var(--text); }
  .conv-item .conv-date { display: block; font-size: 0.6rem; opacity: 0.7; margin-top: 2px; }
  .conv-empty { padding: 1rem 0.7rem; font-size: 0.7rem; color: var(--text-dim); opacity: 0.6; }
  /* --- user menu (sidebar) --- */
  .user-menu { margin: 10px 14px 0; position: relative; }
  .user-menu-btn {
    width: 100%; display: flex; align-items: center; gap: 0.55rem;
    padding: 0.55rem 0.7rem; border-radius: 10px;
    border: 1px solid rgba(79,216,232,0.25); background: rgba(79,216,232,0.06);
    color: var(--text); font-family: inherit; font-size: 0.72rem; cursor: pointer; text-align: left;
  }
  .user-avatar {
    width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
    background: rgba(79,216,232,0.2); border: 1px solid rgba(79,216,232,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem; color: var(--glow-soft); text-transform: uppercase;
  }
  .user-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-caret { color: var(--text-dim); font-size: 0.6rem; transition: transform 0.2s ease; }
  .user-menu.open .user-caret { transform: rotate(180deg); }
  .user-menu-popover {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 6px);
    background: rgba(5,10,12,0.96); border: 1px solid rgba(79,216,232,0.3);
    border-radius: 10px; padding: 6px; display: flex; flex-direction: column; gap: 2px;
    opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .user-menu.open .user-menu-popover { opacity: 1; transform: none; pointer-events: auto; }
  .user-menu-item {
    display: flex; align-items: center; gap: 0.5rem; background: none; border: none;
    color: var(--text-dim); font-family: inherit; font-size: 0.72rem;
    padding: 0.5rem 0.6rem; border-radius: 8px; cursor: pointer; text-align: left;
  }
  .user-menu-item:hover:not(:disabled) { background: rgba(79,216,232,0.1); color: var(--text); }
  .user-menu-item:disabled { opacity: 0.45; cursor: default; }
  .user-menu-item.danger { color: #e88a8a; }
  .user-menu-item.danger:hover { background: rgba(232,90,90,0.12); color: #fff; }

  /* --- view switching (chat / dashboard) --- */
  #appRoot { position: relative; z-index: 2; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .view-chat, .view-dashboard {
    flex: 1 1 auto; min-height: 0; display: none; flex-direction: column;
  }
  .view-chat.active, .view-dashboard.active { display: flex; }
  .dash-zone-top, .dash-zone-left, .dash-zone-right { display: none; }

  /* --- modo Jarvis: chat centrado, paneles alrededor (desktop ancho) --- */
  @media (min-width: 900px) {
    body.jarvis-mode .menu-btn { display: none; }
    body.jarvis-mode #appRoot {
      display: grid;
      grid-template-columns: 280px minmax(380px, 620px) 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas: "top top top" "left center right";
      gap: 0.9rem;
      padding: calc(env(safe-area-inset-top, 0px) + 3.8rem) 1.2rem 1rem;
      height: 100%;
    }
    body.jarvis-mode .view-chat {
      display: flex; grid-area: center; min-height: 0;
    }
    body.jarvis-mode .view-dashboard { display: contents; }
    body.jarvis-mode .dash-zone-top {
      display: block; grid-area: top; min-height: 0; overflow-y: auto;
    }
    body.jarvis-mode .dash-zone-left {
      display: flex; flex-direction: column; grid-area: left; min-height: 0; overflow-y: auto; gap: 0.8rem;
    }
    body.jarvis-mode .dash-zone-right {
      display: flex; flex-direction: column; grid-area: right; min-height: 0; overflow-y: auto; gap: 0.8rem;
    }
    body.jarvis-mode .dash-mobile-stack { display: none; }
  }
  .dash-left-convs {
    border: 1px solid rgba(79,216,232,0.22); border-radius: 14px;
    background: rgba(255,255,255,0.03); padding: 0.8rem; display: flex; flex-direction: column;
    min-height: 160px; max-height: 40vh;
  }
  .dash-left-convs .conv-list { overflow-y: auto; }

  /* --- panel drag handle / reordering --- */
  .dash-widget-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.15rem; }
  .dash-widget-head h3 { margin: 0; }
  .dash-widget-sub { font-size: 0.66rem; color: var(--text-dim); margin-bottom: 0.6rem; opacity: 0.85; }
  .dash-row a, .dash-row-title a {
    color: inherit; text-decoration: none; border-bottom: 1px dotted rgba(79,216,232,0.4);
  }
  .dash-row a:hover, .dash-row-title a:hover { color: var(--glow-soft); border-bottom-color: var(--glow-soft); }
  .dash-widget-config {
    display: flex; align-items: center; gap: 0.4rem; font-size: 0.66rem; color: var(--text-dim);
    margin-bottom: 0.5rem;
  }
  .dash-widget-config select {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(79,216,232,0.3); border-radius: 6px;
    color: var(--text); font-family: inherit; font-size: 0.68rem; padding: 0.15rem 0.4rem;
  }
  .dash-gmail-digest { margin-top: 0.7rem; padding-top: 0.6rem; border-top: 1px solid rgba(255,255,255,0.06); }
  .dash-mini-btn {
    background: rgba(79,216,232,0.12); border: 1px solid rgba(79,216,232,0.35); color: var(--glow-soft);
    font-family: inherit; font-size: 0.66rem; letter-spacing: 0.02em; padding: 0.3rem 0.6rem;
    border-radius: 999px; cursor: pointer;
  }
  .dash-mini-btn:disabled { opacity: 0.5; cursor: default; }
  #gmailDigestContent {
    font-size: 0.76rem; line-height: 1.5; margin-top: 0.5rem;
    max-height: 260px; overflow-y: auto;
  }
  #gmailDigestContent p { margin: 0 0 0.4rem; }
  #gmailDigestContent ul, #gmailDigestContent ol { margin: 0 0 0.4rem; padding-left: 1.1rem; }
  #gmailDigestContent strong { color: var(--glow-soft); }
  .dash-drag-handle {
    color: var(--text-dim); cursor: grab; touch-action: none; opacity: 0.55;
    display: flex; align-items: center; justify-content: center;
    min-width: 32px; min-height: 32px; margin: -8px -6px -8px 0;
    user-select: none; -webkit-user-select: none;
  }
  .dash-drag-handle:hover { opacity: 1; color: var(--glow); }
  .dash-widget.dragging, .dash-widget.dragging * { user-select: none; -webkit-user-select: none; cursor: grabbing; }
  .dash-widget.dragging { opacity: 0.4; border-color: var(--glow); }

  /* --- panel de configuración --- */
  .settings-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .settings-overlay.open { opacity: 1; pointer-events: auto; }
  .settings-panel {
    position: fixed; z-index: 11;
    left: 50%; top: 50%; transform: translate(-50%, -46%);
    width: min(360px, 88vw); max-height: 70vh; overflow-y: auto;
    background: rgba(5,10,12,0.97); border: 1px solid rgba(79,216,232,0.35);
    border-radius: 16px; padding: 1rem;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .settings-panel.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
  .settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.7rem; }
  .settings-head h3 { margin: 0; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--glow-soft); }
  .settings-close {
    background: none; border: 1px solid rgba(79,216,232,0.3); color: var(--text-dim);
    border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 0.75rem;
  }
  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.55rem 0.2rem; font-size: 0.78rem; color: var(--text);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-toggle {
    width: 34px; height: 19px; border-radius: 999px; border: 1px solid rgba(79,216,232,0.35);
    background: rgba(255,255,255,0.06); position: relative; cursor: pointer; flex-shrink: 0;
  }
  .settings-toggle::after {
    content: ""; position: absolute; top: 1px; left: 1px; width: 15px; height: 15px;
    border-radius: 50%; background: var(--text-dim); transition: transform 0.18s ease, background 0.18s ease;
  }
  .settings-toggle.on { background: rgba(79,216,232,0.25); border-color: var(--glow); }
  .settings-toggle.on::after { transform: translateX(15px); background: var(--glow); }

  .dash-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: 58px;
    z-index: 6;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid rgba(79,216,232,0.3);
    background: rgba(5,10,12,0.6);
    color: var(--glow);
    font-size: 0.95rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* --- dashboard --- */
  .dash-mobile-stack {
    position: relative; z-index: 2;
    flex: 1 1 auto; min-height: 0; overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 3.6rem) 1rem calc(env(safe-area-inset-bottom, 0px) + 1.5rem);
    width: 100%; max-width: 1100px; margin: 0 auto;
  }
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 0.9rem;
  }
  .dash-widget {
    position: relative;
    border: 1px solid rgba(79,216,232,0.22);
    background:
      radial-gradient(ellipse at center, rgba(79,216,232,0.09) 0%, rgba(8,14,16,0.55) 68%, rgba(4,8,9,0.78) 100%);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    padding: 1rem 1.1rem;
  }
  .dash-widget h3 {
    margin: 0 0 0.7rem; font-size: 0.78rem; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--glow-soft); font-weight: 500;
  }
  .dash-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text); padding: 0.25rem 0; }
  .dash-row.dash-dim { color: var(--text-dim); font-size: 0.72rem; }
  .dash-row, .dash-row-stacked { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-row-stacked {
    display: flex; flex-direction: column; gap: 0.1rem; padding: 0.3rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.78rem; color: var(--text);
  }
  .dash-row-stacked:last-child { border-bottom: none; }
  .dash-row-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-row-sub { font-size: 0.68rem; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dash-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--text-dim); }
  .dash-dot.ok { background: var(--glow); box-shadow: 0 0 6px 2px rgba(79,216,232,0.6); }
  .dash-dot.off { background: var(--error); box-shadow: 0 0 6px 2px rgba(232,90,90,0.4); }
  .dash-stat { font-size: 0.78rem; color: var(--text-dim); margin-bottom: 0.35rem; }
  .dash-stat-num { font-size: 1.3rem; color: var(--text); font-weight: 600; margin-right: 0.35rem; }
  .dash-chart { display: flex; align-items: flex-end; gap: 3px; height: 60px; margin-top: 0.6rem; }
  .dash-bar { flex: 1 1 auto; height: 100%; display: flex; align-items: flex-end; }
  .dash-bar-fill {
    width: 100%; background: var(--glow); opacity: 0.85; border-radius: 4px 4px 0 0; min-height: 2px;
  }
  .dash-chart-label { font-size: 0.65rem; color: var(--text-dim); margin-top: 0.4rem; text-align: right; }
  .dash-loading { color: var(--text-dim); font-size: 0.8rem; padding: 2rem 0; text-align: center; }

  /* --- chat --- */
  .chat {
    position: relative; z-index: 2;
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 3.2rem) 1rem 1rem;
    width: 100%; max-width: 560px; margin: 0 auto;
  }
  .chat-inner {
    margin-top: auto;
    display: flex; flex-direction: column; gap: 0.55rem;
    min-width: 0;
  }
  .msg {
    max-width: 82%; padding: 0.6rem 0.9rem; border-radius: 14px;
    font-size: 0.85rem; line-height: 1.5; animation: fadein 0.3s ease;
    overflow-wrap: anywhere; word-break: break-word;
  }
  .msg.snarf a { color: var(--glow-soft); text-decoration: underline; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user {
    align-self: flex-end;
    background: radial-gradient(ellipse at center, rgba(79,216,232,0.22) 0%, rgba(8,16,18,0.5) 70%, rgba(4,9,10,0.7) 100%);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(79,216,232,0.3); border-bottom-right-radius: 4px;
  }
  .msg.snarf {
    align-self: flex-start;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.08) 0%, rgba(8,12,13,0.5) 70%, rgba(4,7,8,0.7) 100%);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 4px;
  }
  .msg.snarf h1, .msg.snarf h2, .msg.snarf h3 {
    margin: 0.2rem 0 0.4rem; line-height: 1.3; color: var(--glow-soft);
  }
  .msg.snarf h1 { font-size: 1.05rem; }
  .msg.snarf h2 { font-size: 0.98rem; }
  .msg.snarf h3 { font-size: 0.9rem; }
  .msg.snarf p { margin: 0 0 0.5rem; }
  .msg.snarf p:last-child { margin-bottom: 0; }
  .msg.snarf ul, .msg.snarf ol { margin: 0 0 0.5rem; padding-left: 1.2rem; }
  .msg.snarf li { margin-bottom: 0.15rem; }
  .msg.snarf blockquote {
    margin: 0 0 0.5rem; padding: 0.3rem 0.7rem;
    border-left: 2px solid var(--glow); color: var(--text-dim); font-style: italic;
  }
  .msg.snarf code {
    background: rgba(79,216,232,0.12); padding: 0.1rem 0.35rem; border-radius: 4px;
    font-size: 0.82em;
  }
  .msg.snarf pre {
    background: rgba(0,0,0,0.4); border: 1px solid rgba(79,216,232,0.2);
    border-radius: 8px; padding: 0.6rem 0.7rem; overflow-x: auto; margin: 0 0 0.5rem;
  }
  .msg.snarf pre code { background: none; padding: 0; }
  .msg.snarf strong { color: var(--text); }
  .msg.snarf table {
    width: 100%; border-collapse: collapse; margin: 0 0 0.5rem; font-size: 0.8rem;
    display: block; overflow-x: auto; white-space: nowrap;
  }
  .msg.snarf th, .msg.snarf td {
    border: 1px solid rgba(79,216,232,0.2); padding: 0.35rem 0.55rem; text-align: left;
  }
  .msg.snarf th { color: var(--glow-soft); background: rgba(79,216,232,0.08); }
  .play-audio-btn {
    display: flex; width: fit-content; align-items: center; gap: 0.3rem;
    margin-top: 0.5rem;
    background: rgba(79,216,232,0.1);
    border: 1px solid rgba(79,216,232,0.3);
    color: var(--glow-soft);
    font-family: inherit;
    font-size: 0.65rem;
    letter-spacing: 0.04em;
    padding: 0.3rem 0.6rem;
    border-radius: 999px;
    cursor: pointer;
  }

  /* --- floating audio player --- */
  .audio-player {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: 50%;
    transform: translateX(-50%) translateY(-140%);
    z-index: 9;
    display: flex; align-items: center; gap: 0.6rem;
    background: rgba(5,10,12,0.9);
    border: 1px solid rgba(79,216,232,0.4);
    box-shadow: 0 0 20px rgba(79,216,232,0.25);
    border-radius: 999px;
    padding: 0.5rem 0.6rem 0.5rem 0.9rem;
    backdrop-filter: blur(8px);
    transition: transform 0.3s ease;
    font-size: 0.7rem;
    color: var(--text);
  }

/* ---------- markdown ---------- */
function renderMarkdown(text) {
  let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
  html = html.replace(/^(\|.+\|)\n(\|[\s:|-]+\|)\n((?:\|.+\|\n?)*)/gm, (_, headerLine, sepLine, bodyLines) => {
    const parseRow = (line) => line.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
    const headers = parseRow(headerLine);
    const rows = bodyLines.trim().split("\n").filter(Boolean).map(parseRow);
    const thead = "<thead><tr>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr></thead>";
    const tbody = "<tbody>" + rows.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody>";
    return `<table>${thead}${tbody}</table>\n`;
  });
  html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
  html = html.replace(/^## (.*)$/gm, "<h2>$1</h2>");
  html = html.replace(/^# (.*)$/gm, "<h1>$1</h1>");
  html = html.replace(/^&gt; (.*)$/gm, "<blockquote>$1</blockquote>");
  html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  html = html.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/^(?:-\s.*(?:\n|$))+/gm, (block) => {
    const items = block.trim().split("\n").map(l => `<li>${l.replace(/^-\s/, "")}</li>`).join("");
    return `<ul>${items}</ul>`;
  });
  html = html.replace(/^(?:\d+\.\s.*(?:\n|$))+/gm, (block) => {
    const items = block.trim().split("\n").map(l => `<li>${l.replace(/^\d+\.\s/, "")}</li>`).join("");
    return `<ol>${items}</ol>`;
  });
  html = html.split(/\n\n+/).map(p => {
    const t = p.trim();
    if (/^<h\d|^<ul|^<ol|^<pre|^<blockquote|^<table/.test(t)) return t;
    if (!t) return "";
    return `<p>${t.replace(/\n/g, "<br>")}</p>`;
  }).join("");
  return html;
}

/* ---------- chat helpers ---------- */
function idleLabel() {
  if (mode === "click") return "click para grabar";
  if (mode === "hold") return "mantené presionado para hablar";

}
function setState(next, label) {

async function fetchAndPlay(text, btn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = "generando audio...";
  try {
    const res = await apiFetch("/tts", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await res.json();
    if (data.audio_base64) {
      playAudio("data:audio/mpeg;base64," + data.audio_base64);
    } else {
      btn.textContent = "no disponible";
    }
  } catch (e) {
    btn.textContent = "error, probá de nuevo";
  } finally {
    btn.disabled = false;
    if (btn.textContent === "generando audio...") btn.textContent = original;
  }
}
function addMessage(text, who, withAudio) {
  const div = document.createElement("div");
  div.className = "msg " + who;

      div.appendChild(btn);

  }
  chatInner.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

function relativeTime(ts) {
  const diff = (Date.now() / 1000) - ts;
  if (diff < 60) return "ahora";
  if (diff < 3600) return Math.floor(diff / 60) + " min";
  if (diff < 86400) return Math.floor(diff / 3600) + " h";
  return Math.floor(diff / 86400) + " d";
}

function formatBytes(bytes) {

  if (!n) return "";
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${Math.round(n / 1024)} KB`;
  return `${(n / (1024 * 1024)).toFixed(1)} MB`;

function driveBodyHTML(data) {

    .map((f) => {
      const meta = [formatDate(f.modifiedTime ? Date.parse(f.modifiedTime) / 1000 : null), formatBytes(f.size)].filter(Boolean).join(" · ");

// El refresco de la interpretación de Gmail es 100% impulsado por el
// navegador, nunca por el servidor: solo pasa mientras el dashboard está
// abierto y visible. La parte cara (llamar al LLM) solo se paga cuando la
// parte barata (comparar el id del último mensaje) detecta correo nuevo.
const GMAIL_DIGEST_POLL_MS = 5 * 60 * 1000;
let gmailPollTimer = null;

function stopGmailDigestPolling() {
  if (gmailPollTimer) { clearInterval(gmailPollTimer); gmailPollTimer = null; }
}
function startGmailDigestPolling() {
  stopGmailDigestPolling();
  gmailPollTimer = setInterval(() => checkGmailForNewMail(), GMAIL_DIGEST_POLL_MS);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopGmailDigestPolling(); return; }
  if (currentView === "dashboard") {
    checkGmailForNewMail();
    startGmailDigestPolling();
  }
});

async function checkGmailForNewMail() {
  // El widget de Gmail puede estar en cualquier zona (arriba, derecha, o la
  // columna única de mobile) según cómo el fundador haya reordenado los
  // paneles — se busca por id, no por contenedor fijo.
  const body = document.querySelector('[data-widget-id="gmail"] .dash-widget-body');
  if (!body) return;
  try {
    const [listRes, digestRes] = await Promise.all([
      apiFetch("/dashboard/widgets/gmail?max_results=1"),
      apiFetch("/dashboard/widgets/gmail/digest"),
    ]);
    const listData = await listRes.json();
    const digestData = await digestRes.json();
    if (!listData.connected || !digestData.connected) return;
    const currentTopId = listData.messages && listData.messages[0] ? listData.messages[0].id : null;
    const cached = digestData.digest;
    const isNew = currentTopId && (!cached || cached.latest_message_id !== currentTopId);
    if (isNew || !cached) {
      await refreshGmailDigest(body);
    }
  } catch (e) {
    // chequeo silencioso: si falla, se reintenta en el próximo ciclo o al abrir de nuevo.
  }
}

async function loadGmailWidgetInto(root) {
  const body = root.querySelector('[data-widget-id="gmail"] .dash-widget-body');
  if (!body) return;
  const maxResults = dashboardPrefs.widget_options.gmail.max_results;
  try {
    const res = await apiFetch(`/dashboard/widgets/gmail?max_results=${maxResults}`);
    const data = await res.json();
    body.innerHTML = gmailBodyHTML(data, maxResults);
  } catch (e) {
    body.innerHTML = gmailBodyHTML({ connected: true, error: e.message || String(e) }, maxResults);
  }
  const select = body.querySelector("#gmailMaxResults");
  if (select) {
    select.addEventListener("change", () => {
      dashboardPrefs.widget_options.gmail.max_results = Number(select.value);
      persistPrefs();
      loadGmailWidgetInto(root);
    });
  }
  await wireGmailDigest(body);
  checkGmailForNewMail();
  startGmailDigestPolling();
}

function applyGmailDigest(body, digest) {
  const meta = body.querySelector("#gmailDigestMeta");
  const content = body.querySelector("#gmailDigestContent");
  if (!meta || !content) return;
  if (!digest) {
    meta.textContent = "sin interpretar todavía";
    content.innerHTML = "";
    return;
  }
  meta.textContent = "actualizado " + relativeTime(digest.generated_at);
  content.innerHTML = renderMarkdown(digest.digest_text || "");
}
async function refreshGmailDigest(body) {
  const btn = body.querySelector("#gmailDigestBtn");
  const meta = body.querySelector("#gmailDigestMeta");
  if (btn) { btn.disabled = true; btn.textContent = "interpretando..."; }
  else if (meta) meta.textContent = "interpretando...";
  try {
    const res = await apiFetch("/dashboard/widgets/gmail/digest/refresh", { method: "POST" });
    const data = await res.json();
    if (data.error) body.querySelector("#gmailDigestContent").innerHTML = errorBody(data.error);
    else applyGmailDigest(body, data.digest);
  } catch (e) {
    body.querySelector("#gmailDigestContent").innerHTML = errorBody(e.message || e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "interpretar bandeja"; }
  }
}
async function wireGmailDigest(body) {
  const btn = body.querySelector("#gmailDigestBtn");
  if (!btn) return;
  try {
    const res = await apiFetch("/dashboard/widgets/gmail/digest");
    const data = await res.json();
    if (data.connected) applyGmailDigest(body, data.digest);
  } catch (e) {}
  btn.addEventListener("click", () => refreshGmailDigest(body));
}

async function loadGoogleWidgetsInto(root, visibleIds) {
  const targets = GOOGLE_WIDGETS.filter((id) => visibleIds.includes(id));
  targets.forEach(async (id) => {
    if (id === "gmail") { loadGmailWidgetInto(root); return; }
    try {
      const res = await apiFetch(`/dashboard/widgets/${id}`);
      const data = await res.json();
      const body = root.querySelector(`[data-widget-id="${id}"] .dash-widget-body`);
      if (body) body.innerHTML = GOOGLE_WIDGET_FETCH[id](data);
    } catch (e) {
      const body = root.querySelector(`[data-widget-id="${id}"] .dash-widget-body`);
      if (body) body.innerHTML = errorBody(e.message || e);
    }
  });
}

function makeReorderable(containerOrContainers, onReorder) {
  const containers = Array.isArray(containerOrContainers) ? containerOrContainers : [containerOrContainers];
  const allCards = () => containers.flatMap((c) => [...c.querySelectorAll("[data-widget-id]")]);

  containers.forEach((container) => {
    container.querySelectorAll("[data-drag-handle]").forEach((handle) => {
      handle.addEventListener("pointerdown", (e) => {
        // Sin esto, el mousedown inicial dispara la selección de texto nativa
        // del navegador (arrastra sobre todo el contenido de la columna en vez
        // de mover el panel) antes de que el drag llegue a engancharse.
        e.preventDefault();
        const card = handle.closest("[data-widget-id]");
        const isTouch = e.pointerType === "touch";
        let dragging = false;
        let holdTimer = null;

        // Los listeners de mover/soltar van en document, no en el asa: en
        // cuanto el cursor/dedo se despega del asa (que es chica), un listener
        // puesto ahí deja de recibir eventos. setPointerCapture debería evitar
        // esto pero no siempre se comporta igual entre navegadores; document
        // siempre recibe el evento sin importar qué haya debajo del puntero.
        const begin = () => {
          dragging = true;
          isDraggingPanel = true;
          card.classList.add("dragging");
        };
        if (isTouch) holdTimer = setTimeout(begin, 350);
        else begin();

        const onMove = (ev) => {
          // No cancelamos el hold por jitter del dedo: el asa ya tiene
          // touch-action:none, así que el navegador no le va a robar el gesto
          // para hacer scroll aunque el dedo tiemble durante la espera.
          if (!dragging) return;
          ev.preventDefault();
          const siblings = allCards().filter((c) => c !== card);
          let inserted = false;
          for (const sib of siblings) {
            const rect = sib.getBoundingClientRect();
            if (ev.clientY < rect.top + rect.height / 2) {
              sib.parentElement.insertBefore(card, sib);
              inserted = true;
              break;
            }
          }
          if (!inserted) containers[containers.length - 1].appendChild(card);
        };
        const onUp = () => {
          if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          if (dragging) {
            card.classList.remove("dragging");
            isDraggingPanel = false;
            const newIds = allCards().map((c) => c.dataset.widgetId);
            onReorder(newIds);
          }
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    });
  });
}

function reorderWithinSubset(order, subsetIds, newSubsetOrder) {
  let idx = 0;
  return order.map((id) => (subsetIds.includes(id) ? newSubsetOrder[idx++] : id));
}

async function persistPrefs() {
  try {
    await apiFetch("/dashboard/preferences", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(dashboardPrefs),
    });
  } catch (e) {}
}

function visibleOrdered(ids) {
  return dashboardPrefs.panel_order.filter((id) => ids.includes(id) && dashboardPrefs.visible_widgets[id]);
}

function renderMobileDashboard(summary) {
  dashZoneTop.innerHTML = "";
  dashZoneRight.innerHTML = "";
  const ids = visibleOrdered(WIDGET_IDS);
  if (!ids.length) {
    dashboardInner.innerHTML = '<div class="dash-loading">no hay widgets activos — activá alguno en configuración</div>';
    return;
  }
  dashboardInner.innerHTML = `<div class="dash-grid">${ids.map((id) => widgetShell(id, widgetBodyHTML(id, summary), true)).join("")}</div>`;
  const grid = dashboardInner.querySelector(".dash-grid");
  makeReorderable(grid, (newIds) => {
    dashboardPrefs.panel_order = newIds;
    persistPrefs();
  });
  loadGoogleWidgetsInto(dashboardInner, ids);
}

function renderDesktopDashboard(summary) {
  dashboardInner.innerHTML = "";
  const combinedIds = visibleOrdered(TOP_AND_RIGHT_ZONE);
  const topIds = combinedIds.slice(0, 1);
  const rightIds = combinedIds.slice(1);
  const leftIds = visibleOrdered(LEFT_ZONE);

  dashZoneTop.innerHTML = topIds.map((id) => widgetShell(id, widgetBodyHTML(id, summary), true)).join("");
  dashZoneRight.innerHTML = rightIds.map((id) => widgetShell(id, widgetBodyHTML(id, summary), true)).join("");
  const existingLeftWidgets = dashZoneLeft.querySelectorAll(".dash-widget");
  existingLeftWidgets.forEach((el) => el.remove());
  dashZoneLeft.insertAdjacentHTML("beforeend", leftIds.map((id) => widgetShell(id, widgetBodyHTML(id, summary), false)).join(""));

  makeReorderable([dashZoneTop, dashZoneRight], (newIds) => {
    dashboardPrefs.panel_order = reorderWithinSubset(dashboardPrefs.panel_order, TOP_AND_RIGHT_ZONE, newIds);
    persistPrefs();
    renderDesktopDashboard(summary);
  });

  loadGoogleWidgetsInto(dashZoneTop, topIds);
  loadGoogleWidgetsInto(dashZoneRight, rightIds);
  refreshConvLists();
}

async function refreshDashboard() {
  try {
    if (!dashboardPrefs) dashboardPrefs = await (await apiFetch("/dashboard/preferences")).json();
    const summary = await (await apiFetch("/dashboard/summary")).json();
    lastSummary = summary;
    setUserLabel(summary.user_id);
    if (isDesktopDashboard()) renderDesktopDashboard(summary);
    else renderMobileDashboard(summary);
  } catch (e) {
    dashboardInner.innerHTML = '<div class="dash-loading">error cargando el dashboard</div>';
  }
}
apiFetch("/dashboard/summary").then((r) => r.json()).then((d) => setUserLabel(d.user_id)).catch(() => {});

/* ---------- panel de configuración ---------- */
function openSettings() {
  settingsOverlay.classList.add("open");
  settingsPanel.classList.add("open");
  renderSettingsList();
}
function closeSettings() {
  settingsOverlay.classList.remove("open");
  settingsPanel.classList.remove("open");
}
async function renderSettingsList() {
  if (!dashboardPrefs) dashboardPrefs = await (await apiFetch("/dashboard/preferences")).json();
  settingsList.innerHTML = WIDGET_IDS.map((id) => `
    <div class="settings-row">
      <span>${WIDGET_LABELS[id]}</span>
      <button class="settings-toggle ${dashboardPrefs.visible_widgets[id] ? "on" : ""}" data-widget-id="${id}"></button>
    </div>
  `).join("");
  settingsList.querySelectorAll(".settings-toggle").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.widgetId;
      dashboardPrefs.visible_widgets[id] = !dashboardPrefs.visible_widgets[id];
      btn.classList.toggle("on", dashboardPrefs.visible_widgets[id]);
      persistPrefs();
      if (currentView === "dashboard") refreshDashboard();
    });
  });
}
settingsBtn.addEventListener("click", () => { userMenu.classList.remove("open"); openSettings(); });
settingsCloseBtn.addEventListener("click", closeSettings);
settingsOverlay.addEventListener("click", closeSettings);

/* ---------- swipe entre chat y dashboard ---------- */
let touchStartX = null;
let touchStartY = null;
document.addEventListener("touchstart", (e) => {
  if (state === "listening" || isDraggingPanel) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touchStartX === null || isDraggingPanel) { touchStartX = null; return; }
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  touchStartX = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.6) {
    if (dx < 0 && currentView === "chat") showDashboard();
    else if (dx > 0 && currentView === "dashboard") showChat();
  }
}, { passive: true });

/* ---------- audio recording ---------- */
function pickMimeType() {
  const candidates = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
  for (const type of candidates) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
  }
  return "";
}
function extFor(mime) {
  if (mime.includes("mp4")) return "mp4";
  if (mime.includes("ogg")) return "ogg";
  return "webm";
}
async function startRecording() {
  // Se pide un stream nuevo en cada grabación (en vez de cachear uno para
  // siempre): en iOS Safari, backgrounding o bloqueo de pantalla suele matar
  // los tracks de un stream viejo sin avisar, y reusarlo produce grabaciones
  // vacías indistinguibles de "no funciona". El navegador no vuelve a pedir
  // permiso si ya fue otorgado para este origen.
  stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  chunks = [];
  const mimeType = pickMimeType();
  mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  recordedMimeType = mediaRecorder.mimeType || mimeType || "audio/webm";
  mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.start();
  setState("listening", "escuchando...");
}
function stopRecording() {
  return new Promise((resolve) => {
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      resolve(new Blob(chunks, { type: recordedMimeType }));
    };
    mediaRecorder.stop();
  });
}
async function transcribeBlob(blob) {
  const form = new FormData();
  form.append("file", blob, "audio." + extFor(blob.type || recordedMimeType));
  const res = await apiFetch("/transcribe", { method: "POST", body: form });
  if (!res.ok) throw new Error("transcribe HTTP " + res.status);
  const data = await res.json();
  return data.transcript || "";
}

async function sendText(text) {
  if (!text.trim()) { setState("idle", idleLabel()); return; }
  addMessage(text, "user");
  setState("thinking", "pensando...");
  showTyping();
  try {
    const res = await apiFetch("/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, conversation_id: conversationId }),
    });
    if (!res.ok) throw new Error("send HTTP " + res.status);
    const data = await res.json();
    hideTyping();
    addMessage(data.response, "snarf", ttsAvailable);
    setState("idle", idleLabel());
  } catch (e) {
    hideTyping();
    setState("error", "error: " + (e.message || e));
  }
}

async function handleClickMode() {
  unlockAudio();
  if (state === "error") setState("idle", idleLabel());
  if (state === "idle") {
    try { await startRecording(); } catch (e) { setState("error", "sin micrófono: " + (e.message || e)); }
  } else if (state === "listening") {
    setState("thinking", "transcribiendo...");
    try {
      const blob = await stopRecording();
      const transcript = await transcribeBlob(blob);
      if (!transcript.trim()) { setState("idle", "no se escuchó nada, probá de nuevo"); return; }
      reviewText.value = transcript;
      review.classList.add("visible");
      setState("idle", "revisá y enviá");
    } catch (e) { setState("error", "error: " + (e.message || e)); }
  }
}
async function handleHoldStart(e) {
  e.preventDefault();
  unlockAudio();
  if (state === "error") setState("idle", idleLabel());
  if (state !== "idle") return;
  try { await startRecording(); } catch (err) { setState("error", "sin micrófono: " + (err.message || err)); }
}
async function handleHoldEnd(e) {
  e.preventDefault();
  if (state !== "listening") return;
  setState("thinking", "transcribiendo...");
  try {
    const blob = await stopRecording();
    const transcript = await transcribeBlob(blob);
    await sendText(transcript);
  } catch (err) { setState("error", "error: " + (err.message || err)); }
}

orbWrap.addEventListener("click", () => { if (mode === "click") handleClickMode(); });
orbWrap.addEventListener("mousedown", (e) => { if (mode === "hold") handleHoldStart(e); });
orbWrap.addEventListener("mouseup", (e) => { if (mode === "hold") handleHoldEnd(e); });
orbWrap.addEventListener("mouseleave", (e) => { if (mode === "hold" && state === "listening") handleHoldEnd(e); });
orbWrap.addEventListener("touchstart", (e) => { if (mode === "hold") handleHoldStart(e); });
orbWrap.addEventListener("touchend", (e) => { if (mode === "hold") handleHoldEnd(e); });

document.getElementById("sendBtn").addEventListener("click", () => {
  review.classList.remove("visible");
  sendText(reviewText.value);
});
document.getElementById("cancelBtn").addEventListener("click", () => {
  review.classList.remove("visible");
  setState("idle", idleLabel());
});

function sendFromTextInput() {
  const text = textInput.value;
  textInput.value = "";
  unlockAudio();
  sendText(text).then(() => textInput.focus());
}
textSendBtn.addEventListener("click", sendFromTextInput);
textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); sendFromTextInput(); }
});

fetch("/status").then(r => r.json()).then(s => {
  ttsAvailable = !!s.tts_available;
  if (!s.stt_available || !s.tts_available) setState("error", "faltan credenciales de voz (ver .env)");
  else if (!s.llm_available) statusEl.textContent = "modo eco (sin ANTHROPIC_API_KEY)";
}).catch(() => {});
