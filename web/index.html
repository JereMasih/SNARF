/* ---------- reproductor de nota de voz embebido (por burbuja) ----------
   Un solo <audio> real (sharedAudio) alimenta a la burbuja que esté activa
   en cada momento — mismo criterio que cualquier reproductor de medios:
   solo suena una cosa a la vez. Reemplaza al reproductor flotante único de
   antes: cada nota de voz (propia o generada de una respuesta de Snarf)
   tiene su play/progreso/velocidad/menú propios, replayable las veces que
   haga falta sin tener que "cerrar" nada. */
let activeVoiceNotePlayer = null; // { wrap, playBtn, fill, timeEl } de la burbuja sonando ahora

function formatVoiceNoteTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${String(s).padStart(2, "0")}`;
}
function refreshActiveVoiceNoteProgress() {
  if (!activeVoiceNotePlayer) return;
  const { playBtn, fill, timeEl } = activeVoiceNotePlayer;
  playBtn.innerHTML = sharedAudio.paused ? ICONS.play : ICONS.pause;
  const pct = sharedAudio.duration ? (sharedAudio.currentTime / sharedAudio.duration) * 100 : 0;
  fill.style.width = pct.toFixed(1) + "%";
  timeEl.textContent = formatVoiceNoteTime(sharedAudio.currentTime) + " / " + formatVoiceNoteTime(sharedAudio.duration);
}
function deactivateVoiceNotePlayer() {
  if (!activeVoiceNotePlayer) return;
  const { playBtn, fill, timeEl, knownDuration } = activeVoiceNotePlayer;
  // sharedAudio.duration (todavía el de ESTE player, recién acá se desactiva
  // — el nuevo src se asigna después) es más confiable que el knownDuration
  // capturado al activar: si se tocó play enseguida de generarlo, el probe
  // de metadata todavía no había resuelto en ese momento.
  const totalDuration = Number.isFinite(sharedAudio.duration) && sharedAudio.duration > 0 ? sharedAudio.duration : knownDuration;
  playBtn.innerHTML = ICONS.play;
  fill.style.width = "0%";
  // Vuelve a mostrar la duración total conocida (no un "0:00" a secas) — no
  // hace falta perderla al pausar/cambiar a otra burbuja.
  timeEl.textContent = formatVoiceNoteTime(0) + " / " + formatVoiceNoteTime(totalDuration || 0);
  activeVoiceNotePlayer = null;
}
sharedAudio.addEventListener("timeupdate", refreshActiveVoiceNoteProgress);
sharedAudio.addEventListener("play", refreshActiveVoiceNoteProgress);
sharedAudio.addEventListener("pause", refreshActiveVoiceNoteProgress);
sharedAudio.addEventListener("ended", deactivateVoiceNotePlayer);

// audioId: id real servido por GET /audio/{id}. downloadName: nombre de
// archivo sugerido al descargar/compartir (sin extensión).
function buildVoiceNotePlayer(audioId, downloadName) {
  const wrap = document.createElement("div");
  wrap.className = "voice-note-player";
  const playBtn = document.createElement("button");
  playBtn.className = "vn-play-btn";
  playBtn.innerHTML = ICONS.play;
  playBtn.title = "reproducir";
  const progress = document.createElement("div");
  progress.className = "vn-progress";
  const fill = document.createElement("div");
  fill.className = "vn-progress-fill";
  progress.appendChild(fill);
  const timeEl = document.createElement("span");
  timeEl.className = "vn-time";
  timeEl.textContent = "0:00";
  const speedBtn = document.createElement("button");
  speedBtn.className = "vn-speed-btn";
  let speedIndex = SPEEDS.indexOf(1.25);
  speedBtn.textContent = SPEEDS[speedIndex] + "x";

  // Se conoce la duración total desde antes de tocar play — un <audio>
  // liviano aparte (nunca sharedAudio, que solo puede tener un src activo a
  // la vez) solo para leer metadata, sin descargar ni reproducir nada real.
  let knownDuration = 0;
  const probe = new Audio();
  probe.preload = "metadata";
  probe.src = "/audio/" + audioId;
  probe.addEventListener("loadedmetadata", () => {
    knownDuration = probe.duration;
    if (!isActive()) timeEl.textContent = formatVoiceNoteTime(0) + " / " + formatVoiceNoteTime(knownDuration);
  });

  const isActive = () => activeVoiceNotePlayer && activeVoiceNotePlayer.wrap === wrap;
  playBtn.addEventListener("click", () => {
    unlockAudio();
    if (isActive()) {
      if (sharedAudio.paused) sharedAudio.play().catch(() => {}); else sharedAudio.pause();
      return;
    }
    deactivateVoiceNotePlayer();
    activeVoiceNotePlayer = { wrap, playBtn, fill, timeEl, knownDuration };
    sharedAudio.src = "/audio/" + audioId;
    sharedAudio.playbackRate = SPEEDS[speedIndex];
    sharedAudio.currentTime = 0;
    sharedAudio.play().catch(() => {
      playBtn.textContent = "no se pudo reproducir";
      activeVoiceNotePlayer = null;
    });
  });
  progress.addEventListener("click", (e) => {
    if (!isActive() || !sharedAudio.duration) return;
    const rect = progress.getBoundingClientRect();
    sharedAudio.currentTime = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * sharedAudio.duration;
  });
  speedBtn.addEventListener("click", () => {
    speedIndex = (speedIndex + 1) % SPEEDS.length;
    speedBtn.textContent = SPEEDS[speedIndex] + "x";
    if (isActive()) sharedAudio.playbackRate = SPEEDS[speedIndex];
  });

  // Menú ⋮: compartir (Web Share API — iPhone/Android y algunos navegadores
  // de escritorio) y descargar (universal, <a download> real). Reusa el
  // mismo patrón visual de .conv-item-menu ya existente en la barra lateral.
  const menu = buildConvMenu([
    ...(navigator.canShare
      ? [{
          label: "compartir",
          onClick: async () => {
            try {
              const res = await apiFetch("/audio/" + audioId);
              const blob = await res.blob();
              const file = new File([blob], (downloadName || "nota-de-voz") + ".mp3", { type: blob.type || "audio/mpeg" });
              if (navigator.canShare({ files: [file] })) await navigator.share({ files: [file] });
            } catch (e) {}
          },
        }]
      : []),
    {
      label: "descargar",
      onClick: async () => {
        const res = await apiFetch("/audio/" + audioId);
        const blob = await res.blob();
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = (downloadName || "nota-de-voz") + ".mp3";
        a.click();
        URL.revokeObjectURL(a.href);
      },
    },
  ]);
  menu.classList.add("vn-menu");

  wrap.appendChild(playBtn);
  wrap.appendChild(progress);
  wrap.appendChild(timeEl);
  wrap.appendChild(speedBtn);
  wrap.appendChild(menu);
  return wrap;
}

/* ---------- sidebar / conversations ---------- */
function relativeTime(ts) {
  const diff = (Date.now() / 1000) - ts;
  if (diff < 60) return "ahora";
  if (diff < 3600) return Math.floor(diff / 60) + " min";
  if (diff < 86400) return Math.floor(diff / 3600) + " h";
  return Math.floor(diff / 86400) + " d";
}
function openSidebar() { sidebar.classList.add("open"); sidebarOverlay.classList.add("open"); refreshConvLists(); refreshProjectList(); }
function closeSidebar() {
  sidebar.classList.remove("open");
  sidebarOverlay.classList.remove("open");
  // El drawer lateral de Vista HUD (v2, declarado más abajo pero disponible
  // acá por hoisting de `function`) reusa esta misma función como su punto
  // de cierre "por selección" (elegir una conversación/proyecto) — no-op si
  // el drawer no está abierto o si está fijado.
  closeHudSidebarDrawer();
}
menuBtn.addEventListener("click", openSidebar);
sidebarOverlay.addEventListener("click", closeSidebar);

/* Menú contextual (⋮) por fila de conversación — mismo patrón que
   .user-menu/.user-menu-popover (wrapper con clase .open, cerrado por un
   click afuera). Reemplaza el icono 📁 suelto de la primera versión: ahora
   es un solo punto de entrada para todas las acciones de la fila. */
function closeAllConvMenus() {
  document.querySelectorAll(".conv-item-menu.open").forEach((m) => m.classList.remove("open"));
}
document.addEventListener("click", closeAllConvMenus);

function buildConvMenu(actions) {
  const wrap = document.createElement("div");
  wrap.className = "conv-item-menu";
  const btn = document.createElement("button");
  btn.className = "conv-item-menu-btn";
  btn.title = "opciones";
  btn.textContent = "⋮";
  const popover = document.createElement("div");
  popover.className = "conv-item-menu-popover";
  function renderRootActions() {
    popover.innerHTML = "";
    actions.forEach((a) => {
      const item = document.createElement("button");
      item.className = "conv-item-menu-item";
      item.textContent = a.label;
      item.addEventListener("click", (e) => {
        e.stopPropagation();
        a.onClick(popover);
      });
      popover.appendChild(item);
    });
  }
  renderRootActions();
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const willOpen = !wrap.classList.contains("open");
    closeAllConvMenus();
    if (willOpen) renderRootActions();
    wrap.classList.toggle("open", willOpen);
  });
  wrap.appendChild(btn);
  wrap.appendChild(popover);
  return wrap;
}

// Reemplaza el <select> anidado de la primera versión: clickear "mover a
// ..." transforma el mismo popover en la lista de proyectos disponibles
// (excluyendo el proyecto actual si la conversación ya está dentro de uno).
async function showMoveSubmenu(popover, conversationIdToMove, excludeProjectId) {
  popover.innerHTML = '<div class="conv-item-menu-empty">cargando...</div>';
  const res = await apiFetch("/projects");
  let projects = await res.json();
  if (excludeProjectId) projects = projects.filter((p) => p.id !== excludeProjectId);
  if (!projects.length) {
    popover.innerHTML = '<div class="conv-item-menu-empty">no hay otros proyectos</div>';
    return;
  }
  popover.innerHTML = "";
  projects.forEach((p) => {
    const item = document.createElement("button");
    item.className = "conv-item-menu-item";
    item.textContent = p.name;
    item.addEventListener("click", async (e) => {
      e.stopPropagation();
      await apiFetch(`/conversations/${conversationIdToMove}/project`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project_id: p.id }),
      });
      closeAllConvMenus();
      refreshConvLists();
      refreshProjectList();
    });
    popover.appendChild(item);
  });
}

function renderConvListInto(container, convs) {
  container.innerHTML = "";
  if (!convs.length) {
    container.innerHTML = '<div class="conv-empty">sin conversaciones todavía</div>';
    return;
  }
  convs.forEach(c => {
    const div = document.createElement("div");
    div.className = "conv-item" + (c.conversation_id === conversationId ? " active" : "");
    const row = document.createElement("div");
    row.className = "conv-item-row";
    const main = document.createElement("span");
    main.className = "conv-item-main";
    main.innerHTML = `${escapeHtml(c.title || "(sin título)")}<span class="conv-date">${relativeTime(c.last_activity)}</span>`;
    main.addEventListener("click", () => {
      // Esta lista es siempre de conversaciones SIN proyecto (GET
      // /conversations pide unassigned_only=true) — entrar acá nunca deja
      // currentProjectId de una visita anterior colgado.
      currentProjectId = null;
      loadConversation(c.conversation_id);
    });
    row.appendChild(main);
    row.appendChild(buildConvMenu([
      { label: "mover a un proyecto", onClick: (popover) => showMoveSubmenu(popover, c.conversation_id, null) },
    ]));
    div.appendChild(row);
    container.appendChild(div);
  });
}
async function refreshConvLists() {
  const targets = [convList, dashConvList].filter((el) => el && el.isConnected);
  if (!targets.length) return;
  try {
    const res = await apiFetch("/conversations");
    const convs = await res.json();
    targets.forEach((t) => renderConvListInto(t, convs));
  } catch (e) {
    targets.forEach((t) => { t.innerHTML = '<div class="conv-empty">error cargando conversaciones</div>'; });
  }
}

// Swipe hacia abajo desde arriba del todo del listado para refrescarlo — el
// indicador vive AFUERA de `listEl` (como hermano, justo antes) porque
// renderConvListInto() hace `container.innerHTML = ""` en cada refresh, y
// borraría cualquier cosa insertada adentro.
const PULL_REFRESH_THRESHOLD_PX = 60;
function enablePullToRefresh(listEl, indicatorEl, onRefresh) {
  let startY = 0;
  let pulling = false;
  listEl.addEventListener("pointerdown", (e) => {
    if (listEl.scrollTop > 0) return; // solo dispara si ya no hay más para scrollear hacia arriba
    startY = e.clientY;
    pulling = true;
  });
  listEl.addEventListener("pointermove", (e) => {
    if (!pulling) return;
    const dy = e.clientY - startY;
    if (dy <= 0 || listEl.scrollTop > 0) {
      pulling = false;
      indicatorEl.classList.remove("visible", "ready");
      return;
    }
    indicatorEl.classList.add("visible");
    const ready = dy > PULL_REFRESH_THRESHOLD_PX;
    indicatorEl.classList.toggle("ready", ready);
    indicatorEl.textContent = ready ? "↑ soltá para actualizar" : "↓ deslizá para actualizar";
  });
  const finish = async (e) => {
    if (!pulling) return;
    const dy = e && e.clientY != null ? e.clientY - startY : 0;
    pulling = false;
    if (dy > PULL_REFRESH_THRESHOLD_PX) {
      indicatorEl.textContent = "actualizando...";
      await onRefresh();
    }
    indicatorEl.classList.remove("visible", "ready");
    indicatorEl.textContent = "↓ deslizá para actualizar";
  };
  listEl.addEventListener("pointerup", finish);
  listEl.addEventListener("pointercancel", finish);
}
enablePullToRefresh(convList, convListPullIndicator, refreshConvLists);
enablePullToRefresh(dashConvList, dashConvListPullIndicator, refreshConvLists);

async function loadConversation(id) {
  // Un reintento pendiente (nota de voz o texto fallido) es propio de la
  // conversación donde ocurrió — cambiar de conversación lo abandona, nunca
  // debe quedar visible ni reintentarse contra la conversación equivocada.
  clearRetry();
  conversationId = id;
  pendingProjectHomeId = null;
  closeSidebar();
  clearChat();
  try {
    const res = await apiFetch("/conversations/" + id);
    const entries = await res.json();
    entries.forEach(e => {
      addMessage(e.input, "user", false, e.input_audio_id);
      addMessage(e.response, "snarf", ttsAvailable, null, e.speech, false, e.deliverable);
    });
  } catch (e) {
    addMessage("no se pudo cargar la conversación: " + (e.message || e), "snarf");
  }
  setState("idle", idleLabel());
  updateProjectHomeBtnVisibility();
}

function startNewConversation() {
  clearRetry();
  conversationId = crypto.randomUUID();
  currentProjectId = null;
  pendingProjectHomeId = null;
  clearChat();
  closeSidebar();
  setState("idle", idleLabel());
  refreshConvLists();
  refreshProjectList();
  updateProjectHomeBtnVisibility();
}
newConvBtn.addEventListener("click", startNewConversation);
dashNewConvBtn.addEventListener("click", startNewConversation);

/* ---------- Proyectos (Mark II) ----------
   Entrar a un proyecto desde la barra lateral ya no abre un modal aparte:
   escala la propia lista de la barra (muestra solo las conversaciones de
   ESE proyecto, con vuelta atrás) y muestra su "home" — estadísticas,
   resumen, prompt editable, tareas/notas — dentro del área de chat, en el
   lugar donde iría el historial de mensajes, mientras no haya ninguna
   conversación cargada todavía. */
// Duplicado a propósito con snarf/specialists/project_manager.py
// PROJECT_PROMPT_MAX_LENGTH — mismo precedente que GMAIL_MAX_RESULTS_CHOICES.
const PROJECT_PROMPT_MAX_LENGTH = 8000;

let currentProjectId = null;
let currentProjectName = null; // para la etiqueta de #projectContextBar; se fija cada vez que renderProjectHome recibe un proyecto real
// Seteado al entrar a un proyecto sin haber elegido/creado ninguna
// conversación todavía — si el usuario tipea directo (sin usar el botón "+
// nueva conversación de este proyecto"), sendText() genera y asigna la
// conversación recién en ese momento, para no crear conversaciones
// fantasma solo por mirar un proyecto.
let pendingProjectHomeId = null;

function renderProjectListInto(container, projects) {
  container.innerHTML = "";
  if (!projects.length) {
    container.innerHTML = '<div class="conv-empty">sin proyectos todavía</div>';
    return;
  }
  projects.forEach((p) => {
    const div = document.createElement("div");
    div.className = "conv-item";
    div.innerHTML = `${escapeHtml(p.name)}<span class="conv-date">${p.task_count} tarea(s) · ${p.note_count} nota(s)</span>`;
    div.addEventListener("click", () => enterProject(p.id));
    container.appendChild(div);
  });
}

function renderProjectConversationsInto(container, conversations) {
  container.innerHTML = "";
  const back = document.createElement("div");
  back.className = "conv-item";
  back.textContent = "← todos los proyectos";
  back.addEventListener("click", () => exitProject());
  container.appendChild(back);
  // Antes solo se podía arrancar una conversación nueva del proyecto desde
  // el home — acá también, mismo lugar donde vive "+ nuevo proyecto" en la
  // lista general.
  const newConvForProject = document.createElement("button");
  newConvForProject.className = "new-conv-btn";
  newConvForProject.textContent = "+ nueva conversación";
  newConvForProject.addEventListener("click", () => startNewProjectConversation(currentProjectId));
  container.appendChild(newConvForProject);
  if (!conversations.length) {
    container.insertAdjacentHTML("beforeend", '<div class="conv-empty">sin conversaciones todavía en este proyecto</div>');
    return;
  }
  conversations.forEach((c) => {
    const div = document.createElement("div");
    div.className = "conv-item" + (c.conversation_id === conversationId ? " active" : "");
    const row = document.createElement("div");
    row.className = "conv-item-row";
    const main = document.createElement("span");
    main.className = "conv-item-main";
    main.innerHTML = `${escapeHtml(c.title || "(sin título)")}<span class="conv-date">${relativeTime(c.last_activity)}</span>`;
    main.addEventListener("click", () => loadConversation(c.conversation_id));
    row.appendChild(main);
    row.appendChild(buildConvMenu([
      { label: "mover a otro proyecto", onClick: (popover) => showMoveSubmenu(popover, c.conversation_id, currentProjectId) },
      { label: "quitar del proyecto", onClick: async () => {
          await apiFetch(`/conversations/${c.conversation_id}/project`, { method: "DELETE" });
          refreshProjectList();
          refreshConvLists();
        } },
    ]));
    div.appendChild(row);
    container.appendChild(div);
  });
}

async function refreshProjectList() {
  const targets = [projectList, dashProjectList].filter((el) => el && el.isConnected);
  if (!targets.length) return;
  try {
    if (currentProjectId) {
      const res = await apiFetch(`/projects/${currentProjectId}/conversations`);
      if (!res.ok) throw new Error("proyecto no encontrado");
      const conversations = await res.json();
      targets.forEach((t) => renderProjectConversationsInto(t, conversations));
    } else {
      const res = await apiFetch("/projects");
      const projects = await res.json();
      targets.forEach((t) => renderProjectListInto(t, projects));
    }
  } catch (e) {
    targets.forEach((t) => { t.innerHTML = '<div class="conv-empty">error cargando proyectos</div>'; });
  }
}

function renderProjectHomeTasks(tasks) {
  const list = document.getElementById("projectHomeTaskList");
  if (!list) return;
  list.innerHTML = tasks.length
    ? tasks
        .map(
          (t) => `
      <div class="project-item-row" data-task-id="${t.id}">
        <span class="task-text${t.done ? " done" : ""}" data-action="toggle">${escapeHtml(t.text)}</span>
        <button class="project-item-delete" data-action="delete" title="borrar">✕</button>
      </div>`
        )
        .join("")
    : '<div class="project-empty">sin tareas todavía</div>';
}

function renderProjectHomeNotes(notes) {
  const list = document.getElementById("projectHomeNoteList");
  if (!list) return;
  list.innerHTML = notes.length
    ? notes
        .map(
          (n) => `
      <div class="project-item-row" data-note-id="${n.id}">
        <span class="task-text">${escapeHtml(n.text)}</span>
        <button class="project-item-delete" data-action="delete" title="borrar">✕</button>
      </div>`
        )
        .join("")
    : '<div class="project-empty">sin notas todavía</div>';
}

function renderProjectHome(project) {
  currentProjectName = project.name;
  chatInner.innerHTML = `
    <div class="project-home">
      <div class="project-home-head">
        <h2>${escapeHtml(project.name)}</h2>
        <div class="project-home-actions">
          <a href="https://drive.google.com/drive/folders/${encodeURIComponent(project.drive_folder_id || "")}" target="_blank" rel="noopener">abrir carpeta en Drive ↗</a>
        </div>
      </div>
      <div class="project-home-stats">
        <div class="project-stat"><strong>${project.file_count ?? "—"}</strong><span>archivo(s)</span></div>
        <div class="project-stat"><strong>${project.pending_task_count ?? 0}</strong><span>pendiente(s)</span></div>
        <div class="project-stat"><strong>${(project.notes || []).length}</strong><span>nota(s)</span></div>
      </div>
      <div class="project-section">
        <div class="project-section-head"><h4>Resumen</h4><button class="dash-mini-btn" id="projectHomeSummaryRefreshBtn">actualizar</button></div>
        <p class="project-home-summary">${escapeHtml(project.summary || "todavía sin resumen — usá \"actualizar\".")}</p>
      </div>
      <div class="project-section">
        <div class="project-section-head"><h4>Instrucciones del proyecto</h4></div>
        <div class="project-field">
          <textarea id="projectHomePromptInput" maxlength="${PROJECT_PROMPT_MAX_LENGTH}" placeholder="Instrucciones propias de este proyecto...">${escapeHtml(project.prompt || "")}</textarea>
          <div class="project-home-prompt-footer">
            <span id="projectHomePromptCount">${(project.prompt || "").length}/${PROJECT_PROMPT_MAX_LENGTH}</span>
            <button class="dash-mini-btn" id="projectHomePromptSaveBtn">guardar</button>
          </div>
        </div>
      </div>
      <div class="project-section">
        <div class="project-section-head"><h4>Tareas</h4><button class="dash-mini-btn" id="projectHomeAddTaskBtn">+ tarea</button></div>
        <div id="projectHomeTaskList"></div>
      </div>
      <div class="project-section">
        <div class="project-section-head"><h4>Notas</h4><button class="dash-mini-btn" id="projectHomeAddNoteBtn">+ nota</button></div>
        <div id="projectHomeNoteList"></div>
      </div>
      <button class="new-conv-btn" id="projectHomeNewConvBtn">+ nueva conversación de este proyecto</button>
      <button class="project-home-delete-btn" id="projectHomeDeleteBtn">borrar proyecto</button>
    </div>
  `;
  renderProjectHomeTasks(project.tasks || []);
  renderProjectHomeNotes(project.notes || []);

  const promptInput = document.getElementById("projectHomePromptInput");
  promptInput.addEventListener("input", () => {
    document.getElementById("projectHomePromptCount").textContent = `${promptInput.value.length}/${PROJECT_PROMPT_MAX_LENGTH}`;
  });
  document.getElementById("projectHomePromptSaveBtn").addEventListener("click", async () => {
    const res = await apiFetch(`/projects/${project.id}/prompt`, {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt: promptInput.value }),
    });
    if (res.ok) refreshProjectHome(project.id);
  });
  document.getElementById("projectHomeSummaryRefreshBtn").addEventListener("click", async () => {
    const res = await apiFetch(`/projects/${project.id}/summary/refresh`, { method: "POST" });
    if (res.ok) refreshProjectHome(project.id);
  });
  document.getElementById("projectHomeDeleteBtn").addEventListener("click", async () => {
    // No hay forma de replicar el protocolo de vista-previa-en-dos-turnos
    // del camino conversacional en un click — window.confirm es la
    // confirmación real que exige el backend (?confirmed=true).
    if (!confirm("¿Borrar este proyecto? Esto NO borra su carpeta ni sus archivos reales de Drive, solo el registro en Snarf.")) return;
    const res = await apiFetch(`/projects/${project.id}?confirmed=true`, { method: "DELETE" });
    if (res.ok) exitProject();
  });
  document.getElementById("projectHomeAddTaskBtn").addEventListener("click", async () => {
    const text = prompt("¿Qué tarea agregamos?");
    if (!text || !text.trim()) return;
    const res = await apiFetch(`/projects/${project.id}/tasks`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text.trim() }),
    });
    if (res.ok) { await refreshProjectHome(project.id); refreshProjectList(); }
  });
  document.getElementById("projectHomeTaskList").addEventListener("click", async (e) => {
    const row = e.target.closest("[data-task-id]");
    if (!row) return;
    const action = e.target.dataset.action;
    let res;
    if (action === "toggle") res = await apiFetch(`/projects/${project.id}/tasks/${row.dataset.taskId}`, { method: "PATCH" });
    else if (action === "delete") res = await apiFetch(`/projects/${project.id}/tasks/${row.dataset.taskId}`, { method: "DELETE" });
    if (res && res.ok) { await refreshProjectHome(project.id); refreshProjectList(); }
  });
  document.getElementById("projectHomeAddNoteBtn").addEventListener("click", async () => {
    const text = prompt("¿Qué anotamos?");
    if (!text || !text.trim()) return;
    const res = await apiFetch(`/projects/${project.id}/notes`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: text.trim() }),
    });
    if (res.ok) refreshProjectHome(project.id);
  });
  document.getElementById("projectHomeNoteList").addEventListener("click", async (e) => {
    const row = e.target.closest("[data-note-id]");
    if (!row || e.target.dataset.action !== "delete") return;
    const res = await apiFetch(`/projects/${project.id}/notes/${row.dataset.noteId}`, { method: "DELETE" });
    if (res.ok) refreshProjectHome(project.id);
  });
  document.getElementById("projectHomeNewConvBtn").addEventListener("click", () => startNewProjectConversation(project.id));
}

async function refreshProjectHome(projectId) {
  // Los endpoints de mutación (tasks/notes/prompt) devuelven el registro
  // crudo de ProjectManager, sin file_count/pending_task_count/summary —
  // esos campos solo los agrega el enriquecimiento de GET /projects/{id}
  // (evita pegarle a Drive real en cada tilde de tarea, solo al ver el home).
  const res = await apiFetch(`/projects/${projectId}`);
  if (res.ok) renderProjectHome(await res.json());
}

async function showProjectHome(id) {
  try {
    const res = await apiFetch(`/projects/${id}`);
    if (!res.ok) throw new Error("no encontrado");
    renderProjectHome(await res.json());
  } catch (e) {
    chatInner.innerHTML = `<div class="conv-empty">no se pudo abrir el proyecto: ${escapeHtml(e.message || String(e))}</div>`;
  }
}

// Visible solo mientras hay una conversación de proyecto abierta (nunca
// mientras se mira el propio home, donde ya está de más).
function updateProjectHomeBtnVisibility() {
  const insideProjectConversation = Boolean(currentProjectId) && Boolean(conversationId);
  projectHomeBtn.classList.toggle("visible", insideProjectConversation);
  // Antes no había ningún rastro de en qué proyecto está la conversación
  // abierta una vez que dejás de mirar el home — el fundador lo señaló como
  // falta real.
  projectContextBar.classList.toggle("visible", insideProjectConversation);
  if (insideProjectConversation) projectContextBar.textContent = "📁 " + (currentProjectName || currentProjectId);
}

async function enterProject(id) {
  currentProjectId = id;
  conversationId = null;
  pendingProjectHomeId = id;
  // showChat() apaga el modo Jarvis (ver applyJarvisMode) — correcto en
  // mobile, donde "chat" y "dashboard" son dos vistas separadas. En
  // escritorio el chat vive siempre reparentado DENTRO de la grilla del
  // dashboard; apagar Jarvis ahí solo oculta esa grilla y muestra el
  // #viewChat original (vacío desde que se reparentó su contenido al
  // arrancar) — pantalla en blanco real, bug encontrado en vivo.
  if (!isDesktopDashboard()) showChat();
  closeSidebar();
  setState("idle", idleLabel());
  await refreshProjectList();
  await showProjectHome(id);
  updateProjectHomeBtnVisibility();
}

function exitProject() {
  // A propósito NO reusa startNewConversation(): esa cierra la barra
  // lateral (correcto cuando el usuario explícitamente elige "+ nueva
  // conversación"), pero acá el usuario sigue navegando DENTRO de la barra
  // (volvió a la lista general de proyectos) — cerrarla de golpe sería
  // un salto de UI no pedido.
  currentProjectId = null;
  pendingProjectHomeId = null;
  conversationId = crypto.randomUUID();
  clearChat();
  setState("idle", idleLabel());
  refreshProjectList();
  refreshConvLists();
  updateProjectHomeBtnVisibility();
}

// Vuelve al home del proyecto actual sin salir de él (botón 🏠 fijo,
// visible mientras haya una conversación de proyecto cargada).
async function goToProjectHome() {
  if (!currentProjectId) return;
  conversationId = null;
  pendingProjectHomeId = currentProjectId;
  await showProjectHome(currentProjectId);
  updateProjectHomeBtnVisibility();
}
projectHomeBtn.addEventListener("click", goToProjectHome);

async function startNewProjectConversation(projectId) {
  conversationId = crypto.randomUUID();
  await apiFetch(`/conversations/${conversationId}/project`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ project_id: projectId }),
  });
  pendingProjectHomeId = null;
  clearChat();
  closeSidebar();
  setState("idle", idleLabel());
  refreshProjectList();
  updateProjectHomeBtnVisibility();
}

async function createProject() {
  const name = prompt("Nombre del proyecto nuevo:");
  if (!name || !name.trim()) return;
  const res = await apiFetch("/projects", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: name.trim() }),
  });
  if (res.ok) {
    const project = await res.json();
    await enterProject(project.id);
  }
}
newProjectBtn.addEventListener("click", createProject);
dashNewProjectBtn.addEventListener("click", createProject);

const USAGE_VENDOR_LABELS = {

// El refresco de la interpretación de Gmail es 100% impulsado por el
// navegador, nunca por el servidor: solo pasa mientras el dashboard está
// abierto y visible. La parte cara (llamar al LLM) solo se paga cuando la
// parte barata (comparar el id del último mensaje) detecta correo nuevo.
const GMAIL_DIGEST_POLL_MS = 5 * 60 * 1000;
let gmailPollTimer = null;

function stopGmailDigestPolling() {
  if (gmailPollTimer) { clearInterval(gmailPollTimer); gmailPollTimer = null; }
}
function startGmailDigestPolling() {
  stopGmailDigestPolling();
  gmailPollTimer = setInterval(() => checkGmailForNewMail(), GMAIL_DIGEST_POLL_MS);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopGmailDigestPolling(); stopBrainMiniPolling(); return; }
  if (currentView === "dashboard") {
    checkGmailForNewMail();
    startGmailDigestPolling();
    if (!brainPanel.classList.contains("open")) startBrainMiniPolling();
  }
});

async function checkGmailForNewMail() {
  // El widget de Gmail puede estar en cualquier zona (arriba, derecha, o la
  // columna única de mobile) según cómo el fundador haya reordenado los
  // paneles — se busca por id, no por contenedor fijo.
  const body = document.querySelector('[data-widget-id="gmail"] .dash-widget-body');
  if (!body) return;
  try {
    const [listRes, digestRes] = await Promise.all([
      apiFetch("/dashboard/widgets/gmail?max_results=1"),
      apiFetch("/dashboard/widgets/gmail/digest"),
    ]);
    const listData = await listRes.json();
    const digestData = await digestRes.json();
    if (!listData.connected || !digestData.connected) return;
    const currentTopId = listData.messages && listData.messages[0] ? listData.messages[0].id : null;
    const cached = digestData.digest;
    const isNew = currentTopId && (!cached || cached.latest_message_id !== currentTopId);
    if (isNew || !cached) {
      await refreshGmailDigest(body);
    }
  } catch (e) {
    // chequeo silencioso: si falla, se reintenta en el próximo ciclo o al abrir de nuevo.
  }
}

async function loadGmailWidgetInto(root) {
  const body = root.querySelector('[data-widget-id="gmail"] .dash-widget-body');
  if (!body) return;
  const maxResults = dashboardPrefs.widget_options.gmail.max_results;
  try {
    const res = await apiFetch(`/dashboard/widgets/gmail?max_results=${maxResults}`);
    const data = await res.json();
    body.innerHTML = gmailBodyHTML(data, maxResults);
  } catch (e) {
    body.innerHTML = gmailBodyHTML({ connected: true, error: e.message || String(e) }, maxResults);
  }
  const select = body.querySelector("#gmailMaxResults");
  if (select) {
    select.addEventListener("change", () => {
      dashboardPrefs.widget_options.gmail.max_results = Number(select.value);
      persistPrefs();
      loadGmailWidgetInto(root);
    });
  }
  await wireGmailDigest(body);
  checkGmailForNewMail();
  startGmailDigestPolling();
}

function applyGmailDigest(body, digest) {
  const meta = body.querySelector("#gmailDigestMeta");
  const content = body.querySelector("#gmailDigestContent");
  if (!meta || !content) return;
  if (!digest) {
    meta.textContent = "sin interpretar todavía";
    content.innerHTML = "";
    return;
  }
  meta.textContent = "actualizado " + relativeTime(digest.generated_at);
  // El texto del LLM interpreta y prioriza, pero es prosa libre — no se le
  // pide que invente fechas o links. La referencia real (con fecha y enlace
  // reales) se arma acá, a partir de los datos estructurados que ya vinieron
  // del propio Gmail, para que la interpretación no quede sin ninguno.
  const refRows = (digest.messages || [])
    .map((m) => {
      const url = `https://mail.google.com/mail/u/0/#all/${encodeURIComponent(m.id || "")}`;
      const meta = [m.from, gmailDate(m.date)].filter(Boolean).join(" · ");
      return `<div class="dash-row-stacked"><span class="dash-row-title"><a href="${url}" target="_blank" rel="noopener">${escapeHtml(m.subject || "(sin asunto)")}</a></span><span class="dash-row-sub">${escapeHtml(meta)}</span></div>`;
    })
    .join("");
  content.innerHTML =
    renderMarkdown(digest.digest_text || "") +
    (refRows ? `<div class="dash-gmail-digest-refs">${refRows}</div>` : "");
}
async function refreshGmailDigest(body) {
  const btn = body.querySelector("#gmailDigestBtn");
  const meta = body.querySelector("#gmailDigestMeta");
  if (btn) { btn.disabled = true; btn.textContent = "interpretando..."; }
  else if (meta) meta.textContent = "interpretando...";
  try {
    const res = await apiFetch("/dashboard/widgets/gmail/digest/refresh", { method: "POST" });
    const data = await res.json();
    if (data.error) body.querySelector("#gmailDigestContent").innerHTML = errorBody(data.error);
    else applyGmailDigest(body, data.digest);
  } catch (e) {
    body.querySelector("#gmailDigestContent").innerHTML = errorBody(e.message || e);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "interpretar bandeja"; }
  }
}
async function wireGmailDigest(body) {
  const btn = body.querySelector("#gmailDigestBtn");
  if (!btn) return;
  try {
    const res = await apiFetch("/dashboard/widgets/gmail/digest");
    const data = await res.json();
    if (data.connected) applyGmailDigest(body, data.digest);
  } catch (e) {}
  btn.addEventListener("click", () => refreshGmailDigest(body));
}

function brainLayoutRing(ids, cx, cy, ringRadius) {
  return ids.map((id, i) => {
    const angle = -Math.PI / 2 + i * ((2 * Math.PI) / ids.length);
    return { id, x: cx + ringRadius * Math.cos(angle), y: cy + ringRadius * Math.sin(angle) };

  const specialists = brainLayoutRing(BRAIN_SPECIALIST_ORDER, cx, cy, specialistRadius);
  const capabilities = brainLayoutRing(BRAIN_CAPABILITY_ORDER, cx, cy, capabilityRadius);
  return inputs.concat(specialists, capabilities);

// lugares (ver thinkingBrainPreviewHTML) sin duplicar el layout/rendering.

    const isSpecialist = BRAIN_SPECIALIST_ORDER.includes(p.id);
    const isInput = BRAIN_INPUT_ORDER.includes(p.id);
    const stateCls = brainStateClass(node);
    const r = brainNodeRadius(node.count, isSpecialist || isInput ? 3.5 : 3, isSpecialist || isInput ? 11 : 9, isSpecialist || isInput ? 2 : 1.7);
    const nodeCls = `brain-node ${brainColorClassFor(p.id)}${isSpecialist ? " brain-node-specialist" : ""} ${stateCls}`;

// se veía "vivo" ni crecer con el uso real, salvo que abrieras la pantalla

// que el resto de los widgets con polling propio (Gmail); se pausa cuando el
// panel de pantalla completa está abierto (ese ya tiene su propio poll más
// rico, con pulsos y flujo animado) para no pedir el mismo snapshot dos veces.
const BRAIN_MINI_POLL_MS = 4000;
let brainMiniPollTimer = null;
function stopBrainMiniPolling() {
  if (brainMiniPollTimer) { clearInterval(brainMiniPollTimer); brainMiniPollTimer = null; }
}
async function refreshBrainMiniWidget() {
  const body = document.querySelector('[data-widget-id="brain"] .dash-widget-body');
  if (!body || !body.isConnected) { stopBrainMiniPolling(); return; }
  try {
    const res = await apiFetch("/dashboard/brain");
    const data = await res.json();
    body.innerHTML = brainMiniBodyHTML(data);
  } catch (e) {
    // poll silencioso: se reintenta en el próximo ciclo.
  }
}
function startBrainMiniPolling() {
  stopBrainMiniPolling();
  brainMiniPollTimer = setInterval(refreshBrainMiniWidget, BRAIN_MINI_POLL_MS);
}

// Pantalla completa: grafo grande construido una sola vez (buildBrainGraphSkeleton)
// y actualizado en cada poll (applyBrainSnapshot) — solo mientras está abierta
// corre el polling en vivo, mismo criterio que el auto-refresh del digest de Gmail.
let brainGraphBuilt = false;
let brainNodeEls = {};
let brainIconEls = {};
let brainNodeGroupEls = {};
let brainNodeBaseRadius = {}; // radio original de cada nodo (antes de que un frame lo escale por profundidad)
// x/y/z originales de cada nodo, cacheados una sola vez al construir el
// esqueleto — evita leer cx/cy del DOM (getAttribute + parseFloat) en cada
// uno de los ~60 frames por segundo del render loop, un read-then-write
// real sobre decenas de nodos que causaba lag perceptible (bug real
// reportado tras esta ronda, ver ADR).
let brainNodeBasePos = {};
let brainEdgePaths = {};
let brainEdgeFlowPaths = {};
let brainPollTimer = null;
let brainSince = null;

function buildBrainGraphSkeleton() {
  const cx = 250, cy = 250, inputR = 65, specialistR = 125, capabilityR = 195;
  const layout = brainLayoutAllNodes(cx, cy, inputR, specialistR, capabilityR);
  const edgesG = document.getElementById("brainEdges");
  const flowsG = document.getElementById("brainEdgeFlows");
  const nodesG = document.getElementById("brainNodes");
  edgesG.innerHTML = "";
  flowsG.innerHTML = "";
  nodesG.innerHTML = "";
  brainNodeEls = {};
  brainIconEls = {};
  brainNodeGroupEls = {};
  brainNodeBaseRadius = {};
  brainNodeBasePos = {};
  brainEdgePaths = {};
  brainEdgeFlowPaths = {};

  // Anillos guía, puramente visuales: separan Entrada / Especialistas
  // Cognitivos / Capacidades, como los anillos concéntricos de un HUD tipo
  // Jarvis — más niveles, más profundidad.
  [inputR, specialistR, capabilityR].forEach((r) => {
    const ring = document.createElementNS(SVG_NS, "circle");
    ring.setAttribute("cx", cx);
    ring.setAttribute("cy", cy);
    ring.setAttribute("r", r);
    ring.setAttribute("class", "brain-ring");
    edgesG.appendChild(ring);
  });

  // Cada nodo (círculo + ícono) va envuelto en su propio <g> — es ESE grupo
  // el que recibe el transform de paralaje por profundidad (ver
  // applyBrainDepthParallax), nunca el círculo/ícono directo: esos ya tienen
  // su propia animación CSS de transform (brain-breathe/brain-heartbeat) y
  // un transform puesto por JS ahí se ignoraría (una animación CSS activa
  // le gana al atributo transform de SVG, no se combinan). El wrapper evita
  // el choque sin tocar esas animaciones.
  const centerGroup = document.createElementNS(SVG_NS, "g");
  nodesG.appendChild(centerGroup);
  brainNodeGroupEls.orchestrator = centerGroup;

  const centerCircle = document.createElementNS(SVG_NS, "circle");
  centerCircle.setAttribute("cx", cx);
  centerCircle.setAttribute("cy", cy);
  centerCircle.setAttribute("r", 30);
  centerCircle.setAttribute("class", "brain-node-center brain-color-white");
  centerGroup.appendChild(centerCircle);
  brainNodeEls.orchestrator = centerCircle;
  brainNodeBaseRadius.orchestrator = 30;
  brainNodeBasePos.orchestrator = { x: cx, y: cy, z: brainZForNode("orchestrator") };

  const centerIcon = createBrainNodeIconEl("orchestrator", cx, cy + 48, 22);
  centerIcon.classList.add("brain-color-white");
  centerGroup.appendChild(centerIcon);
  brainIconEls.orchestrator = centerIcon;

  layout.forEach((p) => {
    const isSpecialist = BRAIN_SPECIALIST_ORDER.includes(p.id);
    const isInput = BRAIN_INPUT_ORDER.includes(p.id);
    const colorCls = brainColorClassFor(p.id);
    const d = `M ${cx} ${cy} L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`;

    const path = document.createElementNS(SVG_NS, "path");
    path.setAttribute("id", `edge-${p.id}`);
    path.setAttribute("d", d);
    path.setAttribute("class", `brain-edge ${colorCls}`);
    edgesG.appendChild(path);
    brainEdgePaths[p.id] = path;

    // Path hermano, mismo trazado: la base de arriba nunca cambia de clase
    // (la referencia el <mpath> de cada pulso puntual); este overlay es el
    // que prende/apaga el flujo continuo según el nodo esté activo o no.
    const flowPath = document.createElementNS(SVG_NS, "path");
    flowPath.setAttribute("d", d);
    flowPath.setAttribute("class", `brain-edge ${colorCls}`);
    flowsG.appendChild(flowPath);
    brainEdgeFlowPaths[p.id] = flowPath;

    const group = document.createElementNS(SVG_NS, "g");
    nodesG.appendChild(group);
    brainNodeGroupEls[p.id] = group;

    const baseRadius = isSpecialist || isInput ? 14 : 11;
    const circle = document.createElementNS(SVG_NS, "circle");
    circle.setAttribute("cx", p.x.toFixed(1));
    circle.setAttribute("cy", p.y.toFixed(1));
    circle.setAttribute("r", baseRadius);
    circle.setAttribute("class", `brain-node ${colorCls}${isSpecialist ? " brain-node-specialist" : ""}`);
    group.appendChild(circle);
    brainNodeEls[p.id] = circle;
    brainNodeBaseRadius[p.id] = baseRadius;
    brainNodeBasePos[p.id] = { x: p.x, y: p.y, z: brainZForNode(p.id) };

    const iconY = p.y + (p.y > cy ? 24 : -18);
    const icon = createBrainNodeIconEl(p.id, p.x, iconY, 17);
    icon.classList.add(colorCls);
    group.appendChild(icon);
    brainIconEls[p.id] = icon;
  });

  resizeBrainCanvas();
  initBrainParticles();
  initBrainMesh();
}

// Mismo ícono/paths que el grafo (BRAIN_NODE_ICON_PATHS), a tamaño de texto
// — el fundador pidió que el feed de eventos muestre el ícono real de cada
// nodo junto al texto, como antes hacía con el emoji, pero con los íconos
// propios nuevos.
function brainFeedIconHTML(id) {
  const colorCls = brainColorClassFor(id);
  return `<svg class="brain-feed-icon ${colorCls}" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${BRAIN_NODE_ICON_PATHS[id] || ""}</svg>`;
}
function brainFeedRowHTML(ev) {
  const isError = ev.status !== "ok";
  const label = BRAIN_NODE_LABELS[ev.node] || ev.node;
  return `<div class="brain-feed-row">
    <span class="dash-dot ${isError ? "off" : "ok"}"></span>
    ${brainFeedIconHTML(ev.node)}
    <span class="brain-feed-label">${escapeHtml(label)} · ${escapeHtml(ev.label || "")}</span>
    <span class="brain-feed-time">${relativeTime(ev.timestamp)}</span>
  </div>`;
}
function renderBrainFeed(events, replace) {
  const rowsHtml = events
    .slice()
    .reverse()
    .map(brainFeedRowHTML)
    .join("");
  if (replace) brainFeedList.innerHTML = rowsHtml;
  else brainFeedList.insertAdjacentHTML("afterbegin", rowsHtml);
  while (brainFeedList.children.length > 60) brainFeedList.lastElementChild.remove();
}

function spawnPulse(ev) {
  const isError = ev.status !== "ok";
  // Cámara y partículas reaccionan a CUALQUIER evento real, incluido
  // unknown_tool en el centro — es la parte que realmente "actúa" ante lo
  // que pasa, aunque no haya un edge que recorrer.
  triggerBrainCameraFocus(ev.node);
  spawnBrainBurst(ev.node, isError);
  // unknown_tool: la falla es del modelo, no de una Capacidad — nunca viaja
  // por ningún edge, el centro ya se ve activo por su propio latido.
  if (ev.node === "orchestrator" || !brainEdgePaths[ev.node]) return;
  // Prioridad de color del pulso: error > categoría real de archivo > color
  // propio del nodo de origen. Un archivo real (imagen/audio/video/doc) se
  // ve distinto porque categorize_mime ya conoce su tipo real — nunca se
  // inventa una subcategoría (ej. "canción" vs "podcast") que el sistema no
  // puede saber.
  let colorCls;
  if (isError) colorCls = "brain-pulse-error";
  else if (ev.node === "input_file" && BRAIN_FILE_CATEGORY_PULSE_CLASS[ev.label]) colorCls = BRAIN_FILE_CATEGORY_PULSE_CLASS[ev.label];
  else colorCls = brainColorClassFor(ev.node);

  const circle = document.createElementNS(SVG_NS, "circle");
  circle.setAttribute("r", "4");
  circle.setAttribute("class", `brain-pulse ${colorCls}`);
  const anim = document.createElementNS(SVG_NS, "animateMotion");
  anim.setAttribute("dur", "0.9s");
  anim.setAttribute("fill", "freeze");
  const mpath = document.createElementNS(SVG_NS, "mpath");
  mpath.setAttributeNS(XLINK_NS, "href", `#edge-${ev.node}`);
  anim.appendChild(mpath);
  circle.appendChild(anim);
  document.getElementById("pulseLayer").appendChild(circle);
  try { anim.beginElement(); } catch (e) {}

  const cleanup = () => circle.remove();
  anim.addEventListener("endEvent", cleanup);
  setTimeout(cleanup, 1300); // defensivo, por si endEvent no dispara en algún motor
}

function applyBrainSnapshot(snap, spawnPulses) {
  const nodes = snap.nodes;
  const lastStatusByNode = {};
  snap.events.forEach((ev) => { lastStatusByNode[ev.node] = ev.status; });

  Object.keys(brainNodeEls).forEach((id) => {
    const node = nodes[id] || { count: 0, last_timestamp: null };
    const isSpecialist = BRAIN_SPECIALIST_ORDER.includes(id);
    const isInput = BRAIN_INPUT_ORDER.includes(id);
    const r = id === "orchestrator"
      ? brainNodeRadius(node.count, 24, 40, 5)
      : isSpecialist || isInput
        ? brainNodeRadius(node.count, 12, 24, 3)
        : brainNodeRadius(node.count, 9, 24, 4);
    brainNodeEls[id].setAttribute("r", r.toFixed(1));

    const stateCls = brainStateClass(node);
    brainNodeEls[id].classList.remove("brain-node-active", "brain-node-idle", "brain-node-ghost");
    brainNodeEls[id].classList.add(stateCls);
    // El ícono propio de cada nodo pulsa con la misma actividad real que el
    // círculo — mismas clases, mismas animaciones (brain-breathe/heartbeat
    // ya definidas en CSS), pedido explícito del fundador.
    const iconEl = brainIconEls[id];
    if (iconEl) {
      iconEl.classList.remove("brain-node-active", "brain-node-idle", "brain-node-ghost");
      iconEl.classList.add(stateCls);
    }

    const flowPath = brainEdgeFlowPaths[id];
    const active = stateCls === "brain-node-active";
    if (flowPath) {
      const isError = active && lastStatusByNode[id] && lastStatusByNode[id] !== "ok";
      flowPath.classList.toggle("brain-edge-flow", active);
      flowPath.classList.toggle("brain-edge-flow-error", isError);
    }
    // El flujo real ahora lo llevan las partículas del canvas (ver
    // spawnFlowParticle), no la línea del edge — este set es lo único que
    // necesita el loop de partículas para saber a qué nodos alimentar.
    if (active) activeBrainNodeIds.add(id); else activeBrainNodeIds.delete(id);
  });
  renderBrainFeed(snap.events, !spawnPulses);
  if (spawnPulses) {
    // Si un lote trae una ráfaga real (ej. una corrida de indexación), se
    // anima solo lo último para no disparar una tormenta de pulsos — el
    // resto igual queda reflejado en los conteos y en el feed.
    snap.events.slice(-12).forEach(spawnPulse);
  }
}

// ---- capa de partículas/resplandor/cámara (canvas, sobre el SVG ya construido) ----
// Nunca reemplaza la lógica de nodos/edges/colores de arriba — es pura
// atmósfera y foco de cámara sobre datos ya reales (qué nodo se enciende,
// cuándo). #brainGraphInner (SVG + canvas) se mueve siempre junto vía un
// único transform CSS, así el zoom hacia un nodo nunca desalinea las dos capas.
const BRAIN_VIEWBOX_SIZE = 500;
const BRAIN_AMBIENT_COLOR_NAMES = ["aqua", "violet", "magenta", "white", "grey"];
const BRAIN_MAX_PARTICLES = 550;
let brainParticles = [];
// Nodos activos AHORA MISMO (actualizado en applyBrainSnapshot) — alimenta
// el flujo de partículas de spawnFlowParticle en cada frame.
let activeBrainNodeIds = new Set();
let brainCanvasTransform = { scale: 1, offsetX: 0, offsetY: 0 };
let brainAnimFrameId = null;
let brainLastFrameTs = null;
let brainFocusResetTimer = null;
const brainCamera = { x: 250, y: 250, zoom: 1, targetX: 250, targetY: 250, targetZoom: 1 };

function brainCssColor(name) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(`--brain-${name}`).trim();
  return v || "#ffffff";
}
function resizeBrainCanvas() {
  const rect = brainGraphInner.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const dpr = window.devicePixelRatio || 1;
  brainParticlesCanvas.width = Math.round(rect.width * dpr);
  brainParticlesCanvas.height = Math.round(rect.height * dpr);
  const contentSize = Math.min(rect.width, rect.height);
  brainCanvasTransform = {
    scale: contentSize / BRAIN_VIEWBOX_SIZE,
    offsetX: (rect.width - contentSize) / 2,
    offsetY: (rect.height - contentSize) / 2,
  };
}
function brainViewboxToCanvas(x, y) {
  return {
    x: brainCanvasTransform.offsetX + x * brainCanvasTransform.scale,
    y: brainCanvasTransform.offsetY + y * brainCanvasTransform.scale,
  };
}
// BRAIN_DEPTH_Z_RANGE: mismo rango que BRAIN_RING_Z (ver el motor de
// proyección más abajo) — las partículas ambiente/niebla se reparten al
// azar en todo ese volumen para que también participen de la rotación 3D
// real, no solo los nodos.
const BRAIN_DEPTH_Z_RANGE = [-120, 100];
function brainRandomZ() {
  return BRAIN_DEPTH_Z_RANGE[0] + Math.random() * (BRAIN_DEPTH_Z_RANGE[1] - BRAIN_DEPTH_Z_RANGE[0]);
}
function spawnAmbientParticle() {
  const depth = 0.3 + Math.random() * 0.7; // 0=lejos/tenue/lento, 1=cerca/brillante/rápido — profundidad real, no decorativa al azar puro
  return {
    kind: "ambient",
    x: Math.random() * BRAIN_VIEWBOX_SIZE,
    y: Math.random() * BRAIN_VIEWBOX_SIZE,
    z: brainRandomZ(),
    vx: (Math.random() - 0.5) * 22 * depth,
    vy: (Math.random() - 0.5) * 22 * depth,
    r: (0.7 + Math.random() * 1.8) * (0.5 + depth * 0.7),
    depth,
    color: brainCssColor(BRAIN_AMBIENT_COLOR_NAMES[Math.floor(Math.random() * BRAIN_AMBIENT_COLOR_NAMES.length)]),
    alpha: 0.1 + Math.random() * 0.3,
  };
}
// Niebla lenta y grande, distinta de las partículas ambiente puntuales —
// pedido explícito del fundador ("un poco más de humo, de neblina de luz
// que fluya"), misma familia visual que Jarvis/Ultron: masas difusas de luz
// a la deriva, no puntos nítidos.
function spawnMistParticle() {
  const depth = 0.2 + Math.random() * 0.5;
  return {
    kind: "ambient",
    x: Math.random() * BRAIN_VIEWBOX_SIZE,
    y: Math.random() * BRAIN_VIEWBOX_SIZE,
    z: brainRandomZ(),
    vx: (Math.random() - 0.5) * 6 * depth,
    vy: (Math.random() - 0.5) * 6 * depth,
    r: 10 + Math.random() * 22,
    depth,
    color: brainCssColor(BRAIN_AMBIENT_COLOR_NAMES[Math.floor(Math.random() * BRAIN_AMBIENT_COLOR_NAMES.length)]),
    alpha: 0.03 + Math.random() * 0.05,
  };
}
function initBrainParticles() {
  const count = isDesktopDashboard() ? 110 : 55;
  const mistCount = isDesktopDashboard() ? 22 : 12;
  brainParticles = Array.from({ length: count }, spawnAmbientParticle).concat(
    Array.from({ length: mistCount }, spawnMistParticle)
  );
}

// ---- malla de filamentos (referencia real: capturas de Jarvis/Ultron
// pasadas por el fundador — una masa volumétrica de líneas finas tipo
// sinapsis, no un diagrama de nodos prolijo). Puramente atmósfera, igual
// que las partículas ambiente: no representa ningún dato propio, solo hace
// que el grafo real (nodos/edges/colores, sin tocar) se sienta como una
// entidad de luz densa en vez de un esquema plano. Generada una sola vez al
// construir el grafo — se anima con jitter por frame, no se recalcula.
const BRAIN_MESH_LINK_DIST = 78;
const BRAIN_MESH_SATELLITES_PER_NODE = 9;
const BRAIN_MESH_NEIGHBORS = 4;
let brainMeshPoints = [];
let brainMeshLinks = [];
let brainMeshLinksByColor = new Map(); // agrupados una sola vez al construir la malla — dibujar un solo path por color en vez de un stroke() por link (hasta ~500 links/frame) es lo que evita el lag real reportado en dispositivos más débiles

function initBrainMesh() {
  brainMeshPoints = [];
  brainMeshLinks = [];
  brainMeshLinksByColor = new Map();
  Object.entries(brainNodeEls).forEach(([id, el]) => {
    const cx = parseFloat(el.getAttribute("cx")) || 250;
    const cy = parseFloat(el.getAttribute("cy")) || 250;
    const z = brainZForNode(id); // los satélites orbitan a la misma profundidad que su nodo — se mueven juntos al rotar
    const color = getComputedStyle(el).color;
    for (let i = 0; i < BRAIN_MESH_SATELLITES_PER_NODE; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 10 + Math.random() * 46;
      brainMeshPoints.push({
        x: cx + Math.cos(angle) * dist,
        y: cy + Math.sin(angle) * dist,
        z,
        color,
        phase: Math.random() * Math.PI * 2,
      });
    }
  });
  // Enlaza cada punto con sus ~3 vecinos reales más cercanos dentro de un
  // radio — así la malla queda densa cerca de cada nodo y rala entre
  // regiones distintas, en vez de una nube uniforme sin forma.
  for (let i = 0; i < brainMeshPoints.length; i++) {
    const candidates = [];
    for (let j = 0; j < brainMeshPoints.length; j++) {
      if (i === j) continue;
      const dx = brainMeshPoints[i].x - brainMeshPoints[j].x;
      const dy = brainMeshPoints[i].y - brainMeshPoints[j].y;
      const d = Math.hypot(dx, dy);
      if (d < BRAIN_MESH_LINK_DIST) candidates.push({ j, d });
    }
    candidates.sort((a, b) => a.d - b.d);
    candidates.slice(0, BRAIN_MESH_NEIGHBORS).forEach(({ j }) => {
      const key = i < j ? `${i}_${j}` : `${j}_${i}`;
      if (!brainMeshLinks.some((l) => l.key === key)) brainMeshLinks.push({ key, a: i, b: j });
    });
  }
  brainMeshLinks.forEach((link) => {
    const color = brainMeshPoints[link.a].color;
    if (!brainMeshLinksByColor.has(color)) brainMeshLinksByColor.set(color, []);
    brainMeshLinksByColor.get(color).push(link);
  });
}
function drawBrainAura(ctx, ts) {
  const t = ts / 1000;
  const breathe = 0.85 + Math.sin(t * 0.25) * 0.15; // nunca del todo estática, ni en reposo
  const center = brainViewboxToCanvas(250, 250);
  const radius = 235 * brainCanvasTransform.scale;
  const grad = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, radius);
  grad.addColorStop(0, `rgba(161,36,255,${(0.11 * breathe).toFixed(3)})`);
  grad.addColorStop(0.55, `rgba(0,255,222,${(0.07 * breathe).toFixed(3)})`);
  grad.addColorStop(1, "transparent");
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 1;
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(center.x, center.y, radius, 0, Math.PI * 2);
  ctx.fill();
}
function drawBrainMesh(ctx, ts) {
  const t = ts / 1000;
  ctx.globalCompositeOperation = "lighter";
  ctx.lineWidth = Math.max(0.5, 0.9 * brainCanvasTransform.scale);
  ctx.globalAlpha = 0.19;

        // Los listeners de mover/soltar van en document, no en el asa: en
        // cuanto el cursor/dedo se despega del asa (que es chica), un listener
        // puesto ahí deja de recibir eventos. setPointerCapture debería evitar
        // esto pero no siempre se comporta igual entre navegadores; document
        // siempre recibe el evento sin importar qué haya debajo del puntero.
        const begin = () => {
          dragging = true;
          isDraggingPanel = true;
          card.classList.add("dragging");
        };
        if (isTouch) holdTimer = setTimeout(begin, 350);
        else begin();

        const onMove = (ev) => {
          // No cancelamos el hold por jitter del dedo: el asa ya tiene
          // touch-action:none, así que el navegador no le va a robar el gesto
          // para hacer scroll aunque el dedo tiemble durante la espera.
          if (!dragging) return;
          ev.preventDefault();
          const siblings = allCards().filter((c) => c !== card);
          let inserted = false;
          for (const sib of siblings) {
            const rect = sib.getBoundingClientRect();
            // 2D, no solo Y: con bloques de ancho variable en una grilla real
            // (antes todos tenían el mismo ancho), comparar solo la altura
            // ubicaba mal el punto de inserción en filas con más de un bloque.
            // "antes" de un hermano = está completamente arriba de su fila
            // (sin importar X), o está en su misma franja vertical y a la
            // izquierda de su punto medio horizontal.
            const before = ev.clientY < rect.top || (ev.clientY < rect.bottom && ev.clientX < rect.left + rect.width / 2);
            if (before) {
              sib.parentElement.insertBefore(card, sib);
              inserted = true;
              break;
            }
          }
          if (!inserted) containers[containers.length - 1].appendChild(card);
        };
        const onUp = () => {
          if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          if (dragging) {
            card.classList.remove("dragging");
            isDraggingPanel = false;
            const newIds = allCards().map((c) => c.dataset.widgetId);
            onReorder(newIds);
          }
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    });
  });
}

function reorderWithinSubset(order, subsetIds, newSubsetOrder) {
  // Un id del subset que hoy está oculto (no viene en newSubsetOrder) antes
  // igual consumía un idx++ — con casi todo compartiendo un solo scope de
  // reordenamiento (la grilla unificada), esto se dispara mucho más seguido
  // que antes. Si no está en el nuevo orden, se deja donde ya estaba.
  const newSet = new Set(newSubsetOrder);
  let idx = 0;
  return order.map((id) => (subsetIds.includes(id) && newSet.has(id) ? newSubsetOrder[idx++] : id));
}

function gridMetrics(gridEl) {
  const cs = getComputedStyle(gridEl);
  const colGap = parseFloat(cs.columnGap) || 0;
  const rowGap = parseFloat(cs.rowGap) || 0;
  // El navegador ya resuelve "repeat(12, 1fr)" a píxeles concretos acá — no
  // hace falta medir aparte, y queda correcto sin importar el ancho real del
  // contenedor en cada momento.
  const colWidth = parseFloat(cs.gridTemplateColumns.split(" ")[0]) || 1;
  const rowHeight = parseFloat(cs.gridAutoRows) || 28;
  return { colWidth, colGap, rowHeight, rowGap };
}

// Redimensionar es un gesto nuevo, separado del de arrastrar-para-reordenar
// — mismo estilo general (Pointer Events, listeners en document) pero mueve
// el borde del bloque en vez de su posición en el DOM.
function makeResizable(containerOrContainers, onResize) {
  const containers = Array.isArray(containerOrContainers) ? containerOrContainers : [containerOrContainers];
  containers.forEach((container) => {
    container.querySelectorAll("[data-resize-handle]").forEach((handle) => {
      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation(); // nunca debe interferir con el asa de arrastre del mismo bloque
        const card = handle.closest("[data-widget-id]");
        const grid = card.parentElement;
        const { colWidth, colGap, rowHeight, rowGap } = gridMetrics(grid);
        const startX = e.clientX, startY = e.clientY;
        const startRect = card.getBoundingClientRect();
        const startColSpan = Math.max(1, Math.round((startRect.width + colGap) / (colWidth + colGap)));
        const startRowSpan = Math.max(1, Math.round((startRect.height + rowGap) / (rowHeight + rowGap)));
        card.classList.add("resizing");
        isDraggingPanel = true; // reusa la misma bandera para que el swipe/otros gestos no interfieran
        let colSpan = startColSpan, rowSpan = startRowSpan;

        const onMove = (ev) => {
          const deltaCol = Math.round((ev.clientX - startX) / (colWidth + colGap));
          const deltaRow = Math.round((ev.clientY - startY) / (rowHeight + rowGap));
          colSpan = clamp(startColSpan + deltaCol, MIN_COL_SPAN, MAX_COL_SPAN);
          rowSpan = clamp(startRowSpan + deltaRow, MIN_ROW_SPAN, MAX_ROW_SPAN);
          card.style.gridColumn = `span ${colSpan}`;
          card.style.gridRow = `span ${rowSpan}`;
        };
        const onUp = () => {
          document.removeEventListener("pointermove", onMove);
          document.removeEventListener("pointerup", onUp);
          document.removeEventListener("pointercancel", onUp);
          card.classList.remove("resizing");
          isDraggingPanel = false;
          onResize(card.dataset.widgetId, colSpan, rowSpan);
        };
        document.addEventListener("pointermove", onMove);
        document.addEventListener("pointerup", onUp);
        document.addEventListener("pointercancel", onUp);
      });
    });
  });
}

let llmRoutingState = null;
async function renderLlmRoutingSection() {
  const data = await (await apiFetch("/llm-routing")).json();
  llmRoutingState = data.routing;
  const available = new Set(data.available_providers);
  llmRoutingList.innerHTML = LLM_ROLES.map(({ role, label }) => {
    const current = llmRoutingState[role] || {};
    const options = LLM_PRESETS.map((p) => {
      const selected = p.provider === current.provider && p.model === current.model;
      const usable = available.has(p.provider);
      const optLabel = usable ? p.label : `${p.label} — sin credencial`;
      return `<option value="${p.provider}|${p.model}" ${selected ? "selected" : ""} ${usable ? "" : "disabled"}>${escapeHtml(optLabel)}</option>`;

    return `<div class="llm-routing-row"><label>${escapeHtml(label)}</label><select data-role="${role}">${options}</select></div>`;
  }).join("");
  llmRoutingList.querySelectorAll("select").forEach((sel) => {
    sel.addEventListener("change", () => persistLlmRouting(sel.dataset.role, sel.value));
  });
}
async function persistLlmRouting(role, value) {
  const [provider, model] = value.split("|");
  try {
    const data = await (await apiFetch("/llm-routing", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ [role]: { provider, model } }),

  } catch (e) {}
}

// Chat e historial no se reconstruyen por HTML como los demás widgets — son
// nodos vivos con listeners atados (grabación, textarea, audio, refresco de
// conversaciones). wrapExistingAsBlock los mueve (nunca clona) a un wrapper
// .dash-widget nuevo, la primera vez que arranca en desktop.
function wrapExistingAsBlock(id, bodyEl, { draggable = true, resizable = true } = {}) {
  const wrapper = document.createElement("div");
  wrapper.className = "dash-widget";
  wrapper.dataset.widgetId = id;
  if (resizable) applyBlockSpan(wrapper, id);
  const head = document.createElement("div");
  head.className = "dash-widget-head";
  head.innerHTML = `<h3>${WIDGET_LABELS[id]}</h3>` + (draggable ? `<span class="dash-drag-handle" data-drag-handle>${ICONS.drag}</span>` : "");
  const sub = document.createElement("div");
  sub.className = "dash-widget-sub";
  sub.textContent = WIDGET_SUBTITLES[id] || "";
  wrapper.appendChild(head);
  wrapper.appendChild(sub);
  wrapper.appendChild(bodyEl); // mueve el nodo vivo, no lo duplica
  if (resizable) {
    wrapper.insertAdjacentHTML("beforeend", `<span class="dash-resize-handle" data-resize-handle title="arrastrá para cambiar el tamaño">${ICONS.resize}</span>`);
  }
  return wrapper;
}

function renderDesktopDashboard(summary) {
  const ids = visibleOrdered(DESKTOP_BLOCK_IDS); // siempre incluye chat/historial (forzado en el backend)
  const rest = ids.filter((id) => !ALWAYS_VISIBLE_BLOCK_IDS.includes(id));

  dashGridDesktop.querySelectorAll("[data-widget-id]").forEach((el) => {
    if (!ALWAYS_VISIBLE_BLOCK_IDS.includes(el.dataset.widgetId)) el.remove();
  });
  dashGridDesktop.insertAdjacentHTML(
    "beforeend",
    rest.map((id) => widgetShell(id, widgetBodyHTML(id, summary), { draggable: true, resizable: true })).join("")
  );

  // Reordena TODO (los widgets recién reconstruidos + chat/historial, que
  // son permanentes) al orden real guardado — appendChild sobre un nodo ya
  // existente lo MUEVE, así que este único loop deja el DOM en el orden correcto.
  ids.forEach((id) => {
    const el = dashGridDesktop.querySelector(`[data-widget-id="${id}"]`);
    if (el) { applyBlockSpan(el, id); dashGridDesktop.appendChild(el); }
  });

  makeReorderable(dashGridDesktop, (newIds) => {
    dashboardPrefs.panel_order = reorderWithinSubset(dashboardPrefs.panel_order, DESKTOP_BLOCK_IDS, newIds);
    persistPrefs();
  });
  makeResizable(dashGridDesktop, (id, colSpan, rowSpan) => {
    dashboardPrefs.widget_options[id] = { ...(dashboardPrefs.widget_options[id] || {}), col_span: colSpan, row_span: rowSpan };
    persistPrefs();
  });

  loadGoogleWidgetsInto(dashGridDesktop, rest);
  if (rest.includes("brain")) loadBrainWidgetInto(dashGridDesktop);
  if (rest.includes("usage")) loadUsageWidgetInto(dashGridDesktop);
  refreshConvLists();
  refreshProjectList();
}

async function refreshDashboard() {
  try {
    if (!dashboardPrefs) dashboardPrefs = await (await apiFetch("/dashboard/preferences")).json();
    const summary = await (await apiFetch("/dashboard/summary")).json();
    lastSummary = summary;
    setUserLabel(summary.user_id);
    if (isDesktopDashboard()) {
      // Vista clásica/HUD (Decisión R, rediseño radial): setDashboardView
      // activa/desactiva todos los efectos reales (poll propio, reparentado
      // del chat) — acá solo se decide cuál mostrar según lo persistido, sin
      // volver a guardar la misma preferencia que ya se cargó.
      setDashboardView(dashboardPrefs.dashboard_view === "hud" ? "hud" : "classic", { skipPersist: true });
      if (dashboardPrefs.dashboard_view !== "hud") renderDesktopDashboard(summary);
    } else {
      renderMobileDashboard(summary);
    }
  } catch (e) {
    dashboardInner.innerHTML = '<div class="dash-loading">error cargando el dashboard</div>';
  }
}

// Vista HUD del dashboard — rediseño radial (ver plan/ADR correspondiente).
// TODO este bloque es aditivo: nada de arriba (renderDesktopDashboard,
// reparentChatIntoDashboard, etc.) se tocó — con el toggle en "clásica" el
// dashboard de siempre sigue funcionando exactamente igual, sin pasar nunca
// por acá (Decisión R: reversible de verdad, no solo en apariencia).
// ===========================================================================

// Estado en vivo del toggle — separado de dashboardPrefs.dashboard_view
// (que es la preferencia persistida) porque acá hace falta saber si los
// efectos de "estar en HUD ahora mismo" (poll corriendo, chat reparentado)
// ya se activaron, para no reactivarlos de nuevo en cada refreshDashboard().
let dashHudActive = false;
let dashHudPollTimer = null;
let dashHudNodeEls = {};
let dashHudLineEls = {};
let dashHudLastData = {};
let dashHudLastWidgets = [];

function setDashboardView(view, { skipPersist = false } = {}) {
  const isHud = view === "hud";
  dashboardPrefs.dashboard_view = isHud ? "hud" : "classic";
  dashGridDesktop.hidden = isHud;
  dashHudView.hidden = !isHud;
  dashViewToggleClassicBtn.classList.toggle("active", !isHud);
  dashViewToggleHudBtn.classList.toggle("active", isHud);
  dashViewToggleClassicBtn.setAttribute("aria-selected", String(!isHud));
  dashViewToggleHudBtn.setAttribute("aria-selected", String(isHud));
  if (!skipPersist) persistPrefs();
  if (isHud === dashHudActive) return; // ya estaba en ese estado — no repetir los efectos de abajo
  dashHudActive = isHud;
  document.body.classList.toggle("dash-hud-active", isHud);
  if (isHud) {
    chatDock.dataset.position = dashboardPrefs.hud_chat_position || "left";
    reparentChatIntoDock();
    chatDock.hidden = false;
    startDashHudPolling();

    forceCloseHudSidebarDrawer();
    reparentChatOutOfDock();
    renderDesktopDashboard(lastSummary || { capabilities: {}, memory: {}, cost: {} });

}
