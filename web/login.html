<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Snarf — acceso</title>
<style>
  :root {
    --glow: #4fd8e8;
    --glow-soft: #b6f5fb;
    --text-dim: #6f8891;
    --text: #d7eef2;
    --error: #e85a5a;
  }
  * { box-sizing: border-box; }
  html { background: #000; height: 100%; overflow-x: hidden; }
  body {
    margin: 0; min-height: 100dvh; background: #000; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .bg-glow {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 65% 55% at 50% 40%, #0c1c22 0%, #050a0c 45%, #000000 82%);
    z-index: 0;
  }
  .card {
    position: relative; z-index: 1;
    width: 100%; max-width: 340px;
    background: rgba(5,10,12,0.7);
    border: 1px solid rgba(79,216,232,0.3);
    border-radius: 16px;
    padding: 2rem 1.6rem;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 30px rgba(79,216,232,0.12);
  }
  .card h1 {
    margin: 0 0 0.3rem; font-size: 1.1rem; letter-spacing: 0.08em;
    color: var(--glow-soft); text-transform: uppercase; text-align: center;
  }
  .card p { margin: 0 0 1.4rem; font-size: 0.72rem; color: var(--text-dim); text-align: center; }
  input {
    width: 100%; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(79,216,232,0.3); border-radius: 10px;
    color: var(--text); font-family: inherit; font-size: 0.95rem;
    padding: 0.75rem 1rem; outline: none; margin-bottom: 0.9rem;
  }
  input:focus { border-color: var(--glow); }
  button {
    width: 100%; background: rgba(79,216,232,0.2);
    border: 1px solid var(--glow); color: var(--text);
    font-family: inherit; font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.06em; padding: 0.75rem; border-radius: 10px; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .error {
    min-height: 1.1em; font-size: 0.72rem; color: var(--error);
    text-align: center; margin-top: 0.8rem;
  }
  .divider {
    display: flex; align-items: center; gap: 0.7rem;
    margin: 1.1rem 0; color: var(--text-dim); font-size: 0.68rem;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: rgba(79,216,232,0.2);
  }
  .google-btn {
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
    width: 100%; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(79,216,232,0.3); border-radius: 10px;
    color: var(--text); font-family: inherit; font-size: 0.8rem;
    padding: 0.7rem; text-decoration: none; box-sizing: border-box;
  }
  .google-btn:hover { border-color: var(--glow); }
  .google-btn svg { flex-shrink: 0; }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <form class="card" id="loginForm">
    <h1>Snarf</h1>
    <p>acceso restringido</p>
    <input type="password" id="passwordInput" placeholder="contraseña" autocomplete="current-password" autofocus>
    <button type="submit" id="submitBtn">entrar</button>
    <div class="error" id="errorMsg"></div>
    <div class="divider">o</div>
    <a class="google-btn" href="/login/google">
      <svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.3-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.8 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.5 29.5 3.5 24 3.5c-7.5 0-14 4.3-17.7 11.2z"/>
        <path fill="#4CAF50" d="M24 44.5c5.4 0 10.3-1.9 14-5.1l-6.5-5.5c-2 1.5-4.6 2.4-7.5 2.4-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.9 40.1 16.4 44.5 24 44.5z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.4l6.5 5.5C41.6 35.9 44.5 30.4 44.5 24c0-1.2-.1-2.4-.3-3.5z"/>
      </svg>
      Iniciar sesión con Google
    </a>
  </form>

<script>
const form = document.getElementById("loginForm");
const passwordInput = document.getElementById("passwordInput");
const submitBtn = document.getElementById("submitBtn");
const errorMsg = document.getElementById("errorMsg");

// Fase 3 del plan de multi-usuario (ADR 0137): si venimos de un intento de
// login con Google que falló o fue cancelado (ver GET /google/oauth/callback
// en app.py), mostrar por qué en vez de dejar la pantalla muda.
const params = new URLSearchParams(window.location.search);
const googleError = params.get("google_error");
if (googleError) {
  errorMsg.textContent = googleError === "access_denied"
    ? "cancelaste el acceso con Google"
    : "no se pudo iniciar sesión con Google, probá de nuevo";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = passwordInput.value;
  if (!password) return;
  submitBtn.disabled = true;
  errorMsg.textContent = "";
  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    if (res.ok) {
      window.location.href = "/";
      return;
    }
    errorMsg.textContent = res.status === 401 ? "contraseña incorrecta" : "error del servidor, probá de nuevo";
  } catch (err) {
    errorMsg.textContent = "no se pudo conectar";
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
